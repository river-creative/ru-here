{n:"22", t:"Información Financiera", sec:"INFORMACIÓN FINANCIERA", h:`
<h3>PAGOS DE MATRÍCULA, CARGOS Y HONORARIOS</h3>
<p>Los estudiantes serán responsables de mantener sus cuentas al día. Estudiantes cuyas cuentas no estén al día para las fechas establecidas, no podrán asistir a clase hasta que el pago total de matrícula, cargos y honorarios sean procesados u otros arreglos sean coordinados con la Oficina Administrativa. Formas de pago aceptadas incluyen, entre otras: efectivo (cash); giros (money orders); cheque personal, cheque de negocio, cheque de viajero, cheque de iglesia, cheque de ministerio; Tarjetas de PayPal, Visa, MasterCard, American Express y Discover. Pagos con tarjeta podrán ser procesados en Populi. Los estudiantes patrocinados deberán mantenerse informados sobre las fechas de vencimiento para pagos de matrícula, honorarios y/o cargos adicionales. Los estudiantes serán responsables de informar a sus patrocinadores sobre las fechas y los pagos al igual que verificar con la Oficina Administrativa los pagos recibidos.</p>
<h3>ASISTENCIA FINANCIERA</h3>
<p>En este momento, no ofrecemos préstamos, u otra asistencia financiera. Los estudiantes serán responsables de todos los cargos. Para mejor asistir a los estudiantes tenemos planes de pagos disponibles para cargos de matrícula y honorarios. RU no acepta, participa ni busca elegibilidad para la ayuda financiera federal. Las becas PELL, GI Bill y los préstamos federales para estudiantes no se aceptan como métodos para el pago de la matrícula o cargos de RU. Las becas están disponibles. Cualquier beca ofrecida queda a discreción del Presidente de RU. Los estudiantes que reciben beca serán evaluados cada cuatrimestre y tendrán que cumplir con varios requisitos relacionados con la beca.</p>
<h3>CUOTA DE CUIDADO DE NIÑOS</h3>
<p>Revival Ministries International ofrece cuidado de niños a los estudiantes los cuales tienen hijos entre las edades de uno a cinco años. El costo de cuidado de niños durante las horas escolares es $210.00 por mes, por niño. El pago debe estar sometido a la Oficina Administrativa de la RU. Cuidado de niños es un privilegio y debe ser tratado como tal. La cuota de Cuidado de niños tiene que estar pagada en avance o el servicio estará suspendido. Las facturas serán enviadas por medio de la Oficina de la RU. Un recibo será emitido al momento que esté hecho cada pago para sus archivos personales financieras. Aceptamos efectivo, cheque y tarjeta de crédito. La misma política financiera que se usa para RU para cheques sin fondos y tarjetas de crédito rechazadas aplicará para cuidado de niños.</p>`},
{n:"23", t:"Información Financiera", sec:"INFORMACIÓN FINANCIERA", h:`
<h3>POLÍTICA DE DEVOLUCIÓN DE CHEQUE</h3>
<p>En el evento de un cheque ser devuelto a consecuencia de falta de fondos, el estudiante recibirá una carta de La Oficina Administrativa de RU. No se aceptarán cheques adicionales hasta que todo el dinero este pago incluyendo el cargo de $25.00 por cheque sin fondo. Inscripción a programas de la escuela puede estar suspendida hasta que el balance sea cancelado. Si el estudiante ha acumulado un total de tres (3) cheques devueltos, no podrá utilizar cheques como forma de pago hacia RBIE.</p>
<h3>POLÍTICA DE REEMBOLSO</h3>
<p>Reembolsos serán otorgados bajo las siguientes condiciones:</p>
<ul><li>Un estudiante ha completado el formulario de retiro necesario y este ha sido recibido por la Oficina</li></ul>
<p>Administrativa dentro de las primeras dos semanas a partir de la fecha de inicio del trimestre inicial, según lo indicado en el Calendario Académico Estudiantil de RU.</p>
<ul><li>Estudiante se mantiene en buena regla al momento del retiro</li><li>Estudiante no se retira a causa de una acción disciplinaria</li><li>Estudiante no tiene balance pendiente</li></ul>
<p>Cualquier estudiante que se retire de esta institución sin completar el procedimiento adecuado (completado el formulario de retiro requerido en persona), será responsable de la matrícula total con cargos adicionales y honorarios. Los formularios de retiro solo están disponibles a través de un asesor académico. Una vez que se completen los procedimientos de retiro adecuados, se proporcionará un reembolso completo de todo el dinero academico pagado. El primer día de clases se define como la fecha de inicio del trimestre indicada en el Calendario Académico Estudiantil de RU para cada ingreso, independientemente de cuándo el estudiante comience a asistir. La política de reembolso solo aplica a estudiantes que han completado los formularios de retiro correspondientes y hayan cumplido con las condiciones anteriores. Favor de esperar hasta 30 días para procesar el reembolso.</p>`},
{n:"24", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>CLASIFICACIÓN ESTUDIANTIL</h3>
<p>Una vez el estudiante sea inscrito en RU será clasificado de una las siguientes formas:</p>
<p>Estudiante Activo Estudiante activamente inscrito en el colegio, quien asiste a clase en búsqueda de adquirir un título de RU. Los estudiantes en búsqueda de un diploma deberán completar todos los documentos suplementales, más tener una entrevista con el Decano de RU si es aplicable.</p>
<p>Estudiante Inactivo Estudiante Inactivo es un estudiante que no ha asistido a clases por los menos un cuatrimestre durante el año académico o anteriormente se ha retirado del programa académico de la RU. Un estudiante inactivo tendrá su “rol estudiantil” y su “entrada de usuario” en Populi retirado.</p>
<p>Auditorio Los Auditores no son clasificados oficialmente como estudiantes; sin embargo, pueden participar en sesión de clase para el curso en lo cual están escritos. Un estudiante auditorio tendrá un identificador de “estudiante” en Populi; sin embargo, su estado de inscripción en la lista de clase estará etiquetado “Auditorio.”</p>`},
{n:"25", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<p><b>ASISTENCIA A CLASE</b> &ndash; Estudiantes en el campus Para obtener el mejor resultado posible del programa de nuestras escuelas, se recomienda que cada estudiante asista a todas las sesiones de clase de acuerdo al curso inscrito. Ausencias excesivas pueden afectar adversamente el promedio de calificación del estudiante, puede incluir fracaso y/o retirada automática del curso actual. El estudiante es responsable de completar todo el material asignado durante los días de ausencia.</p>
<ol><li>Ausencias de clases – Durante cada cuatrimestre, se les permitirá cuatro (4) días completos de</li></ol>
<p>ausencias de clases. Esta concesión es para casos de emergencia o circunstancias extremas.</p>
<ol><li>Ausencias excesivas de clases – Si excede las ausencias de clase permitidas, es posible que se le</li></ol>
<p>permita asistir a clases, aunque puede perder las horas de crédito del cuatrimestre. Las ausencias excesivas a clase afectan el estado de la beca de un estudiante. Cualquier estudiante becado que tenga cinco o más ausencias de clase perderá su beca académica.</p>
<ol><li>Violaciones de asistencia a clases – A los estudiantes se les permiten cuatro (4) ausencias de clase</li></ol>
<p>por cuatrimestre antes de que se tome cualquier medida. Una vez que un estudiante exceda sus cuatro (4) ausencias de clase permitidas, recibirá una "Advertencia de asistencia" en su perfil de estudiante en Populi. Los estudiantes que continúen ausentes después de que se haya emitido la advertencia deberán reunirse con un asesor académico y se les colocará en "Período de prueba de asistencia" y se anotarán en su perfil de estudiante de Populi. Si las ausencias excesivas a clase no se resuelven después de esta reunión, Administración tomará una decisión sobre la continuación de la matrícula del estudiante.</p>
<ol><li>Cualquier estudiante ausente durante cinco (5) días consecutivos sin comunicación está sujeto a</li></ol>
<p>retiro automático por parte de la universidad.</p>
<ol><li>Asistencia – Cada estudiante estará comprobando su propia asistencia por el método provisto por</li></ol>
<p>la universidad. Entrenamiento será presentado durante la orientación de estudiantes. Su asistencia será considerada una ausencia si no comprueba que está presente por el medio designado.</p>
<ol><li>Cualquier persona que registre la asistencia de otro estudiante usando su equipo electrónico estará</li></ol>
<p>sujeto a suspensión y/o expulsión académica.</p>
<ol><li>Una vez que las clases hayan comenzado, los estudiantes tienen que permanecer sentados hasta</li></ol>
<p>que el instructor despida la clase. Los estudiantes solo podrán salir de sus asientos en caso de una emergencia extremada. Si un estudiante se va temprano, será marcado ausente por el día.</p>
<ol><li>El empleo que interfiere con el tiempo de clase no está permitido y no constituirá una razón para</li></ol>
<p>una ausencia escusada. TARDANZAS– Estudiantes en el campus Se espera que todos los estudiantes de RU asistan puntualmente a clases. Las clases comenzarán exactamente a la hora programada. Es imprescindible que cada estudiante llegue a tiempo a clase y esté sentado antes de que inicie cada sesión de clase. Los estudiantes deben permanecer en el aula durante todo el período de clase. Sonará un timbre de aviso de dos minutos que indicará que es momento de que los estudiantes se sienten en su sesión de clase actual. Los estudiantes que lleguen después de que suene el timbre de inicio de clase serán marcados como tardanza. Los estudiantes que lleguen más de diez (10) minutos después de que haya comenzado la clase serán marcados como ausentes. La acumulación de cuatro tardanzas se contará como una ausencia.</p>`},
{n:"26", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<p>ASISTENCIA A CLASES - Estudiantes en línea (solo programa en línea de M.A.) Para garantizar el mejor resultado posible del programa en línea de Maestría en Artes en Ministerio Práctico (solo estudiantes de 4o año), se alienta a los estudiantes a iniciar sesión semanalmente en los cursos en los que están inscritos. Todos los cursos se imparten en formatos de aprendizaje asincrónico. Las actividades asincrónicas son aquellas a las que los estudiantes pueden conectarse en cualquier momento para completar las tareas antes de las fechas de vencimiento establecidas por el instructor del curso.</p>
<p><b>ASISTENCIA AL SERVICIO DE LA IGLESIA</b> &ndash; Todos los estudiantes Los estudiantes deben asistir al Evento Principal los servicios del domingo por la mañana, el domingo por la noche y el miércoles por la noche. Se anima a los estudiantes a asistir a todos los servicios de la iglesia y se tomará asistencia.</p>
<ol><li>Ausencias de servicio: durante cada cuatrimestre académico, el número máximo de ausencias de</li></ol>
<p>servicio permitidas es cuatro servicios. Estos subsidios son sólo para circunstancias extremas y emergencias.</p>
<ol><li>Violaciones de asistencia al servicio: a los estudiantes se les permiten cuatro (4) ausencias de</li></ol>
<p>servicio por trimestre antes de que se tome cualquier medida. Una vez que un estudiante exceda sus cuatro (4) ausencias de servicio permitidas, recibirá una notificación para reunirse con Administración. Si las ausencias excesivas no se resuelven después de esta reunión, Administración tomará una decisión sobre la suspensión en interiores y / o la continuación de la matrícula del estudiante.</p>
<ol><li>Ausencias excesivas del servicio: si excede las ausencias permitidas, es posible que se le permita</li></ol>
<p>asistir a los servicios, aunque puede perder su elegibilidad para graduarse.</p>
<ol><li>La asistencia es tomada por cada estudiante que se registra a través del método proporcionado</li></ol>
<p>por la escuela. La capacitación se proporcionará en la orientación. La falta de registro en la clase se considerará una ausencia.</p>
<ol><li>Cualquier persona que se registre para otro estudiante estará sujeta a despido inmediato.</li><li>Es responsabilidad del estudiante llegar a tiempo a los servicios, registrarse y permanecer</li></ol>
<p>durante la totalidad del servicio para garantizar que se cuente su asistencia.</p>
<ol><li>Los servicios dominicales matutinos (The Main Event) requieren tanto el registro de entrada</li></ol>
<p>como el de salida para recibir crédito completo de asistencia. Si no realiza el registro de salida después del servicio, será marcado como ausente. (Si está sirviendo en un MOH, su asistencia será tomada por el gerente de su departamento.)</p>`},
{n:"27", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>REQUISITOS ACADÉMICOS – TODAS LAS ESCUELAS</h3>
<h3>ASISTENCIA A CLASE</h3>
<p>Asistencia a clases es requerida durante las horas de 8:30 AM a 12:30PM de lunes a viernes. Hora de Capilla y Anuncios se considera parte del horario de clases y por lo tanto es mandatorio asistir. Los laboratorios se consideran tiempo de clase y la asistencia se toma por cada laboratorio en el que esté matriculado. Los laboratorios están programados durante la semana y requieren de aproximadamente 8 a 14 horas adicionales por semana fuera del horario de clases para completar los créditos del curso.</p>
<p>Asistencia a los Servicios Se requiere que todo estudiante asista al Evento Principal (The Main Event) los domingos en la mañana, el servicio del domingo en la noche y el miércoles en la noche. Los estudiantes que asisten a una iglesia local dentro del área (radio de 40 millas o menos) deben proporcionar la documentación adecuada de su pastor según lo requiera el Departamento UNITE comprobando su asistencia al servicio del domingo por la mañana para ser excusados del Evento Principal de la Iglesia The River at Tampa Bay. Los estudiantes de una iglesia local deben asistir a la Iglesia The River at Tampa Bay para los servicios del domingo por la noche y el miércoles por la noche. Consulte sus documentos del Ministerio de Ayudas para obtener más información.</p>
<p>TOMA EN CUENTA: Todos los estudiantes y auditores deben asistir a La Iglesia The River at Tampa Bay a menos que se haya concedido una excepción específica. Asistir a los servicios de La Iglesia The River at Tampa Bay no te hace un miembro.</p>
<p>Membrecía de la Iglesia Siendo estudiante en RU no se califique a usted como miembro de La Iglesia The River at Tampa Bay. Se ofrecerán clases de membresía a estudiantes interesados en ser miembros del Departamento Pastoral durante el año escolar.</p>
<p>Asistencia a Eventos Especiales Los estudiantes están obligados a asistir a todos los eventos especiales auspiciados por el ministerio y son considerados tiempo de clase. Estos incluyen, pero no se limitan a: Semana de Avivamiento, Conferencias de Ministros y Líderes de Otoño y Primavera, Campamento de Invierno, Conferencia de Hombres y Mujeres, Regalo de Pavo, Regalo de Juguetes, Semana Santa y servicios obligatorios como se indica en el manual del estudiante y el calendario académico y/o cualquier otro evento de Alcance (Outreach) que se lleve a cabo en The River at Tampa Bay Church. Esto incluye asistir a los servicios de los sábados durante conferencias y campamentos (campmeetings). El incumplimiento en la asistencia a estos eventos especiales constituirá motivo de período de prueba, suspensión u otra acción administrativa.</p>
<p>TOMA EN CUENTA: los estudiantes no deben acercarse, involucrarse, intercambiar información de contacto o intentar establecer contactos con los invitados especiales del pastor dentro o fuera de la propiedad o a través de las redes sociales.</p>
<p>Solicitudes de Asistencia para la Escuela de Sanidad River La Escuela de Sanidad River es un Ministerio de RMI para aquellos que buscan la sanidad divina de las enfermedades terminales. No es un curso de crédito ofrecido en los Institutos del Río. Es la política de los Institutos del Río que los estudiantes que desean asistir a la Escuela de Sanidad River deben hacerlo antes o después del año académico a menos que usted caiga en la categoría de enfermo terminal, que Dios permita que esto nunca sea el caso. Se requiere un formulario de solicitud para asistir a la Escuela de Sanidad (Healing School). Si es aprobado, el estudiante recibirá una notificación de la Administración para asistir.</p>`},
{n:"28", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<p><b>REQUISITOS ACADÉMICOS</b> &ndash; LABORATORIOS (para B.A. Programas en el campus) Laboratorio Ganando Almas Se requiere que cada estudiante asista a una clase de entrenamiento para ganar almas en adición a evangelizar en las calles semanalmente, con un total de 8 laboratorios por cuatrimestre. Se requiere que todo estudiante asista al Súper Sábado de Salvación (S.S.S.) el cual es programado una vez al mes. Consulte el programa de estudios del Laboratorio de Ganando Almas para obtener las fechas y más información de S.S.S. Laboratorio Centro de Llamadas Dependiendo del año escolar, se requiere que los estudiantes asistan y participen en uno de los laboratorios del centro de llamadas cada semana, con un total de 4 laboratorios por cuatrimestre. Los estudiantes necesitarán escanear su ID Estudiantil previo a su turno de horario. Se requiere que cada estudiante programe su turno para el centro de llamadas utilizando el programa de “Planning Center Online”. Consulte el programa de estudios del Laboratorio de Centro de Llamadas para obtener más información. Laboratorio de Excelencia Académica Los estudiantes de primer año que necesiten asistencia adicional en asuntos académicos se inscribirán en el Laboratorio de Excelencia Académica en lugar del Laboratorio del Centro de Llamadas. Los estudiantes participarán en un laboratorio cada semana para un total de ocho laboratorios por trimestre. Los estudiantes deben registrar la asistencia al aula del Laboratorio de Excelencia Académica utilizando el método proporcionado por el instructor. Los estudiantes deben programar su tiempo de estudio en el Laboratorio de Excelencia Académica utilizando el Centro de Planificación en Línea. Práctica del Ministerio de Ayudas Los estudiantes de primer año que hayan completado un semestre deben servir en el departamento del Ministerio de Ayuda (MOH, por sus siglas en inglés) que les sea asignado por UNITE cada dos domingos. Esto totalizará cuatro servicios por trimestre. Por favor, consulte el Programa del Laboratorio de MOH (MOH Lab Syllabus) para más información. Todos los estudiantes de segundo y tercer año deben servir en el departamento del Ministerio de Ayuda (MOH) que les sea asignado por UNITE cada dos domingos, y una noche entre semana en The Stand at the River at Tampa Bay Church cada dos semanas. Estos se alternarán de manera que totalicen ocho servicios en los que un estudiante deberá servir por trimestre. Por favor, consulte el Programa del Laboratorio de MOH para más información. Los estudiantes que no asistan a The River at Tampa Bay Church como su iglesia local deben completar un formulario de Acuerdo y Verificación de Iglesia Local (Home Church Agreement &amp; Verification), y devolverlo antes de la inscripción tardía. Una vez verificado, el pastor o líder de departamento de la iglesia local recibirá un formulario de Evaluación de MOH para Iglesia Local (MOH Home Church Evaluation), el cual deberá ser completado y entregado al final de cada trimestre. Estos formularios se utilizan para verificar que cada estudiante esté sirviendo regularmente en un ministerio de ayuda en su iglesia local los domingos por la mañana. Tenga en cuenta que los estudiantes con una Iglesia Local distinta a The River at Tampa Bay Church igualmente deben servir una noche entre semana en The Stand cada dos semanas, además de servir en su iglesia local los domingos por la mañana.</p>`},
{n:"29", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>REQUISITOS ACADÉMICOS – RIVER BIBLE INSTITUTE</h3>
<p>Ministerio de Prácticas Serviciales El Ministerio de Prácticas Serviciales (MSP) está diseñado para ayudar a los estudiantes en el proceso de enfocar sus metas educativas y espirituales, mientras estudian en el RU. El objetivo es permitir que los estudiantes experimenten varios departamentos ministeriales durante la semana después de las horas de clase para recibir una educación completa sobre cómo debe fluir y funcionar un ministerio exitoso. Al final del segundo año de la escuela, un estudiante debe tener un enfoque educativo para su internado. Por lo tanto, dependiendo el año escolar los estudiantes se les asignará un departamento de MSP. Consulte el programa de estudios del Laboratorio de MSP para obtener más información.</p>
<p>TENGA EN CUENTA: El programa de Maestría en Artes no tiene ningún requisito de laboratorio.</p>`},
{n:"30", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>POLÍTICA DE HORAS DE CRÉDITO</h3>
<p>Definición de la Hora de Crédito RU (RU) sigue la Definición Federal de Hora de Crédito (Código de Regulaciones Federales § 600.2). Con base en esa definición, una hora de crédito equivale razonablemente a no menos de…</p>
<ol><li>una hora de instrucción en el aula o instrucción directa por parte del profesorado y un mínimo de 2</li></ol>
<p>horas de trabajo estudiantil fuera de clase por semana, sumando aproximadamente 45 horas de trabajo por período; o</p>
<ol><li>al menos el equivalente a 45 horas de trabajo por período para otras actividades académicas</li></ol>
<p>establecidas por RU, incluyendo trabajo de laboratorio, prácticas y trabajo de estudio. Esta definición le permite a RU determinar la cantidad de trabajo asociado con una hora de crédito, considerando mediciones del trabajo estudiantil, calendarios académicos, disciplinas y niveles de titulación.</p>
<h3>MÉTODO DE ENSEÑANZA POR INSTRUCCIÓN DIRECTA ACELERADA</h3>
<p>Instrucción Directa Acelerada (presencial): as secciones de los cursos normalmente se reúnen una vez por semana durante 4 horas, con suficiente trabajo fuera de clase de manera que cada hora de crédito represente no menos de 45 horas de trabajo estudiantil. Expectativas para la Instrucción Directa Acelerada: Tiempo en Clase / Tiempo de Trabajo Fuera de Clase Hora de Credito 8 Semanas 1 hora de Crédito 2 horas de contacto/semana (100 minutos) más un mínimo de 4 horas de trabajo fuera de clase 2 hora de Crédito 4 horas de contacto/semana (200 minutos) más un mínimo de 8 horas de trabajo fuera de clase 3 hora de Crédito 6 horas de contacto/semana (300 minutos) más un mínimo de 12 horas de trabajo fuera de clase</p>
<h3>SISTEMA DE CALIFICACIONES</h3>
<p>Promedio de Porcentaje      Nota Calificación (GPA)</p>

{n:"31", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>REQUISITOS DE MATRÍCULA</h3>
<p>Los estudiantes deben mantener un promedio de calificaciones (GPA) mínimo de 2.00 durante su 1er año, 2.80 de GPA durante su 2do y 3er año, y 3.00 de GPA durante su 4to año, en cualquier trimestre en el que estén activamente inscritos y matriculados. Un curso que reciba una calificación final de "F" se considera una calificación reprobatoria. Si un estudiante recibe una calificación reprobatoria, no obtendrá crédito por ese curso individual y deberá buscar un plan de acción remedial, tal como se indica en la política a continuación.</p>
<h3>AVISO ACADEMICO</h3>
<p>Todo estudiante activo en RU tiene acceso a un Consejero Académico, quien se comunicará con el estudiante a lo largo del año escolar académico. Los estudiantes que deseen recibir asistencia académica en cuanto a orientación educativa, educación continua o consejería deben completar un Formulario de Solicitud de Reunión, el cual la Oficina Administrativa de RU remitirá a un consejero. La consejería académica está disponible para los estudiantes de iglesia local (home church). Sin embargo, los estudiantes de iglesia local deben recibir consejería pastoral en su iglesia local.</p>
<p>A continuación, se presenta una lista no exhaustiva de algunos de los temas que aborda un Consejero Académico:</p>
<ol><li>Ayudar a los estudiantes a reconocer y alcanzar sus metas educativas y espirituales.</li><li>Motivar a los estudiantes a aplicar un enfoque académico mientras persiguen y completan sus</li></ol>
<p>requisitos académicos.</p>
<ol><li>Asistir a los estudiantes con el equilibrio entre la vida estudiantil y personal para asegurar que</li></ol>
<p>alcancen su máximo potencial.</p>
<ol><li>Motivar a los estudiantes a desarrollar un sentido de comunidad entre compañeros, profesores y</li></ol>
<p>miembros de la iglesia local, The River Church at Tampa Bay.</p>
<ol><li>Reunirse y aconsejar a los estudiantes que soliciten retirarse, para asegurar que estén tomando la</li></ol>
<p>mejor decisión.</p>
<ol><li>Aconsejar a los estudiantes que estén reprobando sus estudios para identificar otras causas más</li></ol>
<p>allá de los obstáculos académicos, y ayudar a desarrollar un plan de éxito.</p>`},
{n:"32", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>PROCEDIMIENTO DISCIPLINARIO ACADÉMICO</h3>
<p>Estudiante que no ha mantenido el promedio (GPA) requerido por cada cuatrimestre, estará sujeto a las siguientes disciplinarias académicas procedimientos: Una Advertencia Académica es emitida al final del 1er cuatrimestre, a estudiantes de tiempo completo que no han mantenido el promedio requerido (GPA) o si tiene un grado de fracaso. El aviso académico consiste de una notificación por escrito de consecuencias si el estudiante continúa con un progreso insatisfactorio. Se requiere que el estudiante pague la matrícula para el curso fracasado sin plan de excelencia académica.</p>
<p><b>Una Probatoria Académica</b> &ndash; es el próximo paso a tomar si el estudiante mantiene un promedio (GPA) por debajo del requisito mínimo por dos cuatrimestres consecutivos o si tiene dos grados de fracaso. Procedimientos probatorios académicos aplique al estudiante inscrito que ha caído por debajo de requisitos matriculados. El estudiante será informado por escrito de parte de la administración académica que ha estado puesto en Periodo Académico de Prueba. El estudiante tendrá que reunirse con Administración para dialogar sobre las razones que rodean la continuación de notas por debajo de lo esperado. El estudiante será aconsejado y recibirá un plan paso por paso, para mejorar sus notas a un nivel aceptable mediante el desarrollo de un Plan de Éxito. El estudiante recibirá un tiempo pre-determinado para corregir la deficiencia académica. El expediente estudiantil permanente será documentado de la deficiencia y se requiere pagar la matrícula para el curso(s) fracas ado(s). Una Suspensión Académica es el paso final del proceso disciplinario. Cualquier estudiante que mantenga un promedio (GPA) menor de lo indicado al final de tres cuatrimestres consecutivos o tiene dos calificaciones fracasadas será informado por la escuela administrativa de la Suspensión Académica. El estudiante tendrá que reportarse a Administracion y será suspendido(a) por un período de tres días. Durante el periodo de suspensión habrá consejería disponible. El estudiante podrá apelar la suspensión académica presentando una carta escrita en un sobre sellado a la Administración. El Decano de RU se reunirá con el Presidente de la escuela antes de emitir un fallo final. El estudiante será notificado por escrito sobre los resultados de la apelación. La decisión emitida por el Presidente de la junta directiva es definitiva. Un Reinicio Académico es una opción para los estudiantes que no cumplen con los criterios del procedimiento disciplinario académico mencionado anteriormente, y se otorga a discreción de la Administración con base en una revisión del estado académico y las circunstancias generales del estudiante. Un Reinicio Académico permite que un estudiante reinicie el programa académico actual en el año académico en el que está inscrito. Esto constituye una parada total que requerirá que el estudiante vuelva a tomar todos los cursos del programa correspondientes a ese año académico. Cada Reinicio Académico requiere el pago de la Cuota General Vigente al momento de la reinscripción. Información Importante    RU se reserva el derecho de terminar la matrícula de un estudiante que sea colocado en advertencia académica, probatoria o suspensión.    Tres "F" en un programa de Licenciatura (B.A.) dentro de un año académico resultarán en la expulsión del estudiante de RU, y el estudiante no será elegible para un reembolso de matrícula o cuotas.    Una "F" en un programa de Maestría (M.A.) dentro de un año académico resultará en la expulsión del estudiante de RU, y el estudiante no será elegible para un reembolso de matrícula o cuotas.    No se ofrecerán Planes de Éxito a los estudiantes de 3er o 4to año durante su último trimestre.</p>`},
{n:"33", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>REQUISITOS ACADÉMICOS PARA ESTUDIANTES CON BECA</h3>
<p>Estudiantes de primer año con beca académica, necesitarán mantener un promedio mínimo (GPA) de 2.00. Estudiantes de segundo y tercer año con beca académica, necesitarán mantener un promedio mínimo (GPA) de 2.80. Los estudiantes de maestría con becas académicas deben mantener un promedio de calificaciones acumulativo (GPA) mínimo de 3.00.</p>
<p>Advertencia de Beca Estudiantes con beca que no mantienen el promedio mínimo (GPA) por cada cuatrimestre, recibirán una advertencia de beca. Esta advertencia es una notificación por escrito de las consecuencias que han de suceder si el estudiante continúa con notas insatisfactorias. Los estudiantes que reciban una advertencia de beca tendrán un cuatrimestre para corregir la deficiencia académica. Si el estudiante reclama el promedio acumulativo de puntos (GPA) podrá retener la beca.</p>
<p>Confiscación de Beca Los estudiantes con beca que permanezcan por debajo del promedio mínimo (GPA) por dos cuatrimestres consecutivos, perderán su beca académica.</p>
<p>Un curso que recibe una calificación final de "F" se considera una calificación reprobatoria. Los cursos reprobados pierden la cobertura financiera ofrecida por la beca RU. Si un estudiante recibe una calificación reprobatoria, no obtendrá crédito por ese curso individual. Al estudiante se le cobrará la matrícula en totalidad por las horas de crédito de cada curso reprobado.</p>`},
{n:"34", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>PROCEDIMIENTOS DE RETIRO</h3>
<p>Una vez que un estudiante ha sido admitido en la escuela, ese estudiante se considera matriculado pero no activo. Si un estudiante matriculado no se inscribe en sus cursos, el departamento de Admisiones le retirará la matrícula. Una vez que un estudiante está inscrito en los cursos, ese estudiante se considera activo. Por lo tanto, si el estudiante desea retirarse del programa, debe cumplir con el siguiente procedimiento de retiro para ser considerado “en regla" en caso de que decida volver a presentar una solicitud.</p>
<p>"En regla" se define como, entre otros, lo siguiente:</p>
<ul><li>Reunirse en persona para discutir el retiro</li><li>Sin saldos pendientes</li><li>Sin violaciones</li><li>Académicas</li><li>Sin violaciones disciplinarias</li></ul>
<ol><li>El estudiante necesitará comunicarse con su Asesor Académico y reunirse en persona con el asesor</li></ol>
<p>para obtener la Solicitud de Retiro de Estudios.</p>
<ol><li>El estudiante tendrá la oportunidad de explorar opciones alternativas las cuales pueden eliminar la</li></ol>
<p>necesidad de retiro. De llegarse a un acuerdo alterno, el estudiante puede derogar el retiro y continuar en el programa.</p>
<ol><li>De no llegarse a un acuerdo, el proceso de retiro continuará.</li><li>La solicitud de retiro tiene que ser firmada y entregada lo antes posible. El retiro no se considerará</li></ol>
<p>completado hasta ser firmado por el estudiante y devuelto a la Oficina Administrativa. El estudiante será responsable de cualquier matrícula, cargo u honorario pendiente.</p>
<ol><li>El estudiante se reunirá con la Administradora, quien evaluará el expediente del estudiante para ver si</li></ol>
<p>está en buen estatus con la institución y si tiene algún cargo pendiente. Toda matrícula y cargo tiene que ser cancelado o un plan de pago satisfactorio tiene que ser hecho en el momento del retiro.</p>
<ol><li>El Administrador o Asesor Académico recogerá todos los elementos de acceso al campus, es decir,</li></ol>
<p>tarjeta de identificación, pase de estacionamiento, etc.</p>
<ol><li>Si el estudiante no tiene un balance pendiente, podrá completar el proceso de retiro.</li><li>Si el estudiante tiene un reembolso pendiente, será otorgado basado en la cantidad paga y el número</li></ol>
<p>de semanas del año escolar en sesión (Ver Política de Reembolso).</p>
<h3>RETIRO – EN REGLA</h3>
<p>Si un estudiante está en regla se retira voluntariamente antes del final del cuatrimestre actual, el estudiante recibirá un retiro (W) en su informe académico y expediente académico. No se otorgará ninguna otra calificación. El curso debe volver a tomarse y completarse con éxito antes de que el estudiante reciba una calificación. Si un estudiante en regla se retira voluntariamente después de completar un semestre o año académico actual, el estudiante conservará la calificación que obtuvo en su informe académico y expediente académico. Si un estudiante en regla se retira a la mitad de un cuatrimestre o un semestre, perderá las calificaciones obtenidas. Todos los retiros voluntarios en regla deben seguir los procedimientos de admisión para volver a matricularse.</p>`},
{n:"35", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>RETIRO INVOLUNTARIO - ACCIÓN DISCIPLINARIA</h3>
<p>Cualquier estudiante que sea obligado a retirarse o que se retire voluntariamente por razones disciplinarias recibirá un Retiro Disciplinario (WD, por sus siglas en inglés) en su informe académico y expediente. El estudiante recibirá una calificación de cero (0) en los cursos en los que estaba inscrito al momento del retiro. Además, si el estudiante es readmitido en una fecha posterior, deberá volver a cursar y aprobar exitosamente estos cursos antes de que se le permita matricularse o graduarse. Adicionalmente a lo anterior, se eliminará el inicio de sesión del estudiante en Populi y se recogerá toda identificación que otorgue acceso al campus de The River at Tampa Bay Church. Por favor, consulte la página de Información Financiera para conocer la responsabilidad financiera correspondiente.</p>
<p>Razones para retiros disciplinarios incluyen, pero no están limitadas a lo siguiente:</p>
<ul><li>Violación al Código de Conducta Estudiantil</li><li>Falta de adherirse a las políticas y procedimientos del instituto</li><li>Falta de adherirse a las normas de moral pautadas por RU</li><li>Ausencias Excesivas</li></ul>
<p>Los problemas disciplinarios serán manejados por Administración de RU. Cualquier estudiante que se comporte de forma que desacredite el Reino de Dios y/o RU será disciplinado incluyendo suspensión o expulsión de la escuela. RU se reserva el derecho de revocar el título de dicho estudiante. Se requerirá permiso de la Administración para volver a matricularse, y se deberán cumplir todos los requisitos de admisión.</p>
<p>POR FAVOR, TENGA EN CUENTA: RU se reserva el derecho de rechazar la inscripción y dar de baja a cualquier estudiante sin causa justificada.</p>
<h3>INCOMPLETO</h3>
<p>Un Incompleto (I) será otorgado a estudiantes que han completado la mayoría del trabajo durante uno de los cursos académicos, pero no puede completar el curso a causa de circunstancias atenuantes. Un Incompleto no es una nota final. El mismo proveerá al estudiante, oportunidad de retrasar el proceso de calificación hasta que haya completado y sometido todo el trabajo al instructor para nota final. Para obtener un Incompleto (I), el estudiante necesitará someter, por escrito, una notificación de intención, a la Oficina Administrativa. El estudiante deberá obtener toda asignatura a completar, directamente del instructor. El instructor determinará el tiempo necesario para completar el trabajo asignado. El tiempo estándar determinado por nuestro instituto, no excede más de un cuatrimestre. El estudiante recibirá un Incompleto (I) en su boleto de calificaciones, hasta que el trabajo asignado sea completado. Una vez el trabajo asignado es completado y devuelto, dentro del tiempo determinado, el instructor actualizará la nota de calificación. La misma será eliminada y la nota final será grabada en el boleto de calificaciones y/o transcripciones del estudiante. De igual forma, si el trabajo asignado no es completado y entregado al instructor dentro del tiempo determinado, el Incompleto (I) será convertido en Fracaso (F) y así será grabado oficialmente.</p>`},
{n:"36", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>PRUEBAS DE CURSO</h3>
<p>Los exámenes están preparados por el instructor de curso. Las fechas del examen son anotadas en el Calendario Académico y son sujetas de cambiar. Vea el temario de cada curso para más información del examen que le corresponde. Los exámenes se administran en línea a través de Populi. Se requiere que los estudiantes tomen sus exámenes en su propio dispositivo electrónico fuera del tiempo de la clase. Cada examen es de 60 minutos y se dan varios días para asegurar que los estudiantes tengan el tiempo suficiente para completar todas las pruebas de cada clase en la cual están matriculados. Si usted no toma el examen durante la disponibilidad establecida para la prueba electrónica, no se le permitirá tomarla en otro momento. No se permite retomar exámenes. No hay excepciones. Se proporcionan adaptaciones razonables a los estudiantes del idioma inglés y diversas excepciones diagnosticadas. Envíe un correo electrónico a RUadmin@revival.com para determinar si se requieren adaptaciones. Por favor recuerde que usted está en un sistema de honor. Esto significa que NO se debe usar notas, ni libros, y sólo usted debe tomar su examen.</p>
<h3>BOLETOS DE CALIFICACIONES</h3>
<p>Los estudiantes tendrán acceso a sus calificaciones por medio de Populi. Una vez termine cada cuatrimestre, favor de permitir dos semanas para la sumisión de las calificaciones finales ya que la información correspondiente tiene que ser recibida del instructor. Los estudiantes que necesiten algún expediente escrito podrán conseguir el Boleto de Calificación impreso en Populi.</p>
<h3>DISCREPANCIAS DE CALIFICACIONES</h3>
<p>Un formulario de Discrepancias de Calificaciones está disponible dentro de un período de tiempo programado si un estudiante cree que hay un error en la calificación de las tareas, exámenes, laboratorios o prácticas. Este formulario debe ir acompañado con la documentación que apoya cada ocurrencia. Las discrepancias sólo se considerarán durante el cuatrimestre de los exámenes del estudiante y deben presentarse antes de la fecha de vencimiento del término. Una vez que el curso está cerrado, no se puede volver a abrir para ningún cambio.</p>
<h3>TRANSCRIPCIONES ESTUDIANTILES</h3>
<p>Las Transcripciones de cada estudiante serán aseguradas en la Oficina del Instituto. Los estudiantes que deseen una transcripción oficial, tendrán que completar un formulario de autorización. Cada autorización de transcripción cuesta $10.00. Transcripciones serán emitidas solamente a estudiantes cuyas cuentas financieras están en condición satisfactoria. Favor de permitir 30 días para el procesamiento de la solicitud de transcripción. Las transcripciones pueden ser aceleradas a un costo de $35 por transcripción. Favor permitir siete días laborables para su procesamiento. TOMA EN CUENTA: De acuerdo con la ley federal, los registros estudiantiles no pueden ser publicados sin el consentimiento por escrito del estudiante. AUD      Auditor I        Incompleto IP       En Progreso R        Repetido W        Retirado WD       Retirado Disciplinado TC       Crédito Transferido</p>`},
{n:"37", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>INTEGRIDAD ACADÉMICA</h3>
<p>Integridad académica significa honestidad y responsabilidad respecto a asignaturas y exámenes. Asignaturas y exámenes son asignadas para determinar el crecimiento y entendimiento en la experiencia de aprendizaje de cada estudiante. Las notas de calificación existen para poder demostrar cómo se obtiene plenamente este objetivo. Por lo tanto, toda nota y trabajo debe surgir como resultado del estudio independiente de cada estudiante según su esfuerzo, trabajo y entendimiento.</p>
<h3>USO DE HERRAMIENTAS DE INTELIGENCIA ARTIFICIAL (IA)</h3>
<p>El estudiante puede utilizar herramientas de inteligencia artificial generativa (como ChatGPT) como ayuda de estudio, para generar ideas (brainstorming) o para revisar la redacción. Sin embargo, todo el texto, código e ideas presentados deben ser generados y escritos por el propio estudiante. No se permite el uso de IA para escribir borradores, resolver tareas o generar contenido final, especialmente apuntes de clase. Cualquier asistencia de IA utilizada debe ser citada de acuerdo con las pautas del curso.</p>
<h3>SOMETER EL MISMO TRABAJO ASIGNADO</h3>
<p>Someter el mismo trabajo asignado para más de una clase es una violación de asumir que el propósito de cada asignatura es para promover el aprendizaje y crecimiento de cada estudiante. A menos que el segundo instructor permita por escrito el someter un trabajo asignado nuevamente para clases diferentes, se considera como mala conducta académica. Los estudiantes casados que estén asistiendo a clases como pareja, no pueden entregar el mismo trabajo asignado. Cada asignatura tiene que ser completada individualmente.</p>
<h3>PLAGIO</h3>
<p>El plagio no se tolera en ninguna de la RU. El plagio es cuando una persona toma las ideas o palabras de otra persona y las utiliza en algún trabajo oral o escrito “sin darle crédito a la persona cuyas ideas o palabras se están utilizando”. Se requiere que todo trabajo asignado sea trabajo original de cada estudiante. El plagio conlleva penalidades y acciones disciplinarias graves y severas las cuales podrían resultar en suspensión del colegio. Estudiantes suspendidos/as por causa de plagio, no podrán apelar u aparecer ante el comité disciplinario. Para Evitar el Plagio:</p>
<ol><li>Los estudiantes que citen material previo de fuente propia necesitaran ponerlo entre comillas en la</li></ol>
<p>asignatura presente.</p>
<ol><li>Cite correctamente todas las investigaciones. Utilice la documentación adecuada tanto para las</li></ol>
<p>citas directas como para la información reformulada (parafraseada) con sus propias palabras. Use comillas para las palabras exactas. Solo el conocimiento general no necesita ser citado.</p>
<ol><li>El estudiante que adjunta su nombre a algún ensayo o trabajo escrito deberá ser el único autor del</li></ol>
<p>mismo. Los estudiantes podrán consultar con el maestro en cualquier momento mientras componen el ensayo o trabajo asignado. Un mecanógrafo, amigo o cónyuge no puede escribir ni corregir el trabajo en nombre del estudiante.</p>
<h3>SITIOS DE WEB SERVICIAL:</h3>
<ul><li>www.owl.english.purdue.edu/owl/</li><li>www.CitationMachine.net</li><li>www.Grammarly.com (Esto es un comprobador de plagio)</li></ul>`},
{n:"38", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>PROTOCOLO DE PLAGIO</h3>
<ol><li>Cualquier posibilidad o caso de plagio será identificado por el Instructor y luego confirmado con otro</li></ol>
<p>miembro de facultad aun cuando el plagio haya o no haya tomado lugar.</p>
<ol><li>El Instructor contactará Administración será determinado si una reunión con el Decano Académico,</li></ol>
<p>el Instructor y el Estudiante será necesaria.</p>
<ol><li>De confirmarse un caso de plagio, las siguientes consecuencias serán asesoradas:</li></ol>
<p>a. El Estudiante recibirá un cero (0) por el trabajo asignado, más Administración documentará el incidente en el expediente del estudiante. b. Si el plagio es severo y se categoriza como deshonestidad flagrante (el trabajo asignado tiene más de un 20% en contenido no citado por ensayo), el estudiante será suspendido de la Escuela. c. Estudiante que durante su matrícula en cualquiera de RU vuelva a cometer plagio, será suspendido del instituto inmediatamente.</p>
<h3>ERRORES DE ATRIBUCIÓN</h3>
<p>Trabajo escrito o Ensayos con errores de atribución mayor de dos oraciones en cantidad recibirá un cero (0) de calificación. Esta penalidad severa, refleja la desgracia moral de la ofensa. Errores de atribución comprende las siguientes prácticas incorrectas:</p>
<p>Plagio: el presentar las ideas y/o palabras de otra fuente como las de una persona propia. Tergiversación: el presentar ideas y/o palabras inexactas de una fuente. Los siguientes son errores típicos de atribución:</p>
<ul><li>No usar comillas para palabras exactas (citas justificadas o sin justificar)</li><li>No citar palabras o ideas de una fuente</li><li>No parafrasear correctamente (mezclar las palabras de un estudiante con la fuente de</li></ul>
<p>información, sin citar entre comillas las palabras de la fuente)</p>
<ul><li>No dar la información correcta de la localización de la fuente (fuente errónea o página</li></ul>
<p>incorrecta)</p>`},
{n:"39", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>FRAUDE</h3>
<p>El fraude no será tolerado en ninguno de RU. Cometer fraude significa copiarse del material de otra persona y tomarlo como material propio u original en un trabajo asignado, examen, prueba corta (quiz), o proyecto. Trabajo en grupo será designado por la facultad de tal forma.</p>
<p>Toda examinación será completada sin ningún tipo de ayuda externa por algún alumno u otro estudiante. Esto incluye, pero no se limita a: hojas de trucos, libros, apuntes de clase, celulares, computadoras, iPods, iPads, etc.</p>
<p>Firmar el nombre de otra persona a algún listado u otro documento será considerado como caso de fraude.</p>
<p>El fraude conlleva penalidades fuertes y severas académicamente y podría resultar en suspensión del instituto. Estudiantes suspendidos por motivo de fraude, no podrán apelar u aparecer ante el comité disciplinario.</p>
<h3>PROTOCOLO DE FRAUDE</h3>
<ol><li>Luego que un caso de fraude sea identificado, el/la maestro/a contactará Administración y entonces será</li></ol>
<p>determinado si una reunión con el Decano Académico, el/la Maestro/a y el/la Estudiante será necesario.</p>
<ol><li>De confirmarse un caso de fraude, las siguientes consecuencias serán asesoradas:</li></ol>
<p>a. El Estudiante recibirá un cero (0) por el trabajo asignado, más Administración documentará el incidente en el expediente del estudiante. El estudiante no podrá reponer el examen. b. Estudiante que cometa fraude será suspendido del instituto o ubicado en probatoria disciplinaria. c. Estudiante que, durante su matrícula en cualquiera de RU vuelva a cometer fraude, será suspendido del instituto inmediatamente.</p>
<p>Nota Importante: Estudiantes que cometan plagio o fraude serán tratados de acuerdo a la base de sus acciones. La reputación del estudiante e incidentes previos, serán tomados en consideración, al igual que su respuesta respecto a la situación en mano. Cualquier combinación de plagio y fraude será considerada como dos incidentes independientes más ofensa de suspensión.</p>`},
{n:"40", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>REQUISITOS PARA GRADUACIÓN</h3>
<p>La graduación es un momento jubiloso para los estudiantes de RU. Durante la graduación los estudiantes son recompensados y reconocidos por su ardua labor, tiempo y dedicación respecto a los cursos de estudio.</p>
<p>Aunque la graduación es algo emocionante, también puede ser un poco frenética o agitada. En un esfuerzo para eliminar ansiedad, confusión y decepción innecesaria, he aquí un listado general de los requisitos para graduación:</p>
<ul><li>Cada graduado cumplirá con todos los requisitos del curso, incluyendo las horas de crédito</li></ul>
<p>requeridas para el programa en el cual está inscrito.</p>
<ul><li>Cada estudiante debe tener un promedio de calificaciones (GPA) acumulativo de 2.00 para el</li></ul>
<p>primer año, 2.80 para el segundo y tercer año, y 3.00 para el cuarto año.</p>
<ul><li>Cada graduado tendrá una asistencia satisfactoria conforme a este catálogo, más cumplir con todos</li></ul>
<p>los requisitos desglosados en el programa del curso.</p>
<ul><li>Cada graduado tendrá que saldar todas las obligaciones financieras con RU.</li><li>Cada graduado cumplirá su meta de almas trimestral indicado en el plan de estudios de los</li></ul>
<p>siguientes cursos: Ganando Almas I, II y Laboratorio de Ganando Almas.</p>
<ul><li>Cada graduado demostrará un carácter moral y profesional durante el tiempo en el que estuvo</li></ul>
<p>inscrito en el instituto.</p>
<ul><li>Asistir al banquete anual después de completar un año académico completo</li><li>Asistir a los ensayos y ceremonias de graduación</li></ul>
<p>La graduación se lleva a cabo una vez durante el año académico en la conclusión del cuarto cuatrimestre. RU estudiantes de 3ro y 4to que sea elegible para graduación y haya cumplido con todos los requisitos de graduación, podrá participar en los ejercicios del comienzo de la graduación o ceremonia. Los mismos toman lugar en las facilidades de RMI. Se requiere asistencia al ensayo y ceremonia de graduación.</p>
<p>La responsabilidad para el entendimiento y cumplimiento de los requisitos para la graduación cae completamente sobre el estudiante. La Administración de la escuela se reserva el derecho de negar la participación de cualquier estudiante en la ceremonia de graduación.</p>`},
{n:"41", t:"Información Académica", sec:"INFORMACIÓN ACADÉMICA", h:`
<h3>RECONOCIMIENTO Y HONORES</h3>
<p>RU cree fuertemente en recompensar a los estudiantes en su rendimiento escolar. El programa de Honores y Reconocimiento nos provee la oportunidad de dar reconocimiento a quienes con la ayuda de Dios se han destacado en su rendimiento escolar. Estos estudiantes no se han conformado con la mediocridad y se han establecido como líderes en excelencia académica y un carácter moralmente excepcional. Un estudiante con una calificación de "D" o "F" en su transcripción no es elegible para participar en el programa de honores y premios a pesar de que el requisito de Promedio de Calificación (GPA) se cumple. Los siguientes méritos serán otorgados a estudiantes del tercer (licenciatura) y cuarto (maestría) año cuyos logros cumplan con los requisitos estándar de cada escuela:</p>
<p><b>Valedictorian</b> &ndash; Estudiante que se gradúa con honores manteniendo el GPA más alto de su clase graduanda y ha demostrado liderazgo excepcional, con un carácter moralmente excelente.</p>
<p><b>Erudito Presidencial</b> &ndash; Estudiante que ha mantenido un GPA de 4.0 por cada cuatrimestre en el que estuvo inscrito.</p>
<p><b>Suma Cum Laude</b> &ndash; Estudiante que se gradúa con honores manteniendo un GPA de 3.90-4.00</p>
<p><b>Magna Cum Laude</b> &ndash; Estudiante que se gradúa con honores manteniendo un GPA de 3.80-3.89</p>
<p><b>Cum Laude</b> &ndash; Estudiante que se gradúa con honores manteniendo un GPA de 3.70-3.79</p>
<h3>GRADUADOS DE RU</h3>
<p>Se espera que estudiantes graduados con diploma de nuestro instituto, mantengan un alto estándar cristiano, como lo representa un diploma de esta institución. Por tanto, reservamos el derecho de revocar todos títulos obtenidos de cualquier estudiante que no se mantenga en conformidad a la declaración de fe de nuestra escuela, o cuyas vidas/ministerio traigan reproche al cuerpo de Cristo.</p>
<p>TENGA EN CUENTA: El Valedictorian solo será seleccionado entre los graduados de licenciatura.</p>
<p>TENGA EN CUENTA: Los graduados de maestría tendrán sus honores anotados en su expediente académico, pero no en sus chaquetas de insignia.</p>
<p>TENGA EN CUENTA: Si un graduado solicita una reimpresión de un diploma obtenido, se incluirá una encuesta de declaración de fe de RU para garantizar que han mantenido los estándares esperados y ofrecer asistencia razonable si hay conflictos.</p>
<h3>CAMBIOS ADMINISTRATIVOS</h3>
<p>RU se reserva el derecho de hacer cualquier cambio que sea necesario, para el mejoramiento del colegio y avanzar el rendimiento de las metas y objetivos institucionales.</p>
<p>Por favor, comuníquese con la Oficina Administrativa de RU al 813-849-6641 durante el horario laboral regular si tiene alguna pregunta que necesite ser atendida.</p>
<p>.</p>`},
{n:"42", t:"Información Estudiantil", sec:"INFORMACIÓN ESTUDIANTIL", h:`
<h3>EXPECTATIVA ESTUDIANTIL</h3>
<p>Uno de los aspectos más importantes de nuestra escuela es el estudiante. El desarrollo de la Universidad, la implementación de cada programa, y la selección del currículo, son desarrollados para producir un estudiante confiado y competente en su caminar con Dios. Por lo tanto, se espera que los estudiantes matriculados en RU cumplan con y mantengan todas las reglas y regulaciones establecidas durante su permanencia completa mientras están en RU.</p>
<p>Estudiantes de RU son alentados y se espera de ellos que:</p>
<ul><li>Desarrollen y nutran una relación espiritual continua con Dios, por medio de estudios Bíblicos</li></ul>
<p>diariamente, oración continua, y ayuno.(Santiago 4:8; Mateo 6:5-18)</p>
<ul><li>Cultiven sumisión hacia Dios, y voluntad de ser obedientes al Espíritu Santo. (Santiago 4:7)</li><li>Reconozcan y ejerzan su autoridad sobre huestes espirituales de maldad.(Lucas 10:19)</li><li>Confiesen verbalmente la Palabra de Dios a base continua.(Deuteronomio 17:18-20; Josué 1:8)</li><li>Mantengan un bienestar físico, viendo sus cuerpos como el templo de Dios.(1 Corintios 6:18-20)</li><li>Se abstengan del uso, respaldo o propagación de drogas y actividades ilegales, comportamiento</li></ul>
<p>inmoral, actos sexuales ilícitos, comportamiento homosexual, pornografía, vapeo o cigarrillos electrónicos, marihuana en cualquier forma, y el uso de tabaco o bebidas alcohólicas. (Gálatas 5; 1 Corintios 6-7; Apocalipsis 21:8, 22:15; Efesios 5:18; Proverbios 20:1, 23:20; Isaías 5:22; Éxodo 20)</p>
<ul><li>Entiendan e interpreten la Biblia para así equiparse con el conocimiento de Dios y poder sobrepasar</li></ul>
<p>adversidades para vivir una vida de victoria. (2 Timoteo 2:15)</p>
<ul><li>Desarrollen disciplina mental y espiritual. (1 Pedro 4:7-8)</li><li>Practiquen caminar en amor, vivir en paz y armonía con el prójimo. (Romanos 12:18; 1 Juan 1:7-</li></ul>
<p>11)</p>
<ul><li>Busquen de Dios y desean todo lo que sea de Dios. (Mateo 6:33)</li><li>Caminen en el poder y la autoridad de Jesús. (Lucas 10:19)</li><li>Cultiven el regalo de Dios que hay en ellos y sean sensitivos al Espíritu Santo. (1 Pedro 4:10;</li></ul>
<p>Romanos 8:14)</p>
<h3>CÓDIGO DE HONOR DEL ESTUDIANTE</h3>
<p>RU es una escuela Cristiana que ofrece un estilo de vida de compromiso personal con Jesucristo como componente esencial para alcances evangelísticos. Los estudiantes deberán reconocer esto en nuestros institutos, tomando rienda en ejemplar una actitud de excelencia, manteniendo el nivel más alto de respeto por el enfoque y propósito de la escuela.</p>`},
{n:"43", t:"Información Estudiantil", sec:"INFORMACIÓN ESTUDIANTIL", h:`
<h3>CONDUCTA ESTUDIANTIL</h3>
<p>Trabajamos para ofrecer un ambiente positivo y seguro que fomente el aprendizaje. Por lo tanto, el siguiente Código de Conducta será observado en todo momento:</p>
<ol><li>Todo estudiante inscrito es un representante de este instituto y se espera que se comporten de</li></ol>
<p>manera profesional y respetuosamente tanto dentro como fuera del campo escolar. Esto incluye la comunicación a través de correos electrónicos, redes sociales, cara a cara, etc.</p>
<ol><li>Somos una facilidad con un ambiente libre de fumar, libre de drogas, y libre de alcohol. Por tanto,</li></ol>
<p>todo estudiante tendrá que abstenerse del uso de cigarrillos, drogas, y alcohol en cualquiera de las facilidades del campo escolar.</p>
<ol><li>La RU se opone a demostraciones afectivas con otros estudiantes del sexo opuesto mientras estén</li></ol>
<p>en el campo escolar o algún evento patrocinado.</p>
<ol><li>Lenguaje con profanidad, fraude, robo, deshonestidad, apuestas, juegos de casino, y destrucción</li></ol>
<p>de propiedad no son permitidos.</p>
<ol><li>Los estudiantes se abstendrán de comportamiento y conversaciones perversas, con insinuaciones</li></ol>
<p>u obscenas.</p>
<ol><li>Los estudiantes se abstendrán de dispersar información no correcta, inventando cuentos y creando</li></ol>
<p>chismes dañinos.</p>
<ol><li>La vestimenta de los estudiantes será conservadora; similar a la vestimenta de un ambiente</li></ol>
<p>profesional de oficina.</p>
<ol><li>Todo teléfono celular y aparato electrónico tendrá que permanecer apagado durante el periodo de</li></ol>
<p>clases, a menos que sea utilizado para tomar anotaciones. Durante descansos, podrán chequear sus mensajes. Estudiantes serán despedidos de clases, si su celular suena durante la misma. Ofensas repetitivas resultará en probatoria, suspensión u otra acción administrativa.</p>
<ol><li>Actos de iniciación y violaciones descaradas hacia un estudiante, su persona y/o su propiedad están</li></ol>
<p>expresamente prohibidos y resultará en inmediato despido de la escuela. Cargos criminales serán presionados.</p>
<h3>REUNIONES ESTUDIANTILES</h3>
<p>Fuera de las actividades de RU y del The River at Tampa Bay Church, ninguna reunión estudiantil será reconocida como un evento oficial de RU sin el permiso previo de la Administración.</p>
<p>Hogares En ningún momento se permite a ninguna persona del sexo opuesto (estudiante o de otro tipo) estar dentro de los hogares de los estudiantes. Tampoco se les permite estar en los hogares de personas del sexo opuesto que no son estudiantes.</p>
<p>Reuniones de Grupo Las reuniones de grupos en lugares públicos se permiten caso por caso y requiere una solicitud de permiso por escrito de Administración, enviada por correo electrónico no más tardar de 3 días entre semana antes del evento. La responsabilidad de cualquier actividad cuestionable durante una reunión de estudiantes será la responsabilidad del organizador del evento.</p>
<p>Vehículos No se permiten dos personas del sexo opuesto estar solos en el mismo vehículo. Se conceden excepciones para los miembros de la familia.</p>`},
{n:"44", t:"Información Estudiantil", sec:"INFORMACIÓN ESTUDIANTIL", h:`
<h3>NOVIAZGO ESTUDIANTIL</h3>
<p>Mientras reconocemos que RU es un terreno fértil para quienes desean una pareja, existen ciertas directrices particulares que hay que observar. Demostraciones de Afección Pública (PDA) como los besos, abrazos, agarres, caricias, masajes de espalda, y además no se consideran como comportamiento apropiado dentro del campo escolar o durante los servicios de la iglesia. Los estudiantes de RU no estan permitido tener citas amorosas/cortejar a nadie, ni desarrollar una amistad cercana/íntima con miembros del sexo opuesto durante el primer y segundo año académico, y nunca deben involucrarse en relaciones inapropiadas con miembros del mismo sexo (1a Corintios 7:32- 35). Les pedimos que se acaten a estas normas por la gran distracción que esto puede causar. ¡NO se considerarán excepciones, así que ni pregunten! Salidas en grupos, fiestas grupales, o juntas con el sexo opuesto serán vistas de igual manera. Cualquier estudiante de 3er año de licenciatura o maestría que esté considerando salir durante el transcurso de su permanencia en la escuela, debe reunirse con el Decano de RU antes de hacer cualquier arreglo. Cualquier cosa en contrario resultará en el despido inmediato - sin excepciones.</p>
<h3>MATRIMONIOS ESTUDIANTILES</h3>
<p>Casamientos Bíblicos entre estudiantes sólo será considerado a menos que ambos de la pareja sean estudiantes del tercer año o completamente graduados – punto. Consideramos extremadamente menso el casarse con una persona luego de un breve noviazgo y recomendamos fuertemente que cualquier persona considerando matrimonio, pasen por consejería prematrimonial extensiva antes de comprometerse. En adición, RU les exhortamos urgentemente que estudiantes mantengan el enfoque por lo cual vinieron al RU en el primer lugar – ser entrenados. Si cualquier otra cosa como noviazgo o matrimonio entre el cuadro- como lo ha pasado – ha probado de ser de distracción extrema. Usted vino aquí para recibir el entrenamiento ministerial. Si cualquier cosa está compitiendo para su atención, no podrá recibir todo lo que necesitará durante su tiempo aquí. Es la última cosa que se necesita es estar desviado y entonces perder su llamado al Ministerio del Evangelio. Si no puede o si no acepta este regalo, entonces estará perdiendo su beca. Preferíamos perderle ahora, al momento de la inscripción, que más tarde, en tiempo de graduarse. Mientras que nuestra escuela no busca controlar la vida de nadie, si sentimos la obligación de avisar a los estudiantes que matrimonios impulsivos y con un corto noviazgo han resultado históricamente en un porcentaje mucho más alto de dificultades matrimoniales serias y con mayor probabilidad de divorcio, aun cuando cada parte se insistían que “Dios los dirigía a que se casaran rápido”. Más aún, nuestra escuela cree que, si una persona escoge ser impulsivo y descuidado en respecto a algo tan sagrado como lo es el escoger una pareja matrimonial, e ignora consejería apta y sabiduría convencional sobre la situación, esa persona demuestra la falta de paciencia y firmeza que es necesaria para su futuro éxito ministerial.</p>
<h3>MINISTRANDO MIENTRAS EN RU</h3>
<p>Mientras esté matriculado en RU, no se le permite ministrar. "Ministrar" se refiere a realizar servicios como evangelista, maestro, líder de adoración, orador invitado, cantante, instrumentista u otras formas similares, incluidas las redes sociales. A los estudiantes no se les permite ministrar ni asistir a otros ministerios durante las horas de clase y los eventos y servicios requeridos. Asistir a viajes misioneros se ve de la misma manera. A los estudiantes no se les permite orar, imponer las manos o profetizar sobre ninguna persona. La ministración debe ser realizada por los pastores de este ministerio y liderazgo aprobado.</p>`},
{n:"45", t:"Información Estudiantil", sec:"INFORMACIÓN ESTUDIANTIL", h:`
<h3>TARJETAS DE IDENTIFICACIÓN ESTUDIANTIL</h3>
<p>Todo estudiante recibirá una tarjeta de identificación estudiantil la cual llevará el nombre y número del estudiante.</p>
<ol><li>La tarjeta de ID debe usarse en un cordón claramente visible alrededor de su cuello en todo</li></ol>
<p>momento durante las horas de clase, mientras esté en la propiedad y en los servicios. Está prohibido pedir prestado o prestar una tarjeta de identificación a otra persona.</p>
<ol><li>Si encuentras un ID extraviado o perdido deberás devolverlo, con prontitud, a la Oficina</li></ol>
<p>Administrativa.</p>
<ol><li>No se debe pegar con cinta adhesiva, clavar, grapar o adjuntar a su identificación de ninguna</li></ol>
<p>manera. Esto incluye pegar fotos en él o desfigurarlo de todos modos.</p>
<ol><li>Cualquier correspondencia a la Oficina Administrativa de RU debe tener el número de notificación</li></ol>
<p>del estudiante que está localizado en su tarjeta de ID.</p>
<ol><li>Si no tiene su ID por alguna razón, no podrá asistir a clase o servicios. Si no tiene su tarjeta de ID</li></ol>
<p>estudiantil durante un servicio, se le enviará a la carpa de bienvenida (Registración) para adquirir una pulsera.</p>
<ol><li>Los estudiantes que pierdan su ID podrán asegurar un ID temporero por medio del oficial</li></ol>
<p>designado hasta que el ID perdido aparezca o hasta que un reemplazo haya sido otorgado.</p>
<ol><li>Si olvida su tarjeta ID, tendrá dos opciones:</li></ol>
<p>a. Salir del campo escolar, localizar su ID y regresar a la escuela (será marcado ausente por las clase perdidas). b. Ver a el oficial designado y alquilar un ID temporero (valido solo por un día) por un cargo de $10. *Tengan en Cuenta: Estudiante que haya perdido su ID, podrá alquilar un ID temporero por hasta dos días consecutivos. En ese entonces, el estudiante necesitará un ID de reemplazo (el cargo de $20 ya estaría acumulado en el alquiler de los dos días).</p>
<ol><li>En el evento de un ID perdido, un ID de reemplazo podrá ser comprado por un costo de $20.</li><li>Toda tarjeta de ID deberá ser devuelta a la Oficina Administrativa de la escuela en el evento de</li></ol>
<p>una expulsión o retiro de estudios. Si no se devuelve, se incurrirá en una tarifa como se indica en la página de Información financiera.</p>
<ol><li>Todas las tarjetas de identificación y tarjetas de estacionamiento deben devolverse a la Oficina</li></ol>
<p>Administrativa de la escuela al final de cada año académico. Si no se devuelve, se incurrirá en una tarifa como se indica en la página de Información financiera.</p>`},
{n:"46", t:"Información Estudiantil", sec:"INFORMACIÓN ESTUDIANTIL", h:`
<h3>VESTIMENTA ESTUDIANTIL</h3>
<p>El propósito de RU no es solamente fortalecer el camino Cristiano del estudiante, sino también prepararlo para el ministerio. Con esto en mente, el profesionalismo en la conducta y el código de vestimenta es imperativo. Nuestra escuela desea que todo estudiante se vista modestamente y buen gusto. El siguiente código de vestimenta aplica durante todo momento mientras asistan a clase, en horas de sesión de clase, y durante servicios en la iglesia, incluyendo actividades afuera del campus universitario. Nota: Aquellos que estén en violación del código de vestimenta, se les pedirá un cambio de vestimenta o que desocupen el campo escolar. Esto contará como una ausencia por cualquier clase perdida en ese día. RU Administración, cualquier miembro de facultad, cualquier oficial de la escuela o cualquier personal autorizado como monitor del código de vestimenta son autorizados para señalar si está fuera del código de vestimenta. De haber alguna pregunta sobre cualquier aspecto de la vestimenta, el Decano tendrá la palabra final. Nos reservamos el derecho de enmendar el código de vestimenta durante el año de ser necesario.</p>
<p>Nota: Cuando sirva en el programa Unite para su asignación en el ministerio de ayuda (MOH), por favor consulte con su supervisor de departamento sobre el código de vestimenta. Los estudiantes estan permitido vestirse conforme a cada asignación de MOH durante ese servicio. Para todos los demás servicios, cada estudiante debe cumplir con el código de vestimenta escolar. Sin excepciones.</p>
<p>Durante los servicios de afuera los estudiantes están permitidos a vestir en el “Código de Vestimenta Casual.”.</p>
<h3>VIOLACIONES DEL CÓDIGO DE VESTIMENTA</h3>
<p>Estudiantes en violación del código de vestimenta previamente mencionado, serán enviados a sus hogares para un cambio de ropa. Los siguientes procedimientos para las violaciones del código de vestimenta aplicarán en adición a ser enviado al hogar para un cambio de ropa, más recibir una ausencia completa.</p>
<ul><li>1ra Violación – Aviso escrito con posibilidad de estar enviado a casa para cambiarse de ropa.</li><li>2da Violación – Aviso por escrito firmado por el estudiante enviado a casa para cambiarse de ropa.</li><li>3ra Violación – Aviso por escrito firmado por el estudiante, enviado a casa para cambiarse de ropa</li></ul>
<p>y una reunión con el Asesoro.</p>
<ul><li>4ta Violación – Suspensión de 2 días y una reunión con el Decano.</li></ul>
<h3>TATUAJES:</h3>
<p>No se permite que estudiantes se hagan tatuajes mientras estén en entrenamiento ministerial. (Lev. 19:28)</p>`},
{n:"47", t:"Información Estudiantil", sec:"INFORMACIÓN ESTUDIANTIL", h:`
<h3>CÓDIGO DE LA VESTIMENTA CASUAL PROFESIONAL</h3>
<p><b>MUJERES</b> &ndash; Atuendo Aceptable El atuendo aceptable incluye vestidos, blusas, faldas, camisas de cuello, trajes, chaqueta de vestir, camisas hasta el cuello con pantalones de vestir modestamente ajustados.</p>
<p>Blusas:</p>
<ul><li>Cada blusa y suéter debe tener mangas tapadas, escote, espalda, estómago y abdomen cubierto</li></ul>
<p>completamente a todo momento, aun cuando se levanten los brazos.</p>
<ul><li>No se permite sudaderas con capucha.</li></ul>
<p>Pantalones:</p>
<p>Pantalones (abotonado con una cremallera) tendrán que cubrir las caderas, preferiblemente ir hasta la cintura y modestamente ajustado. Un par de pañalones profesionales no tiene bolsillo atrás a menos que estén hechos de material de revestimiento. Eso quiere decir que, si los pantalones tienen bolsillo afuera, no son pantalones profesionales. (No mezclilla/jean, material desgastado, deteriorado o spandex, no rompers, no overoles)</p>
<p>Vestidos/Faldas</p>
<ul><li>Vestidos/Faldas deberán ir debajo de la rodilla y deberán estar modestamente ajustados incluso</li></ul>
<p>cuando se usan mallas o polainas. El ruedo de faldas talladas deberá ser debajo de la rodilla o más largo, delante y detrás.</p>
<ul><li>Cualquier apertura al frente de una falda no puede ir más arriba de la rodilla. Cualquier apertura al</li></ul>
<p>lado o atrás de una falda no puede pasar de 3-4 pulgadas arriba de la rodilla.</p>
<p>Zapatos</p>
<ul><li>Sandalias con correa elegantes y tacones (correas alrededor de la parte posterior del zapato)</li><li>Zapatos de vestir (tacones o planos)</li><li>Botas</li></ul>
<p>Apariencia General</p>
<ul><li>Se espera que cada estudiante observa buena higiene y viste con ropa limpia.</li><li>Ninguna advertencia, diseños excesivos, redacciones, o logotipos en ellos.</li><li>La ropa interior no debe ser visible en ningún momento, incluyendo cuando usted se doble.</li><li>La ropa interior no debe ser visible a través de su ropa. Toda ropa transparente debe combinarse</li></ul>
<p>con una prenda no transparente debajo que cubra completamente la parte superior del torso. (ej. camisillas).</p>

{n:"48", t:"Información Estudiantil", sec:"INFORMACIÓN ESTUDIANTIL", h:`

{n:"49", t:"Información Estudiantil", sec:"INFORMACIÓN ESTUDIANTIL", h:`
