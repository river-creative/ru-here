<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instituto Bíblico River · Manual del Estudiante 2026–2027</title>
<meta name="theme-color" content="#0f3952">
<meta name="description" content="Manual del Estudiante del Instituto Bíblico River 2026–2027, en una edición digital con páginas que se pasan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f3952;
    --navy-d:#082a3d;
    --navy-l:#17516f;
    --gold:#d6a329;
    --gold-d:#8f6712;
    --yellow:#FFC72C;
    --ink:#12212b;
    --body-ink:#25404f;
    --paper:#fffdf8;
    --paper-edge:#f0e9dc;
    --room:#dfe5ea;
    --room-2:#c9d3db;
    --line:#dfd7c8;
    --muted:#6c7f8c;
    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --dur:560ms;
    --barH:54px;
    --railH:56px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(120% 90% at 50% 0%, #e8eef3 0%, var(--room) 45%, var(--room-2) 100%);
    color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    touch-action:manipulation;
  }
  button{font-family:var(--body)}

  /* ============ Toolbar ============ */
  .bar{
    position:fixed;top:0;left:0;right:0;z-index:60;
    display:flex;align-items:center;gap:8px;padding:0 12px;
    padding-top:env(safe-area-inset-top);
    height:calc(var(--barH) + env(safe-area-inset-top));
    background:linear-gradient(180deg,rgba(15,57,82,.97),rgba(8,42,61,.95));
    color:#fff;border-bottom:2px solid var(--gold);
  }
  .brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
  .brand .r{
    width:24px;height:28px;flex:none;border:2px solid var(--gold);border-radius:3px;
    display:grid;place-items:center;font-family:var(--display);
    font-variation-settings:"wght" 800;font-size:15px;color:var(--gold);
  }
  .brand .bt{min-width:0}
  .brand b{
    display:block;font-family:var(--display);font-variation-settings:"wdth" 112,"wght" 700;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .brand i{
    display:block;font-style:normal;font-family:var(--mono);
    font-size:8.5px;letter-spacing:.2em;color:#9fc0d2;text-transform:uppercase;white-space:nowrap;
  }
  .tbtn{
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;
    border-radius:9px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;
    font-size:13px;display:inline-flex;align-items:center;gap:6px;justify-content:center;
    flex:none;
  }
  .tbtn:hover{background:rgba(255,255,255,.14)}
  .tbtn.on{background:var(--gold);border-color:var(--gold);color:var(--navy-d);font-weight:700}
  .tbtn svg{width:15px;height:15px;flex:none}

  /* ============ Stage / Book ============ */
  .stage{
    position:fixed;left:0;right:0;
    top:calc(var(--barH) + env(safe-area-inset-top));
    bottom:calc(var(--railH) + env(safe-area-inset-bottom));
    display:grid;place-items:center;
    perspective:2400px;
    overflow:hidden;
  }
  .book{
    position:relative;
    transform-style:preserve-3d;
    filter:drop-shadow(0 22px 34px rgba(8,42,61,.35));
  }
  .half{
    position:absolute;top:0;height:100%;overflow:hidden;
  }
  .half.L{left:0;border-radius:8px 2px 2px 8px}
  .half.R{border-radius:2px 8px 8px 2px}
  .book.single .half.R{left:0;border-radius:8px}
  .half.empty{visibility:hidden}

  /* spine shading in two-page mode */
  .book.duo .half.L::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to left, rgba(8,42,61,.16), rgba(8,42,61,0) 9%);}
  .book.duo .half.R::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to right, rgba(8,42,61,.16), rgba(8,42,61,0) 9%);}

  /* turning leaf */
  .leaf{
    position:absolute;top:0;height:100%;
    transform-style:preserve-3d;
    z-index:30;
    will-change:transform;
  }
  .leaf .face{
    position:absolute;inset:0;overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
  }
  .leaf .face.back{transform:rotateY(180deg)}
  .leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to right, rgba(8,42,61,0), rgba(8,42,61,.06));}
  .leaf.turnF{transform-origin:left center}
  .leaf.turnB{transform-origin:right center}
  @keyframes turnF{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
  @keyframes turnB{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
  .leaf.turnF.go{animation:turnF var(--dur) cubic-bezier(.42,.05,.36,1) forwards}
  .leaf.turnB.go{animation:turnB var(--dur) cubic-bezier(.42,.05,.36,1) forwards}
  /* single-page turn */
  .leaf.solo{transform-origin:left center;left:0;width:100%}
  @keyframes turnSoloF{from{transform:rotateY(0);opacity:1}to{transform:rotateY(-88deg);opacity:.35}}
  @keyframes turnSoloB{from{transform:rotateY(0);opacity:1}to{transform:rotateY(88deg);opacity:.35}}
  .leaf.solo.goF{transform-origin:left center;animation:turnSoloF calc(var(--dur)*.72) cubic-bezier(.5,.05,.5,1) forwards}
  .leaf.solo.goB{transform-origin:right center;animation:turnSoloB calc(var(--dur)*.72) cubic-bezier(.5,.05,.5,1) forwards}

  /* ============ Page ============ */
  .page{
    position:absolute;inset:0;
    background:
      linear-gradient(160deg, rgba(255,255,255,.5), rgba(255,255,255,0) 30%),
      var(--paper);
    color:var(--body-ink);
    display:flex;flex-direction:column;
    box-shadow:inset 0 0 0 1px rgba(15,57,82,.06);
  }
  .phead{
    flex:none;text-align:center;
    padding:4.2% 6% 0;
  }
  .phead .st{
    font-family:var(--display);font-variation-settings:"wdth" 108,"wght" 700;
    color:var(--navy);letter-spacing:.14em;text-transform:uppercase;
    font-size:.82em;line-height:1.25;
  }
  .phead .rule{height:2px;width:3.4em;background:var(--gold);margin:.5em auto 0;border-radius:2px}
  .pbody{
    flex:1;min-height:0;overflow:hidden;
    padding:2.5% 6% 1.5%;
    font-size:1em;line-height:1.42;
  }
  .pfoot{
    flex:none;text-align:center;color:var(--muted);
    font-family:var(--mono);font-size:.68em;letter-spacing:.12em;
    padding:0 6% 3.4%;
  }
  .pbody p{margin:0 0 .62em}
  .pbody p:last-child{margin-bottom:0}
  .pbody h3{
    font-family:var(--display);font-variation-settings:"wdth" 106,"wght" 700;
    color:var(--navy);font-size:.95em;letter-spacing:.05em;text-transform:uppercase;
    margin:.85em 0 .35em;line-height:1.25;
  }
  .pbody h3:first-child{margin-top:0}
  .pbody h3.center{text-align:center}
  .pbody b{color:var(--ink)}
  .pbody ul,.pbody ol{margin:.15em 0 .7em;padding-left:1.5em}
  .pbody li{margin:0 0 .3em}
  .pbody ul li::marker{color:var(--gold-d)}
  .pbody ol li::marker{color:var(--navy);font-weight:600}
  .pbody small{font-size:.85em;color:var(--muted)}
  .pbody .tight{margin-bottom:.35em}

  /* key-value fee rows */
  .kv{display:flex;justify-content:space-between;gap:1.2em;align-items:baseline;
    border-bottom:1px dotted var(--line);padding:.2em 0;font-size:.94em}
  .kv>span:first-child{min-width:0}
  .kv>span:last-child{flex:none;font-family:var(--mono);font-size:.9em;color:var(--navy);font-weight:500;text-align:right}
  .feehead{display:flex;justify-content:space-between;font-family:var(--display);
    font-variation-settings:"wght" 700;color:var(--navy);text-transform:uppercase;
    letter-spacing:.06em;font-size:.82em;border-bottom:2px solid var(--gold);padding:.15em 0 .25em}
  .codes{max-width:22em}

  /* tables */
  .tblcap{text-align:center;font-weight:600;color:var(--navy);font-size:.9em}
  table.tbl{border-collapse:collapse;width:100%;margin:.2em 0 .8em;font-size:.9em}
  table.tbl th{background:var(--navy);color:#fff;font-family:var(--display);
    font-variation-settings:"wght" 600;letter-spacing:.05em;font-size:.86em;text-transform:uppercase;
    padding:.32em .6em;text-align:left;border:1px solid var(--navy-l)}
  table.tbl td{border:1px solid var(--line);padding:.28em .6em}
  table.tbl tr:nth-child(even) td{background:rgba(214,163,41,.06)}
  table.grades{max-width:24em;margin-left:auto;margin-right:auto}
  table.grades th,table.grades td{text-align:center}

  /* title page */
  .titlepage{text-align:left}
  .tp-eyebrow{font-family:var(--mono);letter-spacing:.3em;text-transform:uppercase;
    color:var(--gold-d);font-size:.72em;text-align:center;margin:.6em 0 .2em}
  .tp-title{font-family:var(--display);font-variation-settings:"wdth" 115,"wght" 800;
    color:var(--navy);text-align:center;font-size:1.75em;letter-spacing:.06em;margin:0}
  .tp-year{font-family:var(--display);font-variation-settings:"wdth" 110,"wght" 600;
    color:var(--gold-d);text-align:center;font-size:1.15em;letter-spacing:.28em;margin:.15em 0 0}
  .tp-rule{height:2px;background:var(--gold);width:5em;margin:.9em auto 1.1em;border-radius:2px}

  /* TOC */
  .toc-r{display:flex;align-items:baseline;gap:.45em;padding:.13em 0;font-size:.93em}
  .toc-r span{min-width:0}
  .toc-r i{flex:1;border-bottom:1.5px dotted #b9c6cf;transform:translateY(-.28em)}
  .toc-r b{flex:none;font-family:var(--mono);font-weight:500;color:var(--navy)}
  .toc-r.l0{font-weight:600;color:var(--ink)}
  .toc-r.l0 span{font-family:var(--display);font-variation-settings:"wdth" 104,"wght" 600}
  .toc-r.l1{padding-left:1.4em;color:var(--body-ink)}
  .pgref{cursor:pointer;color:var(--navy);text-decoration:none}
  u.pgref{text-decoration:underline dotted 1px var(--gold-d);text-underline-offset:2px}
  .pgref:hover{color:var(--gold-d)}

  /* signatures */
  .sigrow{display:flex;gap:2.4em;margin:.5em 0 .9em;flex-wrap:wrap}
  .sig{font-size:.94em;line-height:1.4;margin:.4em 0 .6em}
  .sig b{font-family:var(--display);font-variation-settings:"wght" 700;color:var(--navy)}

  /* faculty columns */
  .faccols{columns:3;column-gap:1.6em;margin:.5em 0 .9em;font-size:.95em}
  .faccols span{display:block;padding:.14em 0;border-bottom:1px dotted var(--line);break-inside:avoid}

  /* index */
  .idx{columns:2;column-gap:2.2em;font-size:.86em}
  .ir{display:flex;justify-content:space-between;gap:.8em;padding:.1em 0;break-inside:avoid}
  .ir span{min-width:0}
  .ir b{flex:none;font-family:var(--mono);font-weight:400;font-size:.92em;color:var(--navy);text-align:right}
  .ir.l1{padding-left:1.3em;color:var(--muted)}

  /* signature lines */
  .siglines{margin-top:2.2em}
  .sl{margin:1.7em 0 0;max-width:26em}
  .sl i{display:block;border-bottom:1.5px solid var(--ink);height:1.1em}
  .sl span{display:block;font-size:.8em;color:var(--muted);margin-top:.25em}
  .sl.short{max-width:13em}

  /* cover / blanks / back cover */
  .page.cover,.page.backcover{
    background:
      radial-gradient(130% 100% at 82% 8%, var(--navy-l) 0%, var(--navy) 42%, var(--navy-d) 100%);
    color:#fff;
  }
  .page.cover .pbody,.page.backcover .pbody{padding:0}
  .cv{position:relative;height:100%;display:flex;flex-direction:column;padding:7% 9%;overflow:hidden}
  .cv-mark{display:flex;align-items:center;gap:.6em}
  .cv-r{width:2em;height:2.35em;border:2.5px solid #fff;border-radius:.2em .2em .75em .75em;
    display:grid;place-items:center;font-family:var(--display);font-variation-settings:"wght" 800;
    font-size:1.05em;color:#fff;flex:none}
  .cv-mark b{display:block;font-family:var(--display);font-variation-settings:"wdth" 112,"wght" 700;
    font-size:1.25em;letter-spacing:.22em}
  .cv-mark i{display:block;font-style:normal;font-family:var(--mono);font-size:.58em;
    letter-spacing:.44em;color:#bcd3e0;text-transform:uppercase}
  .cv-mid{margin-top:auto}
  .cv-year{font-family:var(--display);font-variation-settings:"wdth" 110,"wght" 800;
    color:var(--gold);font-size:2.4em;letter-spacing:.03em;margin:0;line-height:1}
  .cv-hb{font-family:var(--display);font-variation-settings:"wdth" 118,"wght" 800;
    color:var(--gold);font-size:2.75em;letter-spacing:.04em;margin:0 0 .2em;line-height:1}
  .cv-tag{color:#8fa9ba;font-size:.9em;line-height:1.4;margin:.2em 0 1.3em}
  .cv-schools{list-style:none;margin:0 0 3.2em;padding:0}
  .cv-schools li{font-family:var(--display);font-variation-settings:"wdth" 106,"wght" 700;
    text-transform:uppercase;letter-spacing:.09em;font-size:.86em;padding:.28em 0;
    display:flex;align-items:center;gap:.6em}
  .cv-schools li::before{content:"";width:.62em;height:.62em;background:var(--gold);flex:none}
  .cv-swoosh{position:absolute;left:-8%;right:-8%;bottom:-2%;height:16%;
    background:linear-gradient(90deg,#e9edf1,#cfd8de);
    border-top:.55em solid var(--gold);
    transform:rotate(-5deg);transform-origin:right bottom;border-radius:.6em 0 0 0}
  .page.blank{background:var(--paper)}
  .page.blank .pbody::after{content:"";display:block}
  .bc{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:9%}
  .bc .cv-mark{transform:scale(.92)}
  .bc-url{font-family:var(--mono);letter-spacing:.32em;font-size:.66em;color:#bcd3e0;margin:.9em 0 0}

  /* ============ Bottom rail ============ */
  .rail{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    height:calc(var(--railH) + env(safe-area-inset-bottom));
    padding:0 10px env(safe-area-inset-bottom);
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(0deg,rgba(15,57,82,.97),rgba(8,42,61,.94));
    color:#fff;border-top:2px solid var(--gold);
  }
  .nbtn{
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;
    width:38px;height:38px;border-radius:10px;cursor:pointer;flex:none;
    display:grid;place-items:center;font-size:17px;
  }
  .nbtn:disabled{opacity:.35;cursor:default}
  .scrub{flex:1;display:flex;align-items:center;min-width:0}
  input[type=range]{
    width:100%;appearance:none;-webkit-appearance:none;height:26px;background:transparent;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgba(255,255,255,.25);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:20px;height:20px;
    border-radius:50%;background:var(--gold);margin-top:-8px;border:2px solid var(--navy-d);box-shadow:0 1px 4px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-track{height:4px;background:rgba(255,255,255,.25);border-radius:2px}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--gold);border:2px solid var(--navy-d)}
  .counter{
    flex:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);
    color:#fff;border-radius:9px;height:38px;padding:0 12px;cursor:pointer;
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;white-space:nowrap;
  }
  .counter:hover{background:rgba(255,255,255,.14)}

  /* go-to popover */
  .gopop{
    position:fixed;right:10px;bottom:calc(var(--railH) + env(safe-area-inset-bottom) + 10px);
    z-index:80;background:#fff;color:var(--ink);border-radius:14px;
    box-shadow:0 12px 34px rgba(8,42,61,.4);padding:14px;display:none;width:230px;
    border-top:3px solid var(--gold);
  }
  .gopop.open{display:block}
  .gopop label{display:block;font-family:var(--display);font-variation-settings:"wght" 700;
    color:var(--navy);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
  .gorow{display:flex;gap:8px}
  .gopop input{
    flex:1;min-width:0;border:1.5px solid var(--room-2);border-radius:9px;height:40px;
    padding:0 10px;font-size:16px;font-family:var(--mono);
  }
  .gopop input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  .gopop button{
    flex:none;background:var(--navy);color:#fff;border:0;border-radius:9px;height:40px;
    padding:0 14px;font-weight:700;cursor:pointer;
  }
  .gopop .hint{font-size:11px;color:var(--muted);margin:8px 0 0}

  /* ============ Drawers ============ */
  .drawer{
    position:fixed;top:calc(var(--barH) + env(safe-area-inset-top));bottom:0;right:0;z-index:70;
    width:min(400px,94vw);background:#fff;color:var(--ink);
    box-shadow:-14px 0 38px rgba(8,42,61,.35);
    transform:translateX(105%);transition:transform .28s ease;
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:none}
  .dhead{flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:2px solid var(--gold)}
  .dhead b{font-family:var(--display);font-variation-settings:"wdth" 110,"wght" 700;
    color:var(--navy);letter-spacing:.1em;text-transform:uppercase;font-size:14px}
  .dx{border:0;background:var(--room);width:32px;height:32px;border-radius:9px;cursor:pointer;
    font-size:15px;color:var(--navy)}
  .dbody{flex:1;overflow:auto;padding:10px 0 24px;-webkit-overflow-scrolling:touch}
  .citem{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;
    text-align:left;border:0;background:none;cursor:pointer;
    padding:10px 18px;font-size:14.5px;color:var(--body-ink);
  }
  .citem:hover{background:rgba(214,163,41,.1)}
  .citem.now{background:rgba(15,57,82,.07);border-left:3px solid var(--gold);padding-left:15px}
  .citem b{font-weight:600;color:var(--ink);font-family:var(--body)}
  .citem span{flex:none;font-family:var(--mono);font-size:12px;color:var(--navy)}
  .sbox{padding:12px 16px;border-bottom:1px solid var(--room)}
  .sbox input{
    width:100%;border:1.5px solid var(--room-2);border-radius:10px;height:42px;padding:0 12px;
    font-size:16px;font-family:var(--body);
  }
  .sbox input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  .sres{border:0;background:none;width:100%;text-align:left;cursor:pointer;
    padding:11px 18px;border-bottom:1px solid var(--room);display:block}
  .sres:hover{background:rgba(214,163,41,.1)}
  .sres .rt{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px}
  .sres .rt b{font-size:13.5px;color:var(--navy)}
  .sres .rt span{flex:none;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .sres p{margin:0;font-size:13px;color:var(--body-ink);line-height:1.4}
  .sres mark{background:var(--yellow);border-radius:2px;padding:0 1px}
  .snone{padding:22px 18px;color:var(--muted);font-size:14px}
  .scrim{position:fixed;inset:0;z-index:65;background:rgba(8,42,61,.3);display:none}
  .scrim.show{display:block}


  /* real cover/back images */
  .page.cover.img,.page.backcover.img{padding:0;background:var(--navy-d)}
  .page.cover.img .pbody,.page.backcover.img .pbody{padding:0}
  .coverimg{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .brand .logo{width:26px;height:30px;flex:none;border-radius:5px;
    background:var(--navy-d);border:1px solid rgba(214,163,41,.55);
    display:grid;place-items:center;padding:3px}
  .brand .logo img{width:100%;height:100%;object-fit:contain;display:block}

  /* two-page toggle in the bottom rail */
  .rail .nbtn svg{width:19px;height:19px}
  .rail .nbtn.on{background:var(--gold);border-color:var(--gold);color:var(--navy-d)}
  /* when opened inside the app modal, leave room top-right for its close (✕) button */
  body.embedded .bar{padding-right:64px}

  @media (max-width:700px){
    .tbtn .lbl{display:none}
    .tbtn{padding:0 9px}

{n:"5", t:"Introducción", sec:"INTRODUCCIÓN", h:`
<p>El propósito de este manual es asistir a estudiantes presentes y futuros en proveer información sobre nuestra institución, su propósito, programas académicos, servicios estudiantiles y procedimientos/políticas administrativas. Toda pregunta debe ser dirigida a la Oficina Administrativa River University, localizada en 3738 River International Drive en Tampa, Florida 33610. Tel. (813) 849-6641. Email RUadmin@revival.com</p>
<h3>ACREDITACIÓN Y AFILIACIONES</h3>
<p>River University es un instituto acreditado en estudios avanzados y afiliados con la Comisión Internacional de Transworld Accrediting localizada en 9085 California Avenue, Riverside, CA 92503. Tel. (951) 901-5586. River University está reconocida por la Legislatura del Estado de Florida como una identidad incorporada de mayor aprendizaje con la autoridad de ofrecer títulos universitarios. RU equipa estudiantes para entrar al ministerio con el fuego de Dios, a ganar almas, sacudir naciones y tomar territorio para el Reino. La impartición que los estudiantes de RU reciben es por la unción del Espíritu Santo, lo cual ninguna agencia de acreditación puede dar. La acreditación es un proceso de revisión por una agencia externa para asegurar que una institución de títulos universitarios cumple con el estándar establecido por organizaciones representando la comunidad académica, profesionales, y otras partes interesadas. Para mantener acreditación la institución o programa debe someterse a un revisó similar sobre una base regular. Un contorno de los estándares usado para evaluar la RU puede ser encontrado aquí. http://transworldaccrediting.com/accreditation-information/ Es importante notar que ni el Estado de la Florida ni el Gobierno Federal de US acreditan ninguna institución de títulos universitarios. Todas las agencias de acreditación son organizaciones privadas.</p>
<h3>EL NOMBRE DEL COLEGIO</h3>
<p>El nombre del colegio, RU (en adelante RU), fue escogido de Juan 7:38-39b, "El que cree en mí, como dice la Escritura, de su interior correrán ríos de agua viva. Esto dijo del Espíritu que habían de recibir los que creyesen en él..."</p>
<p>El PROGRAMA DE MANEJO DEL COLEGIO: POPULI RU usa un programa de manejo colegial basado en la red de comunicaciones llamado Populi. El mismo provee interacción en vivo con los cursos, instructores, calificaciones, transcripciones, admisiones, facturación y otros servicios estudiantiles. Durante la registración, el estudiante recibirá un perfil en Populi, como usuario activo por el cual tendrá toda comunicación e interacción con el instituto. Es importante que cada estudiante tenga un correo electrónico activo y acceso a una computadora para poder tener un año exitoso aquí en el instituto. Cada vez que este manual estudiantil hace referencia al programa de manejo colegial, se refiere a Populi.</p>
<h3>DECLARACIÓN DE NO-DISCRIMEN</h3>
<p>RU es una institución de educación cristiana, con igualdad de oportunidades. Solicitantes cualificados son admitidos sin importar raza, color, origen nacional o étnico, estatus de incapacidad, estatus de veterano, a todos los derechos, privilegios, programas y actividades generalmente acordadas o hechas disponibles en el colegio. En nuestra administración no discriminamos a base de raza, color, origen nacional o étnico, sobre políticas educacionales, políticas de admisiones u otros programas administrados por esta institución.</p>`},
{n:"6", t:"Declaración De Propósitos", sec:"DECLARACIÓN DE PROPÓSITOS", h:`
<p>RU abarca siete escuelas:</p>
<ul><li>River Bible Institute,</li><li>El Instituto Bíblico River en Español,</li><li>River School of Worship,</li><li>River School of Government,</li><li>River Culinary Institute,</li><li>River School of Media,</li><li>River Automotive Institute</li></ul>
<p>Los programas de la RU existen con el propósito de entrenar hombres y mujeres en el espíritu de avivamiento, para una nueva generación de ministerios, pastores, líderes, músicos y adoradores. Esto no es solo para los ministros de tiempo completo, sino para todo el pueblo de Dios que anhela más. Es un lugar donde la Palabra de Dios y el Espíritu Santo se unen para producir vida y ministerios que son lanzados por el mundo.</p>
<p>El programa del Instituto River (RBI) provee calidad de instrucción bíblico-académica, llena del Espíritu, más educación práctica para hombres y mujeres llamados al ministerio quíntuple. El programa ministerial también provee instrucción para quienes desean estar mayormente equipados en otras áreas del servicio Cristiano.</p>
<p>El programa del River School of Worship (RSW) (En inglés) provee calidad de instrucción bíblico- académica, llena del Espíritu, más educación práctica para hombres y mujeres llamados a ser líderes de adoración. El programa para líderes de adoración provee instrucción para los que desean ser parte de un equipo de alabanza y adoración.</p>
<p>El programa del The River School of Government (RSG) (En inglés) existe con el propósito de entrenar hombres y mujeres en el espíritu de avivamiento, para el gobierno en el siglo 21. Esto no es solo para los que sienten el llamado a ser candidatos, sino para todo el pueblo de Dios que anhela conocer más y ver un cambio en el ambiente político.</p>
<p>El programa River Culinary Institute (RCI) (En inglés) existe con el propósito de capacitar a hombres y mujeres en Culinaria para trabajar en y con la industria hotelera y todos los ámbitos a los que está conectada. Este programa es selectivo y requerirá la aprobación del jefe de cocina para capacitar.</p>
<p>El programa River School of Media (RSM) (En inglés) existe para levantar una nueva generación de creativos llenos del Espíritu Santo que son ungidos para usar los medios como una herramienta para el evangelismo, el discipulado y la influencia cultural. Arraigado en el fuego del avivamiento, este programa capacita a los estudiantes para proclamar audazmente el Evangelio a través de películas, transmisiones, fotografías y plataformas digitales.</p>
<p>El programa de River Automotive Institute (RAI) combina el aprendizaje en el aula con la capacitación práctica para desarrollar la competencia técnica, el profesionalismo, la integridad y el compromiso con la excelencia esenciales para el éxito en la industria automotriz. Los estudiantes reciben instrucción bíblica, teológica, ministerial, de liderazgo y automotriz práctica, diseñada para equiparlos a usar el servicio automotriz y la capacitación vocacional como instrumentos de evangelismo, discipulado, misiones, alcance comunitario y servicio a individuos y familias necesitadas.</p>`},
{n:"7", t:"Declaración De Fe", sec:"DECLARACIÓN DE FE", h:`
<p><b>Las Escrituras</b> &ndash; La Biblia es la Palabra de Dios inspirada. Es el producto de hombres santos de tiempos de antes que hablaron y escribieron según movidos por el Espíritu Santo. Este nuevo pacto en el Nuevo Testamento, es aceptado por nosotros como guía infalible en asuntos respecto a la doctrina y conducta. (2 Tim. 3:16, 1 Tes. 2:13, 2 Ped. 1:21)</p>
<p><b>La Deidad</b> &ndash; Nuestro Dios es uno, pero manifestado en tres personas, El Padre, Hijo y Espíritu Santo, coexistiendo en igualdad (Filip. 2:6). Dios Padre es más grande que todos: Quien envió La Palabra (LOGOS) y nos creó (Jn 14:28, Jn 16:28, Jn 1:14). El Hijo es el verbo hecho carne, el Unigénito y quién ha existido con el Padre desde el principio (Juan 15:26).</p>
<p><b>El Hombre, Caída y Redención</b> &ndash; El hombre fue creado y hecho en la imagen de Dios, pero por causa de la caída de Adán, el pecado entró al mundo. “Por cuanto todos pecaron y están destituidos de la gloria de Dios”. Así como está escrito, “no hay justo, ni aun uno”. Jesucristo, el Hijo de Dios fue manifestado para deshacer la obra del diablo, dando Su vida y derramando Su sangre para redimir al hombre y restaurarlo con Dios (Rom. 5:14, Rom. 3:10, Rom. 3:23, 1 Jn 3:8). La salvación es el regalo de Dios para el hombre, aparte de las obras de la Ley, más operando bajo la gracia por medio de la fe en Cristo produciendo obras aceptables a Dios (Efesios 2:8).</p>
<p><b>La Vida Eterna y El Nuevo Nacimiento</b> &ndash; El primer paso del hombre hacia la salvación es la tristeza que es según Dios que produce arrepentimiento. El Nuevo Nacimiento es necesario para toda persona y cuando es experimentado, produce vida eterna (2 Cor. 7:10, 1 Juan 5:12, Juan 3:3-5)</p>
<p><b>Bautismo de Agua</b> &ndash; El bautismo por inmersión en agua es un mandamiento directo de nuestro Señor y es para Creyentes solamente. Esta ordenanza es un símbolo del Cristiano, identificándose con la muerte, entierro y resurrección de Cristo (Mat. 28:19, Rom. 6:4, Col. 2:12, Hechos 8:36-39). Las siguientes recomendaciones sobre la fórmula del bautismo en agua son adoptadas; “Por la confesión de tu fe en nuestro Señor Jesucristo, el hijo de Dios, y por esa autoridad, yo te bautizo en el nombre del Padre, del Hijo y el Espíritu Santo. Amén.”</p>
<p><b>Bautismo en el Espíritu Santo</b> &ndash; El bautismo en el Espíritu Santo y el fuego es el regalo que Dios ha prometido por el Señor Jesucristo a todo Creyente en esta dispensación y es recibido subsiguiente al Nuevo Nacimiento. Esta experiencia es acompañada por la evidencia inicial de hablar en lenguas según el Espíritu Santo nos da el lenguaje (Mat. 3:11, Juan 14:16-17, Hechos 1:9, Hechos 2:38-39, Hechos 19:1-7, Hechos 2:4).</p>
<p><b>Santificación</b> &ndash; La Biblia enseña que sin la santidad ninguno puede ver a Dios. Creemos en la Doctrina de la Santificación como una definitiva y aun progresiva bajo la gracia, comenzando en el momento de la regeneración, más continuando hasta la consumada salvación al Cristo regresar (Heb. 12:14, 1 Tesa. 5:23, 2 Ped. 3:18, Fil. 3:12- 14, 1 Cor. 1:30).</p>
<p><b>Sanidad Divina</b> &ndash; La Sanidad es para las enfermedades físicas del cuerpo humano y está disponible por medio del poder de Dios, la oración de fe y la imposición de las manos. Esto está provisto por el sacrificio de Cristo y es el privilegio de cada miembro de la Iglesia hoy día. Marcos 16:18, Stgo 5:14-15, 1 Ped. 2:24, Mat. 8:17, Isa. 53:4-5).</p>
<p><b>La Resurrección del Justo y la 2da Venida de Jesucristo</b> &ndash; Los ángeles dijeron a los discípulos de Jesús, “Este mismo Jesús, que ha sido tomado de vosotros al cielo, así vendrá como le habéis visto ir al cielo”. Su regreso es inminente. Cuando El regrese, “…y los muertos en Cristo resucitarán primero. Luego nosotros los que vivimos, los que hayamos quedado, seremos arrebatados juntamente con ellos en las nubes para recibir al Señor en el aire…” (Hechos 1:11, 1 Tesa. 4:16-17). Luego de la Tribulación, El regresará a la tierra como Rey de reyes y Señor de señores, junto a Sus santos, quienes serán reyes y sacerdotes. El reinará mil años (Apoc. 20:6).</p>
<p><b>El Infierno y la Retribución Eterna</b> &ndash; Aquel que muere físicamente en sus pecados sin aceptar a Cristo, queda eternamente perdido en el Lago de Fuego y por ende no tendrán otra oportunidad de arrepentimiento o para escuchar el evangelio. El Lago de Fuego es literal. El término “eterno” que es utilizado para describir la duración del castigo de los malditos en el Lago de Fuego, lleva el mismo pensamiento y significado de la existencia sin fin, así como cuando utilizada en denotar la duración del gozo y éxtasis de los santos en la presencia de Dios. (Heb. 9:27, Apoc. 19:20).</p>`},
{n:"8", t:"Declaración De Fe", sec:"DECLARACIÓN DE FE", h:`
<p>Declaración de Autoridad Final Para Asuntos de Fe/Creencia y Conducta:</p>
<p>La declaración de fe no agota la medida de nuestras creencias. La fuente final en que únicamente basamos nuestra fe es la Biblia, la inspirada Palabra de Dios infalible, la cual habla con autoridad final respecto a la verdad, moralidad y conducta apropiada de la humanidad. Para propósitos de fe, doctrina, práctica, política, y disciplina de RMI, nuestro pastor y la junta de gobierno son la autoridad interpretativa de esta organización en cuanto al significado y aplicación de la Biblia.</p>
<p>Declaración del Matrimonio, Género y Sexualidad:</p>
<p>Creemos que Dios crea a cada persona maravillosa e inmutablemente como hombre o mujer. Estos dos géneros distintos y complementarios, reflejan la imagen y naturaleza de Dios. (Génesis 1:26-27) Rechazo del sexo biológico propio es rechazar la imagen de Dios dentro de su persona.</p>
<p>Creemos que el término “matrimonio” tiene solo un significado: la única y exclusiva unión de un hombre y una mujer, así como delineada en las Escrituras Bíblicas. (Génesis 2:18-25) Creemos que Dios tiene la intención de que la intimidad sexual solo ocurra entre un hombre y una mujer que estén casados el uno con el otro. (1 Corintios 6:18; 7:2-5; Hebreos 13:4) Creemos que Dios ha comandado que ninguna actividad de intimidad sexual se comprometa fuera del matrimonio de un hombre y una mujer.</p>
<p>Creemos que cualquier forma de inmoralidad sexual (incluyendo adulterio, fornicación, comportamiento homosexual, comportamiento bisexual, bestialidad, incesto, y uso de pornografía) es pecado e ofensivo para Dios. (Mateo 15:18-20; 1 Corintios 6:9-10)</p>
<p>Creemos que para preservar la función e integridad de RMI como el cuerpo local de Cristo y proveer un modelo bíblico a los miembros de la Iglesia River y la comunidad, es imperativo que toda persona empleada por RMI que sirva en cualquier capacidad o como voluntario acepte y cumpla con esta Declaración de matrimonio, género y sexualidad. (Mateo 5:16; Filipenses 2:14-16; 1 Tesalonicense 5:22)</p>
<p>Creemos que Dios ofrece redención y restauración a todos los que confiesan y abandonan su pecado, buscando Su misericordia y perdón por medio de Jesucristo. (Hechos 3:19-21; Romanos 10:9-10; 1 Corintios 9:9-11)</p>
<p>Creemos que a cada persona se le otorgue compasión, amor, gentileza, respeto y dignidad. (Marcos 12:28- 31; Lucas 6:31) Comportamiento odioso y acosador o actitud dirigida hacia cualquier individuo ha de ser repudiada y no está de acuerdo con las Escrituras Bíblicas ni las doctrinas de RMI, La Iglesia River, RU o RMIMA.</p>`},
{n:"9", t:"Facilidades Del Campus", sec:"FACILIDADES DEL CAMPUS", h:`
<h3>LOCALIZACIÓN</h3>
<p>RU está localizada al este de la ciudad de Tampa, Florida. Nuestra dirección es 3738 River International Drive, Tampa, Florida 33610. El campus tiene fácil acceso a las autopistas interestatales 75 y la 4.</p>
<h3>DESCRIPCIÓN</h3>
<p>El campus de RU está contenido en más de 90 acres de verdes campos y hermosos paisajes. Sus facilidades son compartidas con “Revival Ministries International” y la Iglesia River en Tampa Bay. Los salones y el auditorio escolar están localizados en dos edificios independientes dentro del campus.</p>
<h3>SEGURIDAD Y PROTECCIÓN</h3>
<p>RU ha cumplido con todos los códigos locales, estatales y federales de construcción, salud y seguridad. Todos los códigos de construcción iniciales han sido completados, más llevamos inspecciones de sanidad y de fuego cada año. El personal de seguridad es parte de los oficiales de la Iglesia The River at Tampa Bay, y sirven para mantener seguridad en las facilidades y sus contenidos. Mantenemos un oficial custodio en las facilidades para asegurar su limpieza.</p>
<h3>TRANSPORTACIÓN Y ESTACIONAMIENTO</h3>
<p>RU ofrece estacionamiento para la facultad, oficiales y estudiantes. Nuestro estacionamiento está iluminado y ofrece aproximadamente más de 2000 espacios alrededor del campus.</p>
<p>El estacionamiento en el campus es solo con permiso. Todos los estudiantes que estacionen u operen un vehículo motorizado en la propiedad del campus deben registrar su vehículo y exhibir un permiso de estacionamiento válido en todo momento. Los vehículos que se encuentren en el campus sin un permiso debidamente exhibido o sin registro virtual estarán sujetos a citación y/o remolque a expensas del propietario.</p>
<p>Los pases de estacionamiento se entregarán a los estudiantes inscritos al completar el proceso de registro. Estos pases deben exhibirse de manera visible en todo momento mientras el vehículo se encuentre en las instalaciones. Por favor, asegúrese de que su vehículo esté siempre estacionado en el área designada para estudiantes.</p>
<p>Ningún vehículo inhabilitado puede permanecer o dejarse en el campus de RU.</p>
<p>Ningún vehículo puede dejarse desatendido en el campus de RU, a menos que el estudiante esté asistiendo a un evento ministerial. El estudiante debe estar en el campus si su vehículo está estacionado allí. Después de una advertencia, el vehículo será remolcado a expensas del propietario.</p>
<p>El estacionamiento durante la noche solo se permitirá si el estudiante está asistiendo a un evento ministerial y necesita dejar un vehículo en el campus. Se debe obtener permiso de la Administración de RU y de seguridad de The River at Tampa Bay Church para dejar cualquier vehículo en el estacionamiento del campus. Los vehículos serán asignados adecuadamente y las llaves deberán entregarse a seguridad. Después de una advertencia, el vehículo será remolcado a expensas del propietario.</p>
<h3>TRANSPORTACIÓN PÚBLICA</h3>
<p>Tampa tiene un sistema establecido de transportación pública, con servicio para toda la ciudad. Para más información sobre estos servicios ofrecidos por la ciudad de Tampa, favor contactar la oficina regional de tránsito en Hillsborough al (813) 254-4278 o visiten www.gohart.org.</p>`},
{n:"10", t:"Facilidades Del Campus", sec:"FACILIDADES DEL CAMPUS", h:`
<h3>HORARIO DE OFICINA</h3>
<p><b>El horario para asuntos estudiantiles es de 1:00 PM</b> &ndash; 1:30PM De lunes a viernes o por cita para la oficina de administración, Principal, o Decano. Como la oficina de la RU está localizada en el campus de la Iglesia, The River at Tampa Bay / RMI, estudiantes solo recibirán acceso a la oficina anotando su nombre y obteniendo una credencial de visitante con la recepcionista después de la 1:00 PM. El Segundo piso es un nivel seguro y solo personal autorizado está permitido. Si usted no tiene identificación apropiada, la seguridad le removerá del segundo piso. He aquí algunos recordatorios:</p>
<ul><li>Su ID estudiantil tiene que estar presente en todo momento mientras esté en la propiedad de</li></ul>
<p>The River at Tampa Bay Church.</p>
<ul><li>Los Servicios Estudiantiles están disponibles en el horario mencionado en la entrada principal.</li><li>Favor de no hacer preguntas a la recepcionista de entrada sobre RU</li><li>Favor de no interrumpir al personal de RU fuera de horas de oficina.</li></ul>
<h3>LANGUAGE</h3>
<p>El idioma oficial de RU es el inglés. La traducción de otros idiomas no está disponible.</p>
<h3>ACOMODO RAZONABLE</h3>
<p>Ningún estudiante cualificado será negado oportunidades educativas, por motivo de discapacidad. RU no discrimina en contra de personas calificadas que tienen alguna discapacidad y proveerá acomodo razonable a base de esa discapacidad documentada, en el ambiente físico, educativo y los requisitos académicos.</p>`},
{n:"11", t:"Facilidades Del Campus", sec:"FACILIDADES DEL CAMPUS", h:`
<h3>ITINERARIO ANUAL</h3>
<p>Nuestra escuela opera en un itinerario cuatrimestral. 1er cuatrimestre: agosto a octubre                       3er cuatrimestre: enero a marzo 2do cuatrimestre: noviembre a diciembre                  4to cuatrimestre: marzo a mayo La admisión para la inscripción en RBI es agosto y enero. Todos los demás programas se incorporan sólo en agosto.</p>
<p>Cada cuatrimestre lleva 8 semanas. Los cuatro cuatrimestres componen el año académico para nuestras escuelas. Las inscripciones estarán abiertas al comienzo de cada semestre. Ver el calendario académico para fechas específicas.</p>
<p>El programa en línea de Maestría en Ministerio Práctico consta de cuatro semestres de dieciséis semanas repartidos en dos años. Los semestres se llevarán a cabo de agosto a diciembre y de enero a mayo.</p>
<h3>ITINERARIO DIARIO</h3>
<p>Horario de clases de licenciatura en artes: Las clases son programadas durante las horas de 8:15 AM a 1:30 PM, de lunes a viernes. El programa de clases está disponible al comienzo de cada cuatrimestre, proveyendo el horario y día de cada clase ofrecida. Los laboratorios requerirán aproximadamente de 8 a 14 horas adicionales por semana fuera del horario de clases para completar los créditos del curso.</p>
<p>Horario de la clase de maestría en artes en el campus: Los estudiantes de maestría a tiempo completo en el campus estarán en su departamento asignado de "Ministerio práctico" de 9:00 a.m. a 1:00 p.m., de lunes a viernes. Las clases están programadas entre las 2:15 p.m. y las 4:30 p.m., de lunes a viernes. Los horarios de las clases están disponibles al comienzo de cada trimestre, proporcionando las ubicaciones, los días y los horarios de las clases ofrecidas. Los estudiantes de maestría no tienen ningún laboratorio requerido. Horario de la clase de maestría en artes en línea: Las clases de maestría en línea se presentan en sesiones semanales que completa a su propio ritmo. Siga las fechas de vencimiento indicadas en su curso en línea.</p>
<h3>CIERRE DE ESCUELA</h3>
<p>En el evento de un cierre escolar no programado o cancelación de clase, intentaremos contactar a los/as estudiantes vía Populi y otros medios disponibles. El estudiante será responsable de asegurar que su información más corriente se mantenga en el archivo de Populi.</p>
<p>Los estudiantes también podrán llamar a la Oficina Administrativa al (813) 849-6641 para información grabada que estará disponible en la máquina contestadora y enlistada en noticias de Populi. Ningún estudiante podrá ser contado ausente por un cierre escolar no programado o cancelación de clase.</p>`},
{n:"12", t:"Facilidades Del Campus", sec:"FACILIDADES DEL CAMPUS", h:`
<h3>POLÍTICA DE PUERTAS ABIERTAS</h3>
<p>Las Oficinas de RU Administración está localizada en las facilidades de la Iglesia The River at Tampa Bay. Nos esforzamos en mantener la política de puertas abiertas para su facultad y estudiantes. Para asistirle y mejor servirle, por favor, envíe un formulario de Solicitud de Reunión a la oficina de la escuela para programar una cita con el Decano, los Pastores o el Administrador.</p>
<h3>PARA OBTENER INFORMACIÓN</h3>
<p>Información general sobre nuestras escuelas está localizada en nuestra página de internet www.RiverUniversity.org. Esta información incluye, y no es limitada a, información de solicitud para aplicación, política general y procedimientos académicos, información de cursos, itinerario escolar y académico, más materiales adicionales y pertinentes al colegio.</p>
<h3>VISITANTES</h3>
<p>Se requiere que toda persona visitando nuestro campus, esté registrada con la oficina de la escuela previa a su visita para poder darle la bienvenida apropiada y asegurar que el proceso de seguridad correcto está implementado. Se requiere notificación amplia de 24 horas antes con la aprobación de la Oficina Administrativa RU antes que una visita pueda sentarse en una de las clases. En el día de visita, podrá obtener una credencial temporera en la Entrada de Alumnos, la cual deberá tener visible durante la visita. Se requiere que una visita cumpla una tarjeta de consulta y puede sentarse en clase por solo dos días. Su solicitud puede ser enviada a RUadmin@revival.com.</p>
<h3>LIBROS DE TEXTO</h3>
<p>Al comienzo de cada cuatrimestre, todo estudiante recibirá información relacionada al material de lectura requerido. Se les proveerá título, autor y número de ISBN para que puedan comprar los libros por medio de recursos fuera de esta institución. Hay varias tiendas en la ciudad que venden libros nuevos y usados, al igual que tiendas en internet que ofrecen libros a un costo razonable.</p>
<h3>SERVICIOS DE FOTOCOPIADO</h3>
<p>Nuestras oficinas no proveen servicios de fotocopiado para estudiantes.</p>
<h3>COMEDOR ESTUDIANTIL</h3>
<p>Comidas y bebidas están a la venta en el Kings Arms Coffee localizado en la entrada principal de la Iglesia The River at Tampa Bay. No se permitirá ningún tipo de comida o bebida en el salón o el santuario de la iglesia. Sólo será permitido agua embotellada en el salón o en el santuario. Solo se permite comer afuera. Kings Arms Coffee solo servirá comidas y bebidas a estudiantes durante los descansos entre clases y luego al culminar las clases ese día. Una vez que el primer timbre suene, favor de salir del café y regresar al salón.</p>
<h3>GUARDERIA DE NINOS</h3>
<p>Servicios de Cuidado de niños está disponible por orden de llegada en el campus para alumnos con hijos entre las edades de uno y cinco años por un cargo nominal de $210.00 por mes, por niño. Si usted necesita guardería de niños, por favor asegúrese de visitar la mesa de Guardería de Niños durante la registración. El cupo es limitado por lo tanto tenga alternativas para cuidado de niños si lo requiere. Por favor vea la página Información Financiera para más detallada.</p>`},
{n:"13", t:"Programas De Estudios", sec:"FACILIDADES DEL CAMPUS", h:`
<h3>PROGRAMAS DE ESTUDIOS</h3>
<p>RU fue establecido para equipar a hombres y mujeres a ser victoriosos en cada área de sus vidas. ¡Es nuestro deseo producir hombres y mujeres de Dios que lleven el conocimiento en la Palabra de Dios, tengan fuertes principios de Fe, sientan compasión hacia las necesidades del prójimo, y tengan audacia como un león! Con esto en mente, La RU ofrece varios programas de estudio. Entre estos se encuentran el River Bible Institute, River School of Worship, River School of Government, River Culinary Institute, River School of Media y River Automotive Institute.</p>
<p><b>RU</b> &ndash; Año Fundamental RU ofrece un Año Fundamental donde los estudiantes obtendrán valores fundamentales, conocimientos, habilidades e impartición que ayudarán a equipar, formar, moldear y expandir a los estudiantes para convertirse en participantes activos en la obra de Dios referente a su llamado. Todos los estudiantes que ingresen a RU participarán en el Año Fundamental, independientemente del programa en el que sean aceptados en la inscripción inicial. Durante el Año Fundamental, cada programa ofrecerá laboratorios y serán cursos introductorios al programa seleccionado que los fundará en sus cursos esenciales durante el segundo año.</p>
<p><b>INSTITUTO BÍBLICO RIVER ESPAÑOL</b> &ndash; Segundo y Tercer Año El Instituto Bíblico River está diseñado para aquellos que deseen realizar un estudio profundo de la Biblia y experimentar la gloria de Dios. Este programa no es solo para el ministro de tiempo completo, sino tanto para los nuevos conversos como para las personas que desean saber cómo aplicar la Biblia a su vida diaria.</p>
<p>El segundo y tercer año del Instituto Bíblico River fueron creados como un campo de entrenamiento enfocado para aquellos que sienten un llamado al ministerio quíntuple de apóstoles, profetas, evangelistas, pastores y maestros.</p>
<p>Los estudiantes inscritos en este programa se capacitarán para el ministerio, realizarán un estudio intenso de la Biblia, mejorarán sus habilidades, obtendrán una comprensión más profunda de las cosas de Dios, aprenderán cómo relacionarse mejor con las personas y obtendrán instrucción invaluable sobre la fe, el Espíritu Santo, la profecía bíblica y otras áreas teológicas.</p>
<p>En el tercer año, junto con los cursos ofrecidos, los estudiantes recibirán capacitación práctica en The River at Tampa Bay Church participando en una rotación de todos los departamentos ministeriales para obtener conocimiento práctico de las operaciones diarias en un entorno de iglesia y ministerio.</p>
<p>El programa del Instituto Bíblico River se mide en horas de crédito académico. Las horas de crédito académico son transferibles de una institución postsecundaria a otra y están sujetas a las pautas y restricciones de la institución postsecundaria que recibe los créditos.</p>
<p>Los estudiantes inscritos en este programa que completen con éxito todos los cursos requeridos recibirán una Licenciatura en Artes en Ministerio.</p>
<p>Los estudiantes que cumplan con todos los requisitos de graduación y completen este programa de tres años en su totalidad pueden participar en los ejercicios anuales de graduación con regalía de graduación.</p>`},
{n:"14", t:"Programas De Estudio", sec:"FACILIDADES DEL CAMPUS", h:`
<h3>PROGRAMAS DE ESTUDIO</h3>
<p><b>RIVER BIBLE INSTITUTE</b> &ndash; Master of Arts in Practical Ministry La Maestría en Artes en Ministerio Práctico es un programa altamente selectivo, diseñado para desarrollar y perfeccionar aún más los dones de los estudiantes mientras sirven en el ministerio. El plan de estudios presenta cursos construidos en torno a los mensajes y enseñanzas clave que han moldeado directa y personalmente el ministerio y la vida de los Dres. Rodney y Adonica Howard-Browne. Este programa tiene como objetivo impartir los principios y materiales fundamentales que ellos consideran más esenciales para establecer una base bíblica sólida y equipar a los estudiantes para el éxito y la efectividad a largo plazo en el ministerio. Este programa es exclusivo para graduados de tercer año que hayan obtenido su título de Licenciatura en Artes en un programa correspondiente y hayan sido aprobados por el Presidente de la universidad. El contenido del programa se imparte mediante dos métodos:</p>
<ul><li>En el campus para estudiantes a tiempo completo.</li><li>En línea para estudiantes a tiempo parcial que ya trabajan en RMI.</li></ul>
<p>El programa del Instituto Bíblico River se mide en horas de crédito académico. Las horas de crédito académico son transferibles de una institución postsecundaria a otra y están sujetas a las pautas y restricciones de la institución postsecundaria que recibe los créditos. Los estudiantes matriculados en este programa que completen con éxito todos los cursos requeridos recibirán un Maestría en Artes en Ministerio Práctico. Los estudiantes que cumplan todos los requisitos de graduación y completen este programa del M.A en su totalidad podrán participar en la ceremonia anual de graduación con la toga y el birrete.</p>
<p><b>RIVER SCHOOL OF WORSHIP (En inglés)</b> &ndash; Segundo y Tercer Año El programa de segundo y tercer año de River School of Worship fue creado como un campo de entrenamiento para aquellos que sienten un llamado al ministerio de música y adoración a tiempo completo. Los estudiantes inscritos en este programa se capacitarán para puestos como líder o pastor de adoración y desarrollarán las habilidades adicionales necesarias para ministrar en esa vocación. Este programa está diseñado para levantar una nueva generación de líderes de adoración, músicos y adoradores para infiltrarse en nuestra cultura y en el mundo con la presencia de Dios. El plan de estudios fue diseñado con el estudiante en mente que desea realizar estudios adicionales para el ministerio quíntuple o continuar los estudios bíblicos junto con su entrenamiento de adoración. Combina la instrucción fundamental del primer año del Instituto Bíblico River con la capacitación en adoración para dar a los estudiantes una experiencia completa con el Espíritu Santo y fuego. El programa del River School of Worship se mide en horas de crédito académico. Las horas de crédito académico son transferibles de una institución postsecundaria a otra y están sujetas a las pautas y restricciones de la institución postsecundaria que recibe los créditos. Los estudiantes inscritos en este programa que completen con éxito todos los cursos requeridos recibirán una Licenciatura en Artes en Adoración. Los estudiantes que cumplan con todos los requisitos de graduación y completen este programa de tres años en su totalidad pueden participar en los ejercicios anuales de graduación con regalía de graduación.</p>`},
{n:"15", t:"Programas De Estudio", sec:"FACILIDADES DEL CAMPUS", h:`
<h3>PROGRAMAS DE ESTUDIO</h3>
<p>RIVER SCHOOL OF GOVERNMENT (En inglés) - Segundo y Tercer Año El River School of Government fue establecido para levantar hombres y mujeres, llenos del Espíritu Santo, que gobernaran de acuerdo a principios cristianos y que defiendan fielmente los derechos y libertades que son garantizadas por la Constitución y la Palabra de Dios. Su propósito no es producir políticos que abusen su posición para ganancia personal o poder, sino es para inspirar a los líderes del mañana para que honren y mantengan la integridad de la Constitución y la Palabra de Dios trayendo a América de vuelta a los principios fundamentales. El programa del River School of Government se mide en horas de crédito académico. Las horas de crédito académico son transferibles de una institución postsecundaria a otra y están sujetas a las pautas y restricciones de la institución postsecundaria que recibe los créditos. Los estudiantes inscritos en este programa que completen con éxito todos los cursos requeridos recibirán una Licenciatura en Artes en Ministerio en Gobierno Bíblico. Los estudiantes que cumplan con todos los requisitos de graduación y completen este programa de tres años en su totalidad pueden participar en los ejercicios anuales de graduación con regalía de graduación.</p>
<p><b>RIVER CULINARY INSTITUTE (En inglés)</b> &ndash; Año Dos y Tres El River Culinary Institute se estableció con el propósito de capacitar a hombres y mujeres en Culinaria para trabajar en y con la industria hotelera y todos los ámbitos con los que está conectada. Ya sea para establecer un departamento de hospitalidad de clase mundial en su iglesia local, iniciar un negocio del Reino en el sector de la hospitalidad o usar su conocimiento como una plataforma para llegar a las comunidades locales para predicar el Evangelio de Jesucristo, el River Culinary Institute está decidido a capacitar a graduados completos. El programa River Culinary Institute se mide en horas de crédito académico. Las horas de crédito académico son transferibles de una institución postsecundaria a otra y están sujetas a las pautas y restricciones de la institución postsecundaria que recibe los créditos. Los estudiantes inscritos en este programa que completen con éxito todos los cursos requeridos recibirán una Licenciatura en Artes Culinarias Cristianas. Los estudiantes que cumplan con todos los requisitos de graduación y completen este programa de tres años en su totalidad pueden participar en los ejercicios anuales de graduación con regalía de graduación.</p>`},
{n:"16", t:"Programas De Estudio", sec:"FACILIDADES DEL CAMPUS", h:`
<h3>PROGRAMAS DE ESTUDIO</h3>
<p><b>RIVER SCHOOL OF MEDIA (En inglés)</b> &ndash; Año Dos y Tres El River School of Media es un campo de entrenamiento práctico e inmersivo para la próxima generación de evangelistas digitales. Diseñada como un programa de 3 años bajo RU y el liderazgo de los Dres. Rodney y Adonica Howard-Browne, esta escuela equipa a los estudiantes con la base espiritual, las habilidades técnicas y la visión creativa necesaria para usar los medios como una herramienta para el Evangelio. Los estudiantes están capacitados en áreas como producción cinematográfica, transmisión en vivo, iluminación, audio, fotografía, edición, narración de historias y tecnologías emergentes como la inteligencia artificial (IA), todo mientras se mantienen arraigados en el poder y la presencia de Dios. El avivamiento no es solo un tema aquí; es la atmósfera en la que aprenden los estudiantes. La River School of Media es más que un salón de clases: es un movimiento de avivadores creativos, capacitados y listos para transmitir el Evangelio con excelencia, innovación y unción. El programa River School of Media se mide en horas de crédito académico. Las horas de crédito académico son transferibles de una institución postsecundaria a otra y están sujetas a las pautas y restricciones de la institución postsecundaria que recibe los créditos. Los estudiantes inscritos en este programa que completen con éxito todos los cursos requeridos recibirán una Licenciatura en Artes en Medios y Producciones Cristianas. Los estudiantes que cumplan con todos los requisitos de graduación y completen este programa de tres años en su totalidad pueden participar en los ejercicios anuales de graduación con regalía de graduación.</p>
<p><b>RIVER AUTOMOTIVE INSTITUTE (En inglés)</b> &ndash; Año Dos y Tres El programa de River Automotive Institute existe con el propósito de capacitar a hombres y mujeres en servicio, reparación y diagnóstico automotriz para trabajar en la industria automotriz y en todos los ámbitos relacionados con ella. A través de instrucción técnica y capacitación práctica, los estudiantes desarrollarán el conocimiento, las habilidades técnicas, el carácter y un espíritu de excelencia necesarios para liderar con integridad, demostrando valores cristianos en el lugar de trabajo mientras utilizan su profesión como plataforma para alcanzar e impactar a otros. Los estudiantes son capacitados mediante un plan de estudios alineado con ASE que combina instrucción en el aula con capacitación práctica para prepararlos para la certificación ASE y el éxito en la industria automotriz. River Automotive Institute se mide en horas de crédito académico. Las horas de crédito académico son transferibles de una institución postsecundaria a otra y están sujetas a las pautas y restricciones de la institución postsecundaria que recibe los créditos. Los estudiantes inscritos en este programa que completen exitosamente todos los cursos requeridos recibirán una Licenciatura en Artes en Ministerio y Excelencia en Servicio Automotriz. Los estudiantes que cumplan con todos los requisitos de graduación y completen este programa de tres años en su totalidad podrán participar en las ceremonias anuales de graduación con toga y birrete.</p>`},
{n:"17", t:"Admisiones E Inscripción", sec:"ADMISIONES E INSCRIPCIÓN", h:`
<h3>ADMISIÓN GENERAL</h3>
<p>Somos una institución de educación Cristiana, la cual admite a solicitantes cualificados sin importar raza, color, origen nacional o étnico, estatus de incapacidad, estatus de veterano.</p>
<p>Solicitante cualificado es una persona que cumple con los requisitos de admisión general al igual que con los requisitos específicos para el programa para el programa que van a cursar. RU reservan el derecho de admisión. Cada solicitante tiene que cumplir con los siguientes requisitos de admisión general:</p>
<ol><li>Mínimo de 18 años de edad.</li><li>Completar la hoja de solicitud del RU del programa seleccionada.</li><li>Someter una foto de pasaporte reciente para propósitos de identificación, junto a la solicitud</li></ol>
<p>completada.</p>
<ol><li>Someter transcripciones oficiales de escuela superior o examen de equivalencia. Someter</li></ol>
<p>transcripciones oficiales de estudios universitarios (si es aplicable).</p>
<ol><li>Si se solicita, someter evidencia de salud física y mental en buenas condiciones.</li><li>Si se solicita, someter reporte de examen físico incluyendo vacunas y dopajes de droga.</li><li>Tener disposición económica para cubrir sus gastos de matrícula y educación (si sea aplicable) ya</li></ol>
<p>que RBIE no acepta ningún tipo de asistencia económica del gobierno federal o préstamos de estudio en estos momentos.</p>
<ol><li>Tener un apoyo financiero adecuado fuera del costo de la matrícula y las cuotas.</li><li>Debe tener una vivienda establecida para el año escolar.</li><li>Los cónyuges deben mudarse y vivir juntos para asistir a la escuela. Los solicitantes con hijos</li></ol>
<p>menores de 18 años deben mudarse y vivir con sus hijos para asistir a la escuela</p>
<ol><li>Llenar apropiadamente TODOS los documentos requeridos para admisión.</li><li>Asistir a la orientación de estudiantes y estar preparado para pagar la Cuota General en su totalidad.</li><li>Toda progresión depende de mantener un promedio acumulativo de puntos o GPA de 2.00 o mayor</li></ol>
<p>en todos los cursos para el primer año, 2.80 para el segundo y tercer año y 3.00 para el cuarto año.</p>
<p>TENGA EN CUENTA: Todos los extranjeros no residentes deben presentar su solicitud a través del Programa Misionero de RMI. Envíe un correo electrónico a missionary@revival.com.</p>
<p>TENGA EN CUENTA: La Maestría en Ministerio Práctico es una solicitud separada que se le envía por selección de liderazgo. Debe ser un graduado de RU con una Licenciatura en Artes en un programa RU aprobado.</p>
<p>TENGA EN CUENTA: RU se reserva el derecho de admisión. RU se reserva el derecho de rechazar la inscripción y retirar a cualquier estudiante sin necesidad de justificar la causa.</p>`},
{n:"18", t:"Admisiones E Inscripción", sec:"ADMISIONES E INSCRIPCIÓN", h:`
<h3>APLICACIÓN PARA ADMISIONES</h3>
<p>Para solicitar entrada a RU se requiere los siguientes documentos:</p>
<ol><li>Complete la Solicitud de Admisión en línea y envíela junto con una cuota de solicitud no</li></ol>
<p>reembolsable de $50.00 para los programas de licenciatura y $25.00 para el programa de maestría.</p>
<ol><li>Los estudiantes utilizando un plan de pago para su matrícula o cuota necesitarán completar una</li></ol>
<p>Solicitud de Acuerdo Financiero. (Plan de pagos solo es autorizado por la Administradora de RU)</p>
<ol><li>Los estudiantes que deseen recibir crédito académico por educación previa, deberán someter una</li></ol>
<p>transcripción oficial a las Oficinas Administrativas. Los estudiantes serán responsables por todos los gastos relacionados con la adquisición de dichas transcripciones. (Ver Cargos) Los formularios de solicitud de expediente académico estan disponibles.</p>
<ol><li>Después de enviar su solicitud completa, es posible que se requiera a los nuevos estudiantes tener</li></ol>
<p>una entrevista de preadmisión con el personal de la escuela. Las solicitudes aceptadas son válidas por 12 meses. Los estudiantes que no puedan asistir en el año escolar en curso pueden aplazar su inscripción hasta por 12 meses, después de lo cual deberán volver a presentar su solicitud (Ver Cuotas). Puede encontrar la solicitud en el sitio web www.RiverUniversity.org. Una vez toda información necesaria sea sometida, con la entrevista de preadmisión (de ser necesario) y el estudiante ha sido aceptado, el estudiante podrá pasar a orientación e inscribirse a las clases correspondientes.</p>
<h3>INSCRIPCIÓN/MATRÍCULA</h3>
<p>Las inscripciones se llevan a cabo 2 veces durante el año académico al comienzo de clases, en agosto y en enero. Los estudiantes tendrán que completar todos los requisitos de admisión e inscripción antes de matricularse. Durante la inscripción, los estudiantes reciban su número de ID estudiantil, obtengan acceso a Populi, matricularse en las clases y laboratorios, y liquidar sus finanzas.</p>
<h3>SEMANA DE AVIVAMIENTO</h3>
<p>La semana de avivamiento es obligatoria para todos los estudiantes y se considera tiempo de clase. Estudiantes de todo el mundo se unirán al Dr. Rodney Howard-Browne durante una semana de avivamiento para comenzar el nuevo año académico. Este tiempo en el fuego de Dios y la Unción preparará a los estudiantes para recibir todo lo que Dios tiene para ellos durante el año.</p>
<h3>ORIENTACIÓN</h3>
<p>Orientación es obligatorio para todos los estudiantes. Está diseñada para familiarizar los estudiante con los objetivos, plan, y propósito de RU y y guiarlos a través de las políticas y procedimientos administrativos de la universidad. .</p>`},
{n:"19", t:"Admisiones E Inscripción", sec:"ADMISIONES E INSCRIPCIÓN", h:`
<h3>EDUCACIÓN INTERRUMPIDA Y RE-INGRESO</h3>
<p>Los estudiantes que se van en buen estado, tendrán la posibilidad de regresar como estudiantes activos en una fecha futura. Si el estudiante viola o varía las normas pautadas por nuestra escuela o Revival Ministries International, RU reservan el derecho a revocar cualquier Grado o Diploma otorgado por esta institución. Cualquier estudiante que tenga un balance pendiente, se le prohibirá readmisión a esta institución hasta que el balance sea cancelado. Cualquier estudiante que sea expulsado de nuestra escuela por motivos disciplinarios, será negado readmisión hasta ser aprobado por el presidente del colegio. Los estudiantes en buen estado que deseen regresar a la escuela después de una ausencia o interrupción de sus estudios de 12 meses deben completar una solicitud de estudiante en línea, resolver cualquier saldo pendiente y pagar las cuotas requeridas para el año académico en el que se estén reinscribiendo.</p>
<h3>TRANSFERENCIA DE ESTUDIANTES</h3>
<p>Estudiantes que transfieran a cualquier de RU de otro colegio totalmente acreditado, tendrán que cumplir con los mismos requisitos de admisión que cualquier otro/a estudiante que solicite por primera vez. En adición a todos los documentos requeridos, el estudiante transferido podrá someter transcripciones oficiales de la institución a la que asistió. RU aceptaran créditos de cualquier institución acreditada por la comisión y/o agencias reconocidas por nuestra escuela. En general, créditos considerados para transferencia tienen que ser de estudios Bíblicos/Teológicos. Sin embargo, nos reservamos el derecho de rechazar créditos para cursos específicos. La revisión y aceptación de todos los créditos de transferencia es responsabilidad de la Oficina del Registrador. No se otorga crédito por ningún curso con una calificación inferior a "B". Las transferencias de crédito deben ser presentadas a la Oficina de Admisiones durante el proceso de solicitud. Toda transferencia de crédito está sujeta a un cargo administrativo (Ver Cargos). Luego de la segunda semana de clases, no se permitirán solicitudes para transferencia de créditos. Los créditos transferidos de escuelas post-secundarias serán evaluados respecto a las pautas del programa y currículo. El estudiante será notificado respecto a los resultados de esa evaluación.</p>
<h3>TOMA EN CUENTA:</h3>
<ul><li>No se otorgan créditos de transferencia para el Año Fundamental.</li><li>Se otorgarán hasta 48 créditos para obtener cualquier Licenciatura.</li></ul>
<p>De acuerdo a la ley federal, los expedientes no podrán ser emitidos sin una autorización por escrito del estudiante. Los estudiantes tendrán que firmar la solicitud de transcripción.</p>
<h3>CAMBIO DE ESCUELA</h3>
<p>Los estudiantes que desean cambiar de un programa de estudio a otro deben llenar un formulario de Solicitud de Cambio de Escuela y será revisado por las Oficinas Administrativas de la RU. La decisión final será tomada por Administración y el instructor principal del programa central deseado. Tenga en cuenta que los créditos no se transfieren entre programas centrales; por lo tanto, los estudiantes de segundo o tercer año que soliciten un cambio de programa deberán reiniciar, sin importar los créditos obtenidos. Esto está sujeto a la aprobación de la Administración y del instructor principal del programa central.</p>`},
{n:"20", t:"Admisiones E Inscripción", sec:"ADMISIONES E INSCRIPCIÓN", h:`
<h3>CURSOS AUDITORÍA UNIVERSITARIO RIVER</h3>
<p>Los auditores no están clasificados oficialmente como estudiantes; sin embargo, participan en clases de RU, mantienen las mismas obligaciones de conducta del estudiante sin el requisito de calificaciones o créditos académicos. Un auditor tendrá un identificador de "estudiante" en Populi; sin embargo, su estado de inscripción en las listas de clase se etiquetará como "Auditor". Los auditores deben pagar su matrícula por adelantado para asistir a clase, ya que no son estudiantes matriculados a tiempo completo y no son elegibles para la beca RU.</p>
<p>Se puede solicitar una constancia de estudios no oficial de los cursos auditados. Los oyentes (auditors) generalmente auditan cursos para ampliar su conocimiento de una materia sin necesidad de obtener un registro académico.</p>
<p>La auditoría de cursos de RU solo está disponible para el Año Fundacional. No se conferirá ningún título para un programa que incluya cursos auditados completados.</p>
<p>Los participantes del Programa Misionero de RMI no son elegibles para ser oyentes.</p>
<p>Para proteger la integridad de la instrucción en el aula, se espera que los oyentes asistan a todas las clases y se conduzcan de acuerdo con este manual del estudiante y los requisitos descritos en cada programa de estudios (syllabus) del curso. El incumplimiento de esto puede resultar en la expulsión del curso o de toda asistencia a RU.</p>`},
{n:"21", t:"Información Financiera", sec:"INFORMACIÓN FINANCIERA", h:`
<h3>MATRÍCULA, HONORARIOS Y CARGOS</h3>
<p>RU se esfuerza en mantener una educación accesible y costo-eficiente; por eso ofrecemos varias opciones de pago para asistir. La siguiente lista cubre costos de matrícula, cuotas, honorarios y otros cargos relacionados. La matrícula para el año escolar completo será facturada al comienzo de clase. Opciones de pago estarán disponibles.</p>
<h3>MATRÍCULA</h3>
<p>La matrícula total para todos los programas de RU</p>

<p>TARIFAS* Solicitud (debida para acceso a la solicitud y no reembolsable)</p>
