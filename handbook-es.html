{n:"50", t:"Información Estudiantil", sec:"INFORMACIÓN ESTUDIANTIL", h:`
<h3>PROCEDIMIENTOS DISCIPLINARIOS</h3>
<p>Se recomienda fuertemente que los estudiantes se familiaricen con este manual estudiantil, el cual contiene guías respecto al comportamiento, la vestimenta, y las expectativas de la conducta apropiada de cada estudiante. Si un estudiante desobedece voluntariamente, las normas y reglamentos de RU, unas de las siguientes acciones serán tomadas:</p>
<p>Aviso Disciplinario: El estudiante será puesto al tanto de la ofensa y será dirigido al manual estudiantil para reforzar su entendimiento y conocimiento sobre las normas, reglamentos y directrices. La fecha y naturaleza de la infracción será documentada. Acción adicional no será necesaria.</p>
<p>Probatoria Disciplinaria: El estudiante será aconsejado por un miembro del Comité de Consejería de la Facultad quien asegurará que el estudiante esté consciente de la ofensa y sus consecuencias de acuerdo a la continua inscripción del estudiante en esta universidad. El estudiante recibirá un aviso por escrito. Se le proveerá instrucción correctiva. El expediente estudiantil y de Populi contendrá una copia del aviso escrito y documentación de la ofensa.</p>
<p>Suspensión u Expulsión Disciplinaria: El estudiante deberá reunirse con Administración y un miembro del Comité de Consejería de la Facultad quien asegurará nuevamente que el estudiante esté consciente de la ofensa y sus consecuencias. Administración proveerá consejería e instrucción. El estudiante será suspendido o expulsado.</p>
<p>Si se impone una suspensión, su duración será de tres días. Al estudiante no se le permitirá recuperar ningún trabajo asignado, presentar ningún examen aplicado durante el período de suspensión, ni ser eximido de la asistencia a clases y laboratorios. Dado que las tareas del curso podrían no completarse mientras el estudiante está suspendido de clases, el estudiante podría estar en serio riesgo de reprobar el curso.</p>
<p>Si es expulsado, el estudiante no podrá ingresar al campus, se eliminará el inicio de sesión de usuario del estudiante para Populi y se recopilará toda la identificación que otorga acceso al campus de RMI. Las expulsiones consistirán en la revocación de todos los títulos obtenidos.</p>
<p>Dependiendo de la severidad de la ofensa, se buscará el consejo del presidente del Instituto.</p>
<h3>READMISIÓN LUEGO DE UN PERIODO DE SUSPENSIÓN</h3>
<p>Al caducar un periodo de suspensión, el estudiante tendrá que reunirse nuevamente con el RU Administración. Si el comportamiento ha sido corregido el estudiante tendrá permitido regresar a clases. Si el comportamiento no ha sido corregido, se le pedirá al estudiante se retire de la universidad.</p>`},
{n:"51", t:"Información Estudiantil", sec:"INFORMACIÓN ESTUDIANTIL", h:`
<h3>DESPIDO</h3>
<p>RU reserva el derecho de despedir a estudiantes de cualquier clase o programa de estudio en cualquier momento si su conducta o posición académica se considera insatisfactoria, indeseable, no conlleva a un ambiente educacionalmente productivo, o viola el Código de Conducta de esta institución. Se entiende en acuerdo que una vez firme la solicitud estudiantil, el colegio o alguno de sus miembros de facultad no serán responsables por cualquier despido o expulsión. Una expulsión consistirá en la revocación de todos los títulos obtenidos.</p>
<h3>POLÍTICA DE APELACIONES ESTUDIANTILES</h3>
<p>Si un estudiante no está de acuerdo con la decisión tomada por la Administración de RU respecto a la acción disciplinaria, el estudiante podrá hacer saber su preocupación u objeción por escrito hacia el presidente del Instituto. El presidente del colegio, quien en adición es el pastor principal, evaluará la información luego de revisarla y tomará una decisión final. El estudiante será notificado por escrito sobre el resultado de la apelación.</p>
<h3>SOLUCIÓN DE CONFLICTOS</h3>
<p>Todos los estudiantes están de acuerdo en que cualquier disputa que surja de este Manual se manejará en total cumplimiento con las instrucciones y principios descritos en Mateo 18 y otras escrituras consideradas relevantes por los Dres. Rodney y Adonica Howard-Browne como líderes de este ministerio. La única jurisdicción legal con respecto a este acuerdo se encontrará en la Palabra de Dios, ya que la Palabra de Dios será la autoridad suprema que gobierna todos los aspectos de este proceso de resolución de disputas. La ley de cualquier nación, estado, país, providencia, unión o cualquier otro órgano de gobierno será inválida e inaplicable en este proceso de resolución de disputas. Las decisiones de los doctores Rodney y Adonica Howard-Brown y el liderazgo de RU serán definitivas y vinculantes en todos los asuntos de resolución de disputas que surjan de los términos de este acuerdo.</p>
<h3>HOSPEDAJE ESTUDIANTIL</h3>
<p>RU son institutos locales y no ofrecen hospedaje en estos momentos. RU o The River at Tampa Bay Church no asumen responsabilidad por ninguna información proporcionada entre propietarios privados y estudiantes que alquilan o alquilan. RU y / o The River at Tampa Bay Church no son responsables de retener el dinero adeudado o resolver cualquier problema de vivienda que pueda surgir entre un inquilino y un propietario privado. Cualquier contrato de alquiler realizado entre cualquier propietario privado y estudiantes será únicamente entre el propietario y el inquilino. Bajo ninguna circunstancia se puede contactar a RU o The River at Tampa Bay Church para recopilar información en nombre del participante. TOMA EN CUENTA: No se permite la vivienda mixta.</p>
<h3>EXPEDIENTES ESTUDIANTILES</h3>
<p>Los expedientes de cada estudiante están localizados en la Oficina Administrativa. Nosotros tenemos acceso rápido a los expedientes, por medio de nuestra tecnología automatizada y toda la información que mantenemos manualmente. Para poder asegurar que el estudiante siempre se mantenga al tanto de todo, es imperativo que cualquier cambio de dirección, correo electrónico y número de teléfono sea notificado inmediatamente a la Oficina Administrativa. De ser necesario contactar a cada estudiante durante horas de trabajo es importante tener un número de trabajo o celular o cualquier medio de contacto para así poder comunicarnos sobre cualquier cambio a la programación. En acuerdo con la ley federal, archivos no se permiten publicar sin la aprobación escrita del estudiante.</p>`},
{n:"52", t:"Información Estudiantil", sec:"INFORMACIÓN ESTUDIANTIL", h:`
<h3>DATOS ESTUDIANTIL</h3>
<p>Es sumamente importante siempre tener la información corriente de cada estudiante. Los estudiantes tendrán que proveer dirección residencial y/o apartado postal (P.O. Box), número de teléfono de la casa y/o celular, correo electrónico, nombres de los que se hospedan en la misma vivienda (si alguno), y el nombre de la persona que les alquila la vivienda (si es una persona que asista a nuestra iglesia River en Tampa Bay). Favor de corregir la información personal en Populi si ha de cambiar.</p>
<p>TENGA EN CUENTA: RU no acepta ningún otro nombre que no sea el que figura en la identificación oficial. Solo se permite el uso de nombres legales en RU e impresos en diplomas.</p>
<h3>PRIVACIDAD ESTUDIANTIL</h3>
<p>Para poder asegurar la privacidad de cada estudiante, nuestra escuela no divulgará información de un/a estudiante a ninguna persona. Las calificaciones no se discutirán por teléfono. Ningún estudiante podrá ver el archivo o expediente de otro estudiante. Los estudiantes podrán ver su propio expediente en la presencia de un oficial como el Decano de RU, la Administradora, o algún oficial Administrativo. Los estudiantes no podrán ver sus páginas de referencia.</p>
<p>En acuerdo con la ley federal, archivos no se permiten publicar sin la aprobación escrita del estudiante.</p>
<p>En el caso que un instructor necesite comunicarse con algún estudiante referente a un curso, se le dará el número telefónico del estudiante.</p>
<p>Solo se permite una visita domiciliaria aprobada por el decano, realizada por dos líderes designados de RU, para tratar asuntos relacionados con la escuela.</p>
<h3>PRIVACIDAD DEL INSTRUCTOR</h3>
<p>Para garantizar la privacidad de los instructores de RU, la escuela no divulgará información personal sobre un instructor. Si un estudiante necesita ponerse en contacto con un instructor, siga el protocolo adecuado como se discutió durante la Orientación. Ningún estudiante debe llamar o enviar mensajes de texto a un instructor en su teléfono personal, enviar mensajes directos en las redes sociales, acercarse a su vehículo o visitar a un instructor en su casa con respecto a asuntos relacionados con la escuela.</p>
<h3>TRABAJO ASIGNADO DEL COLEGIO</h3>
<p>Asignaciones o trabajo asignado relacionado al colegio usualmente son devueltos en clase o permanecen en la Oficina Administrativa cuando son entregados por el instructor. Trabajos o asignaciones enviados a nuestra escuela por correo son dispersados por la Oficina Administrativa. Trabajo asignado no reclamado al final del año escolar será eliminado.</p>
<h3>EMPLEO ESTUDIANTIL</h3>
<p>En este momento RU no tiene posiciones de empleo a tiempo parcial o tiempo completo disponibles para estudiantes.</p>`},
{n:"53", t:"Reglamentos Del Salon/Campus", sec:"REGLAMENTOS DEL SALON/CAMPUS", h:`
<h3>ANUNCIOS</h3>
<p>Nadie podrá hacer anuncios en los salones a menos de ser la familia Howard-Browne, el Decano, el Instructor, oficiales de la Oficina Administrativa, u otra persona designada por ellos.</p>
<h3>EQUIPO DE AUDIO</h3>
<p>Los estudiantes no están permitidos tocar ningún instrumento o equipo de audio. Esto incluye micrófonos, cámaras, televisores conjuntos, la cabina/torre de sonido, etc. De haber problemas con el sonido, favor no intentar corregir el problema por sí mismo. Dentro del cuerpo estudiantil hay personal entrenado para manejar la situación. De no haber personal disponible, favor contactar al punto de contacto del salón o la oficina administrativa.</p>
<h3>TELÉFONOS CELULARES</h3>
<p>Una vez entren al salón los teléfonos deberán estar apagados. Los celulares sólo podrán ser utilizados para hacer anotaciones en clase. Solo en casos extremos se permitirá que un estudiante deje el teléfono con el timbre en alto. Solo Administración puede otorgar permiso para que su teléfono permanezca encendido.</p>
<h3>CUIDADO DE NIÑOS</h3>
<p>Para mantener la integridad del material que se enseña y para el respeto de nuestros instructores y estudiantes no se permite a menores de edad en el salón de clase. Adicionalmente, no se permite a los niños en la propiedad desatendidos mientras los padres están en clase. Si usted está educando a domicilio, es su responsabilidad encontrar su propio cuidado de niño.</p>
<h3>ANOTACIONES DE CLASE</h3>
<p>Cada estudiante es responsable de tomar sus propias anotaciones de clase. Los apuntes de clase no deben ser vendidos a otros estudiantes, pero pueden ser prestados a otros estudiantes para copiar con fines de estudio cuando falten a clases por enfermedad u otras ausencias justificadas. Los apunthhhhes prestados deben ser citados en las notas del estudiante, indicando el día en que fueron utilizados y de quién fueron tomados prestados. Violaciones a este reglamento y política resultará en el despido inmediato del estudiante. Los estudiantes asistiendo como pareja de matrimonio serán responsables de tomar sus propias anotaciones individualmente.</p>
<h3>DISPOSITIVOS DE COMPUTACIÓN</h3>
<p>(Dispositivos de Computación incluye: consolas de juegos de video, celulares digitales / ”Smartphone”, “iPod touch”, “netbooks”/computadoras pequeñas portátiles, tabletas, computadoras de mano y/o “laptops”/computadoras portátiles) Todo estudiante recibirá las Directrices de Computación de RU. Se requiere que todos firmen el Acuerdo de las Políticas de Computación. Las siguientes normas son en adición a las detalladas en las Directrices de Computación: No se permite conectar cables a los enchufes de los salones de clases. Todo dispositivo de computación necesitará funcionar con batería propia. Si este comportamiento es observado el dispositivo en cuestión será removido del edificio por un oficial administrativo y devuelto al estudiante al final del día. RU no es responsable por la seguridad de los dispositivos de computación traídos por los estudiantes. Puede traer sus pertenencias bajo su propio riesgo. No se permiten juegos de video durante horas de clase. No se permite el uso de aplicaciones/”Apps” o media social durante las horas de clase. Lo único permitido con los dispositivos de computación durante horas de clase es tomar anotaciones. No se permite el uso de grabación de audio o digital, ni grabaciones de radiodifusión para las sesiones de clase.</p>`},
{n:"54", t:"Reglamentos Del Salon/Campus", sec:"REGLAMENTOS DEL SALON/CAMPUS", h:`
<h3>DISTRACCIONES</h3>
<p>Reloj alarma, celulares, audífonos, “iPods”, maquinas de video portátil, tocadores de MP3, etc.</p>
<p>Los estudiantes deben abstenerse de usar cualquiera de estos artículos en las aulas, ya que resultan muy distractores. Estudiantes abstendrán de cualquier actividad que cause distracción como: mascar chicle, cortarse las uñas, dar con el lápiz en la mesa u otra superficie, poner los pies en las sillas, comentarios verbales continuos, haciendo daño a otros cuando sea “tocado” y otros hábitos o acciones que son molestos.</p>
<h3>BOLETINES DE ANUNCIO/POSTERS/FLYERS</h3>
<p>No se permite que estudiantes o el público repartan boletines de anuncio, cupones o recordatorios en los automóviles o los predios de esta institución ni hacia su facultad, empleados, estudiantes u oficiales de la misma. En caso de presenciar actividad tal como dicho o sospechosa, favor de notificar a la Oficina Administrativa inmediatamente.</p>
<h3>ARMAS DE FUEGO</h3>
<p>Las armas de fuego están estrictamente prohibidas en el campo escolar en todo momento. Esto incluye pistolas de juguete. Las violaciones servirán como base para un despido inmediato.</p>
<h3>COMIDAS Y BEBIDAS</h3>
<p>La comida en los salones está estrictamente prohibida. Toda comida debe ser consumida antes de entrar al salón. Solo se permitirá agua embotellada dentro del salón de clase.</p>
<h3>INSTRUMENTOS MUSICALES</h3>
<p>Los estudiantes no están permitidos tocar ningún instrumento en cualquier momento afuera de RSW o fuera del periodo de adoración en lo cual están programados. Cuando sea el periodo de adoración, solo estudiantes autorizados podrán tocar los instrumentos. Toda excepción debe ser asegurada con permiso del Departamento de Adoración o la Administración de la escuela. La iglesia River / RU no será responsable por daños o pérdidas a los instrumentos musicales o equipo traído a clase o servicios por los estudiantes.</p>
<h3>OFRENDAS</h3>
<p>No se permite colectar ofrendas o recaudación de fondos dentro de los predios de esta institución en ningún instante. Recolectas o recaudación de fondos solo tendrán excepción cuando sea para un regalo en grupo y de parte del cuerpo estudiantil para Navidades o Graduación. Las fechas para estas recaudaciones o recolectas serán seleccionadas y autorizadas por Administración.</p>
<h3>AUTORIZACIÓN DE VIDEOS/FOTOS</h3>
<p>Estudiantes inscritos en RU o escuelas afiliadas, autoriza a nuestra institución y nuestros afiliados el derecho de usar, reproducir, publicar y mostrar fotografías tomadas de estudiantes, predios, o algún evento relacionado sin compensación o permiso. Además, cualquier imagen digital se convertirá en propiedad de RU y sus afiliados.</p>`},
{n:"55", t:"Reglamentos Del Salon/Campus", sec:"REGLAMENTOS DEL SALON/CAMPUS", h:`
<h3>DISPOSITIVOS DE GRABACIÓN</h3>
<p>No se permiten grabadoras análogas o digitales en el salón en ningún momento. Esto también incluye cualquier dispositivo de grabación o transcripción con IA, tales como Pocket AI, Plaud Note AI, etc.</p>
<p>Bajo ninguna circunstancia se permitirán gafas inteligentes (Meta Glasses, Google Glasses, etc.) ni ningún dispositivo similar en la propiedad de The River at Tampa Bay Church. La posesión de los mismos resultará en inmediata acción disciplinaria y confiscación del dispositivo.</p>
<h3>BAÑOS</h3>
<p>Los baños están designados para uso exclusivo de hombres o mujeres, como se define en la Sección 553.865 (3), F.S.</p>
<h3>MEDIOS SOCIALES</h3>
<p>Cualquier estudiante que se encuentra publicando información en cualesquiera medios sociales en una manera que es un descrédito para El Reino de Dios y/o los Institutos de El Río se le pedirá remover el puesto, y/o ser disciplinado, incluso hasta el punto de suspensión o expulsión de la escuela.</p>
<p>Ninguna fotografía o video tomado en la propiedad de The River at Tampa Bay Church podrá ser publicado en internet a través de redes sociales (es decir, Facebook, Instagram, YouTube, Snapchat, TikTok, etc.).</p>
<h3>INVITADOS ESPECIALES</h3>
<p>Los estudiantes no deben acercarse, involucrarse, intercambiar información de contacto o intentar establecer contactos con los invitados especiales aquí en RU, The River at Tampa Bay Church or Revival Ministries International.</p>
<h3>CORRESPONDENCIA ESTUDIANTIL</h3>
<p>Favor de no utilizar la dirección de RU o la iglesia River en Tampa Bay, o “Revival Ministries International” como su dirección personal. La correspondencia recibida de esta manera será devuelta y el estudiante no será notificado.</p>
<h3>LLAMADAS TELEFÓNICAS</h3>
<p>Llamadas para estudiantes no serán aceptadas a menos de ser una emergencia. Por favor no pedirles a familiares o amistades llamen a la escuela para contactarlos.</p>
<h3>MENSAJES DE TEXTO</h3>
<p>Se prohíbe compartir información electrónica en horas de clase por medio de mensajes de texto, IM/mensaje instantáneo, e-mail/correo electrónico, “Bluetooth” u otros medios.</p>
<p>Todo mensaje de texto y comunicación a través de aplicaciones entre personas de sexo opuesto debe realizarse en un chat ministerial aprobado, con la supervisión de un líder autorizado de RU o de The River at Tampa Bay Church. En ningún momento se debe guardar información de contacto de una persona del sexo opuesto en dispositivos personales, ni compartirla con otros.</p>`},
{n:"56", t:"Información Estudiantil", sec:"INFORMACIÓN ESTUDIANTIL", h:`

<p>al amor que me tengo a mi mismo.</p>
<ul><li>No mentiré, no robaré, no usaré profanidad, y tampoco participaré en chismes o historias no</li></ul>
<p>ciertas.</p>
<ul><li>No cometeré fraude o plagio. Cumpliré con todos mis requisitos académicos por méritos propios</li></ul>
<p>y no completaré trabajo asignado colaborando inapropiadamente con otros estudiantes.</p>
<ul><li>Me comprometo a abstenerme de toda actividad inmoral e ilegal tanto dentro como fuera del</li></ul>
<p>campo escolar.</p>

<p>gobernación del instituto. Acepto mi asistencia al instituto como un privilegio y, por tanto, entiendo que RU pueda ejercer su derecho en retirar a un estudiante, del curso o programa, en cualquier momento por razones disciplinarias.</p>

{n:"57", t:"Bienvenida De Los Fundadores Y Presidentes Del Instituto Bíblico River", sec:"BIENVENIDA DE LOS FUNDADORES Y PRESIDENTES DEL INSTITUTO BÍBLICO RIVER", h:`
<p>Desde hace muchos años he tenido el sueño de proporcionar un lugar donde hombres y mujeres de todas las edades, orígenes y partes del mundo, puedan reunirse para estudiar y experimentar la gloria de Dios. Como descubrirá, RU no es una escuela bíblica tradicional, son un centro de entrenamiento del Espíritu Santo, el cual nació específicamente para aquellos que desean conocer a Cristo fuertemente y darle a conocer. En RU usted será saturado en la palabra de Dios y Su Espíritu. Es el lugar donde será apoderado, para alcanzar su llamado y encender el mundo en el Fuego de Avivamiento. ¡No espere más! Dios quiere levantarle para Sus grandes obras, así que esperamos verle crecer, cambiar y luego caminar hacia el mundo con poder y victoria.</p>
<p>Para servirle en el gran avivamiento y la cosecha, Dr. Rodney Howard-Browne Th.D., D.Min., D.D. Presidente</p>
<p>Dr. Adonica Howard-Browne D.Min., M.A., B.A. Vicepresidente</p>
<h3>OBSERVACIONES DEL DECANO DE INSTITUTO BÍBLICO RIVER:</h3>
<p>Verdaderamente Dios está levantando una Nueva Generación de Avivadores en esta tierra y en este siglo 21; una generación que se opone a la religión, pero ama la relación. Jesús no dio Su vida por la religión; Él dio Su vida por Relación. Mi amigo, así como usted decide venir a la RU, quiero que se pregunte lo siguiente a ti mismo: ¿Estoy cansado de la religión? ¿Estoy cansado de la Iglesia en “estatus quo”? ¿Quiero ser parte de la historia, o quiero ser parte de Hacer Historia? ¿Quiero leer sobre quienes hicieron historia, o quiero ser el protagonista que hizo la historia? Los Doctores Rodney y Adonica Howard-Browne fueron llamados por Dios para venir a América en el 1987 para ver América avivada con el fuego de avivamiento. ¡Hemos visto nociones de este avivamiento, pero lo mejor está por venir! ¡Lo asombroso de todo esto, es que ellos no pueden lograrlo solos, ellos LO NECESITAN A USTED! ¿Quieres ver un Gran Avivamiento en esta tierra? ¡La Fe sin obras está muerta! ¡Venga a RU y sea entrenado para convertirse en uno de los avivadores del siglo 21 de esta Nueva Generación, dispuesto a dar EL TODO porque Él dio Su TODO; JESÚS! La mayoría de los predicadores del mundo salen de esta gran tierra llamada América, sin embargo, América ansia por la manifestación en dónde los hijos/hijas de Dios sean levantados y tomen su lugar. Futuro estudiante, verdaderamente, creas que, si haces la decisión de asistir a RU este otoño, podemos ayudarle en facilitar el llamado que hay sobre su vida. Nosotros estamos dedicados a ver como usted hace Historia.</p>
<p>Dios te Bendiga,</p>
<p>Doctor Mark Cabrera Decano del Instituto Bíblico River</p>`},
{n:"58", t:"Descripciones De Clases", sec:"DESCRIPCIONES DE CLASES", h:`
<h3>INSTITUTO BÍBLICO RIVER - FUNDACIONAL AÑO</h3>
<p><b>La Unción</b> &ndash; Dr. Rodney Howard-Browne revela algunas verdades claves aprendidas sobre 30 años de ministerio sobre la unción. El estudiante aprenderá como la unción es presente a sanar, liberar, y encenderse cualquiera que esté hambriento y bastante desesperado para ser usado por Dios.</p>
<p><b>Autoridad del Creyente</b> &ndash; Como creyentes tenemos autoridad de la cual algunos no están al tanto. Podemos estar caminando en ella y ni darnos cuenta. Este curso es para ayudarnos a abrir la Palabra de Dios en el tema de la “Autoridad” para que como creyentes vivamos en la autoridad otorgada por Dios y ver el plan perfecto de Dios tomar lugar en nuestras vidas diariamente.</p>
<p><b>Fundamentos Cristianos I</b> &ndash; Este curso ayudará tanto a los nuevos creyentes como a los cristianos maduros a comprender el derecho legal de quiénes son y qué son en Cristo. Los estudiantes repasarán las bases de la Biblia y edificarán sobre su conocimiento de la Palabra a la luz de la redención, para aumentar su fe y desafiar a cada estudiante a caminar más profundamente con Cristo nuestro Redentor.</p>
<p><b>Fundamentos Cristianos II</b> &ndash; Este curso ayudará al estudiante a desarrollar un fuerte discernimiento espiritual y bíblico sobre cómo luce un verdadero estilo de vida cristiano. El énfasis estará en la pureza y la santidad en la vida, el ministerio y la conducta como creyente. Estudiaremos cómo los Dones del Espíritu y el Fruto del Espíritu anulan las obras de la carne.</p>
<p><b>Estilo de Vida Cristiana</b> &ndash; ¿Cuáles son las evidencias externas e internas de un estilo de vida Cristiana? Cuando verdaderamente ponemos en práctica un estilo de vida Cristiana, la evidencia interna se convierte obvia. La gloria y el poder de Dios se derraman sobre todos los que nos rodean. Personas que viven un estilo de vida Cristiana viven una vida pura y segura, en lo interior y en lo exterior. En las epístolas, podemos encontrar lo que se espera de nosotros interna y externamente. Escritura Académica - Este curso involucra el estudio práctico de las reglas de gramática y ortografía, con el propósito de fortalecer y enriquecer las habilidades de la comunicación escrita de cada estudiante. A lo largo del trimestre, los estudiantes desarrollarán competencias para expresarse con corrección, claridad y eficacia en su vida académica, ministerial y profesional.</p>
<p><b>Fe I</b> &ndash; Un entendimiento de los diferentes tipos de fe requeridos para habilitar al estudiante para ministrar de tal manera que impacte sus vidas y las vidas de los demás.</p>
<p><b>Dones del Espíritu</b> &ndash; Este es un estudio de los Dones del Espíritu de acuerdo 1 Corintios 12. El estudiante aprenderá de dónde provienen los dones, para quien son los dones, y cuál es el propósito de los dones, de acuerdo a la Biblia. Carácter Piadoso - Este curso motiva y desafía a cada estudiante a examinar el fruto en sus vidas a través de verdades dinámicas presentadas y enseñadas. Estas verdades incluyen ética para ministros: integridad, confiabilidad, pureza, responsabilidad y justicia. Cuando un individuo reconoce a Cristo como Señor y Salvador, Su carácter y habilidad obrará en y a través de ellos. Como resultado, el carácter piadoso será establecido, evidente y puesto como el estándar en sus vidas.</p>
<p><b>Visión del Cielo</b> &ndash; Los estudiantes aprenderán que la visión que Dios ha colocado en su interior no proviene de los hombres, sino por la revelación de Jesucristo. Es la visión celestial la que los sostendrá a través de los días que están por venir sobre la tierra y es su ancla hacia lo invisible.</p>
<p><b>Ayudas y la Iglesia Local</b> &ndash; Este curso le dará al estudiante un entendimiento bíblico del ministerio de ayudas en relación a la iglesia local la cual trabaja en conjunto con el ministerio global.</p>
<p><b>El Espíritu Santo</b> &ndash; Un curso sobre la persona y el trabajo del Espíritu Santo. Se hace énfasis en las verdades fundamentales que cambiarán radicalmente la manera de pensar del estudiante. Los estudiantes descubrirán lo que es conocer la persona del Espíritu Santo en gran forma – para conocerlo realmente como un mejor amigo.</p>`},
{n:"59", t:"Descripciones De Clases", sec:"DESCRIPCIONES DE CLASES", h:`
<p>Introducción al Gobierno - Este curso educará a los estudiantes sobre el origen de la Libertad, el propósito del gobierno, la naturaleza de las Constituciones, los diferentes tipos de gobiernos y la estructura de la República Constitucional de los Estados Unidos de América. El curso también explorará el diseño bíblico para la gobernanza y el papel de la iglesia en influenciar la sociedad para la gloria de Dios y el cumplimiento de la Gran Comisión.</p>
<p><b>Introducción al Estudios del Avivamiento</b> &ndash; En la serie de videos del Avivamiento en La Universidad de Oral Roberts y del Ardiendo, Dr. Rodney Howard-Browne explica que el avivamiento real no es solo un toque, sino un cambio. Cada estudiante necesita un toque de la mano del Maestro para impactar y marcar su vida entera y sea revivido y cambiado por el Espíritu Santo. Van a saberlo y el mundo podrá oírlo en sus palabras y verlo en sus acciones y actitudes.</p>
<p><b>Asuntos del Corazón</b> &ndash; En este curso, la Dra. Adonica Howard-Browne realizará un estudio sobre el corazón del creyente y su importancia en el caminar cristiano. El curso mostrará cómo desarrollar el corazón de uno y qué significa guardar el corazón con toda diligencia.</p>
<p><b>Panorama del Nuevo Testamento</b> &ndash; El estudiante obtendrá un conocimiento general del tema y contenido de cada uno de los libros del Nuevo Testamento. También ganará entendimiento del significado de los eventos históricos y mensajes del Nuevo Testamento.</p>
<p><b>Panorama del Antiguo Testamento</b> &ndash; El estudiante obtendrá un conocimiento general del tema y contenido de cada uno de los libros del Antiguo Testamento. También ganará entendimiento del significado de los eventos históricos y mensajes del Antiguo Testamento. Desarrollo Personal - Este curso prepara a los estudiantes para enfrentar las complejidades de la vida diaria en lo natural, de modo que esto no obstaculice lo sobrenatural, mientras cada estudiante persigue el llamado de Dios en su vida, enseñando conocimientos prácticos y estrategias que incluyen habilidades para la vida, manejo del tiempo, educación financiera, técnicas de estudio, entre otras.</p>
<p><b>Oración I</b> &ndash; Este curso es un estudio sobre lo que la oración es y cómo recibir oraciones contestadas; el propósito, la necesidad, las posibilidades, el poder, las armas y los esenciales de la oración.</p>
<p><b>Viendo a Jesús como Realmente Es (Los Evangelios)</b> &ndash; Este curso ofrece una mirada íntima e inspiradora a la vida de Jesús. Usando el texto Jesús, este curso explorará los Evangelios como se revelan a Jesús.</p>
<p><b>Ganando Almas I</b> &ndash; Este es un curso sobre cómo presentarle a Cristo a otras personas en el área de trabajo, campos extranjeros, y comunidades locales. Cada estudiante tendrá la experiencia y el gozo de llevar a otros hacia Cristo y luego dar el seguimiento de hacerlos discípulos.</p>
<p><b>Mayordomía I</b> &ndash; Este curso familiariza al estudiante con varias escrituras referente a las finanzas y mayordomía. Se provee una base/fundamento para la vida personal al igual que equipar con las verdades necesarias para predicar sobre la mayordomía y el ofrendar en el ministerio.</p>
<p><b>Sumisión y Autoridad</b> &ndash; El estudiante realizará la importancia de la sumisión y la autoridad en su diario camino de fe. También aprenderá a cómo prepararse en la sumisión a la autoridad mientras aprende a cómo caminar en la autoridad otorgada por Dios. Está Presente Gloria - Este curso abordar la situación actual dentro del cuerpo de Cristo sobre el tema de guerra espiritual con el enfoque central en la “Luz” lo cual es el Señor, en lugar que las “tinieblas” que hay en el mundo. Las armas espirituales disponible a los Cristianos será discutidos en detalle. Usando la Palabra de Dios, una comparación será hecha entre creencias actuales sobre la guerra espiritual a revelar lo que es realidad o ficción. Que es guerra espiritual y como la batalla se pelea.</p>
<p><b>Adoración: Un Estilo de Vida</b> &ndash; Este curso le dará al estudiante un entendimiento completo sobre el fundamento, propósito, y práctica de la alabanza y adoración en la vida del creyente. Se hará énfasis en la adoración como un estilo de vida para el creyente, descubriendo como la existencia total del hombre está ligada con el vivir y depender de la presencia de Dios.</p>`},
{n:"60", t:"Descripciones De Clases", sec:"DESCRIPCIONES DE CLASES", h:`
<h3>INSTITUTO BÍBLICO RIVER - SEGUNDO AÑO</h3>
<p><b>Apologética</b> &ndash; Este curso enseñará los fundamentos bíblicos, teológicos e históricos de la apologética cristiana, con énfasis en la defensa de la doctrina del Espíritu Santo. Demostrará razones para tener confianza en la verdad de las Escrituras, así como identificará y examinará críticamente las objeciones y desafíos frecuentemente encontrados, tanto históricos como contemporáneos, que se han presentado en contra del Espíritu Santo. Los estudiantes también reconocerán y evaluarán diversas metodologías apologéticas, e integrarán argumentos bíblicos, teológicos, filosóficos, históricos y científicos a favor de la verdad de la fe cristiana.</p>
<p><b>Doctrinas Bíblicas</b> &ndash; En este curso tomaremos tiempo para estudiar los temas de lo que creemos y entender porque lo creemos. También comenzaremos a construir una base sólida en las verdades bíblicas en las cuales basamos nuestra doctrina. De igual forma hacemos exposición de las doctrinas falsas respecto a lo que creemos.</p>
<p><b>El Pacto de Sangre</b> &ndash; Este curso es un estudio Bíblico sobre los pactos, su creación y duración, con un énfasis particular en el Pacto de Sangre y sus implicaciones para el creyente. Este curso examinará el antiguo pacto y el nuevo pacto, sus similitudes y su aplicación hoy día.</p>
<p><b>El Libro de Los Hechos</b> &ndash; Este curso le dará una comprensión del Libro de Hechos con énfasis en La Obra del Espíritu Santo a través del libro.</p>
<p><b>Cristo el Sanador</b> &ndash; Este curso ayudará a establecer, desde las escrituras, que es la voluntad de Dios sanar a toda persona en este día. También corregirá el pensamiento erróneo sobre ciertos pasajes bíblicos los cuales son malinterpretados por quienes están en contra de la sanidad divina. Diablos y Demonios - Esta clase presenta un entendimiento completo sobre los diferentes tipos de ángeles y su funcionamiento al igual que el modo de operar de Satanás y sus demonios.</p>
<p><b>Escatología</b> &ndash; La escatología es la rama de la teología que trata con la consumación final de todas las cosas. Cubriremos temas como el rapto, la tribulación, el juicio y la vida por venir.</p>
<p><b>Fe II</b> &ndash; Un entendimiento de los diferentes tipos de Fe requeridos para habilitar al estudiante a ministrar en una forma que impacte sus vidas y las de los demás.</p>
<p><b>Liderazgo</b> &ndash; Este curso desarrollará una base bíblica para el liderazgo. Los estudiantes descubrirán principios que les ayudarán a desarrollar cualidades de liderazgo en sus vidas.</p>
<p><b>El Camino de Amor</b> &ndash; En este curso el estudiante será alentado, exhortado y provocado a presionar hacia Dios, tomar una decisión y hacer el compromiso de conocer al Padre realmente. El estudiante aprenderá que, al caminar en el amor de Dios, uno puede caminar en Victoria en cada área de la vida.</p>
<p><b>Comerciando y Traficando la Unción</b> &ndash; Este curso enseña al ministro aspirante cómo honrar y respetar la Unción y las consecuencias de comprometerse al servir a Dios. También capacitará y equipará a cada estudiante para confrontar la tentación de abusar de la Unción, asegurando que caminen en libertad y justicia por el poder de la Palabra y del Espíritu Santo.</p>
<p><b>La Familia del Ministro</b> &ndash; El propósito de este curso es dar al alumno que es llamado al ministerio una comprensión profunda de los aspectos prácticos y las demandas del ministerio que se le imponen a la familia y como tratarlos con éxito, y cómo equilibrar la familia y el ministerio correctamente.</p>
<p><b>Los Dones del Ministerio</b> &ndash; Este curso abarcará los Dones Ministeriales y el Llamado Divino. Los estudiantes desarrollarán una comprensión de que, como ministros del Evangelio, se nos ha confiado la fuerza y el poder de Dios.</p>`},
{n:"61", t:"Descripciones De Clases", sec:"DESCRIPCIONES DE CLASES", h:`
<p><b>Misiones</b> &ndash; Este curso presenta las dimensiones bíblicas, históricas, culturales y estratégicas de los planes y propósitos globales de Dios. Aborda el fundamento y la necesidad de las misiones mundiales verdaderas y bíblicas, así como la importancia de que cada creyente encuentre y cumpla la misión específica que Dios tiene para su vida. Exploraremos el llamado y el costo de las misiones siguiendo los viajes misioneros del apóstol Pablo y de uno de los más grandes misioneros del siglo XIX, el Dr. David Livingstone. Este curso enseñará al estudiante conocimientos prácticos sobre cómo lanzarse al trabajo misionero de tiempo completo o parcial. También exploraremos el llamado y el costo de las misiones, siguiendo la historia de vida de David Livingstone, uno de los más grandes misioneros de nuestro tiempo.</p>
<p><b>Oración II</b> &ndash; Este curso es un estudio sobre lo que es la oración y cómo recibir oraciones contestadas; el propósito la necesidad, las posibilidades, el poder, las armas y los esenciales de la oración.</p>
<p><b>Avivamiento NMNL &amp; Ingredientes del Avivamiento</b> &ndash; Dr. Rodney Howard-Browne explica que el avivamiento real no es solo un toque, sino un cambio – es volver a su primer amor, Jesús. Cada estudiante necesita un toque de la Mano del Maestro – un toque que impactará y marcará su vida entera. Cuando el estudiante está tocado, avivado y cambiado por el Espíritu Santo, él no solo va a saberlo, sino que el mundo lo oirá en sus palabras, y lo verá en sus acciones y su actitud. Garantizado que cuando hayas terminado este curso nunca será el mismo. Estremeciendo las Naciones - En este curso aprenderás lo que se necesita para sacudir naciones para el Reino de Dios y qué es lo que verdaderamente produce una transformación genuina en las naciones. Este curso se enfoca en cómo confrontar la religión, las finanzas para sacudir una nación, mantener el mensaje puro, cómo los milagros atraen a los no salvos al Reino, y mucho más.</p>
<p><b>Señales y Maravillas</b> &ndash; Estudiantes aprenderán que las señales y maravillas deben ser una ocurrencia diaria en la vida del creyente. También recibirán un entendimiento que las señales, maravillas y milagros no son solamente para la iglesia, sino para la demostración del poder de Dios fuera de las cuatro paredes de la iglesia.</p>
<p><b>Ganando Almas II</b> &ndash; Este es un curso sobre cómo presentarle a Cristo a otras personas en el área de trabajo, campos extranjeros, y comunidades locales. Cada estudiante tendrá la experiencia y el gozo de llevar a otros hacia Cristo y luego dar el seguimiento de hacerlos discípulos.</p>
<p><b>Mayordomía II</b> &ndash; Este curso familiariza al estudiante con varias escrituras referente a las finanzas y mayordomía. Se provee una base/fundamento para la vida personal al igual que equipar con las verdades necesarias para predicar sobre la mayordomía y el ofrendar en el ministerio.</p>
<p><b>Doce Pilares de la Fe</b> &ndash; Este curso expondrá sobre la verdad fundamental en La Palabra de Dios en estos doce pilares: 1) Mi Corazón, 2) Mi Misión, 3) Mi Adoración, 4) Mi Familia, 5) Mi Tesoro, 6) Mi Padre, 7) Mi Consolador, 8) Mi Guía, 9) Mis Absolutos, 10) Mi Vida de Oración, 11) Mis Coronas, 12) Mi Jesús.</p>
<p><b>Mujeres en el Ministerio</b> &ndash; En este curso, los estudiantes aprenderán los roles de liderazgo que tuvieron las mujeres en el Nuevo Testamento y demostrarán ejemplos históricos en relación con el Ministerio Quíntuple. El peso de la teología del Nuevo Testamento y los principios básicos del Evangelio sustentarán el argumento a favor de que las mujeres funcionen junto a los hombres, trabajando como compañeros en el cuerpo de Cristo.</p>
<p><b>Visión</b> &ndash; En este curso, los estudiantes recibirán una enseñanza clara de la Palabra que define qué es la visión, cómo la visión es única para cada individuo, los obstáculos que la obstaculizan, la paciencia para ver el cumplimiento de la visión y cómo mantenerse enfocado en ella.</p>`},
{n:"62", t:"Descripciones De Clases", sec:"DESCRIPCIONES DE CLASES", h:`
<h3>INSTITUTO BÍBLICO RIVER - TERCER AÑO</h3>
<p><b>Aceleración / Sin Límites y Sin Fronteras</b> &ndash; En este curso el estudiante aprenderá las claves de la aceleración y cómo ser incrementado, multiplicado y engrandecido por el Espíritu de Dios. Aprenderán acerca del llamado de Dios en su vida, cómo deshacerse de las distracciones, cómo enfocarse y cómo acceder a la ayuda sobrenatural para hacer aquello para lo cual Dios los ha llamado. El estudiante comprenderá cómo mover obstáculos y montañas mediante el avivamiento del cielo para acelerar los propios planes del Reino. El Llamado de Dios - En este curso los estudiantes aprenderán el valor del llamado de Dios, cómo se conecta con el oficio del Ministerio Quíntuple, y la importancia de que el Ministerio Quíntuple esté activo en la iglesia local.</p>
<p><b>La Historia de la Iglesia</b> &ndash; Este curso hará un recorrido por la historia del cristianismo desde el comienzo de la iglesia. Se dará énfasis a los movimientos carismáticos/pentecostales que han surgido desde el libro de Hechos, y que han continuado a lo largo de la historia hasta el día de hoy. Este curso también proporcionará una comprensión del movimiento continuo del Espíritu en la vida de la iglesia, culminando en el actual mover de avivamiento en el mundo de hoy.</p>
<p><b>El Diluvio Venidero</b> &ndash; Este curso edificará tu fe para creer y esperar el diluvio de la gloria de Dios. Los Dres. Rodney y Adonica Howard-Browne comparten desde su experiencia y enseñan desde la Palabra de Dios cómo la gloria de Dios viene como una ola gigante para cubrir la tierra. Este es un diluvio de milagros sobrenaturales, señales y prodigios, como nunca se ha visto desde los días de los apóstoles. Cómo Oír la Voz de Dios– En este curso el Dr. Rodney aborda conceptos erróneos comunes que hacen que muchos cristianos pierdan los caminos y planes de Dios, mientras guía a los estudiantes a través del proceso de sintonizarse con Su voz, reconocer Su dirección y discernir la voz de un extraño. Los estudiantes serán equipados para cultivar una relación íntima con Dios, escuchar Su voz desde su espíritu y seguir con confianza Su plan para sus vidas.</p>
<p><b>Hermenéutica</b> &ndash; Este curso preparará a los estudiantes para interpretar la Biblia desde la experiencia del Espíritu Santo que empoderó a la iglesia el día de Pentecostés, moldeando dinámicamente su lectura de las Escrituras mediante un enfoque epistemológico fundamental.</p>
<p><b>Homilética I &amp; II</b> &ndash; El propósito de este curso es familiarizar a los estudiantes con el arte y la ciencia de la predicación conocida como homilética. Este curso está diseñado para ayudar a los estudiantes a organizarse a sí mismos, sus materiales y sus habilidades dadas por Dios para ministrar el Evangelio de manera efectiva.</p>
<p><b>El Ministerio del Evangelista</b> &ndash; Este curso brindará a los estudiantes una comprensión completa de cómo el evangelista se entrelaza con la iglesia tal como la conocemos. Aportará una perspectiva práctica sobre el evangelista itinerante y cómo funcionan las cosas en el camino, así como mostrará algunas de las trampas y cómo se pueden superar.</p>
<p><b>Operaciones Ministeriales</b> &ndash; En este curso los estudiantes obtendrán experiencia práctica en cada departamento de Revival Ministries International y explorarán las operaciones diarias utilizando los manuales de cada departamento y capacitación práctica de parte de cada pastor o gerente de departamento. Los estudiantes serán capacitados y saldrán de este curso con todos los recursos necesarios para construir y administrar cada departamento en su propio ministerio cuando lo lancen.</p>`},
{n:"63", t:"Descripciones De Clases", sec:"DESCRIPCIONES DE CLASES", h:`
<p><b>Cuidado Pastoral y Consejería</b> &ndash; Este curso está diseñado para brindar a los estudiantes una visión práctica y espiritual del ministerio pastoral. Esta clase equipará a los estudiantes con sabiduría bíblica sólida sobre cómo ser guiados por el Espíritu al manejar asuntos pastorales, así como para ayudar al estudiante a considerar los temas especiales asociados con la teoría, la práctica y la administración de la consejería en contextos pastorales.</p>
<p><b>Preparación para el Ministerio</b> &ndash; Este curso está diseñado para ayudar al estudiante con los aspectos prácticos y de negocios por medio de presentaciones y experiencia práctica. También ayuda a equipar a los estudiantes con herramientas necesarias para comenzar un ministerio.</p>
<p><b>Ministerio de Jóvenes y Niños</b> &ndash; Cada estudiante aprenderá cómo construir y operar un ministerio de niños y jóvenes exitoso dentro de la estructura de la iglesia local. Ya sea que funjan como pastor principal, pastor de niños, pastor de jóvenes o líder en una iglesia en plantación o una iglesia ya establecida, en calidad de tiempo completo o voluntario a tiempo parcial, el estudiante aprenderá los principios para construir un ministerio de niños y jóvenes sólido que apoye y fortalezca la visión de la casa.</p>`},
{n:"64", t:"Descripciones De Cursos", sec:"DESCRIPCIONES DE CLASES", h:`
<h3>DESCRIPCIONES DE CURSOS</h3>
<p><b>INSTITUTO BÍBLICO RIVER</b> &ndash; Maestría en Artes en Ministerio Práctico</p>
<p><b>Demonología y Liberación</b> &ndash; Este curso fue desarrollado para enseñar a los estudiantes acerca del poder antinatural y el dominio satánico sobre los seres inteligentes, y la provisión de Dios para su liberación. Enseñará cómo usar el poder y la autoridad de Dios sobre todo principado y potestad.</p>
<p><b>Creciendo en Carácter Piadoso</b> &ndash; En este curso, los estudiantes aprenderán de líderes ministeriales de larga trayectoria sobre la importancia y el poder de desarrollar un carácter piadoso. Este curso extraerá enseñanzas de ministros como Kenneth Copeland, Jerry Savelle, Kenneth Hagin y Lester Sumrall, entre otros. Los estudiantes profundizarán en los principios del desarrollo del carácter desde el interior, de modo que no solo demuestren el carácter de Jesús en sus comunidades y ministerios, sino que también exhiban la fidelidad e integridad duraderas necesarias para aumentar en influencia y unción para alcanzar naciones.</p>
<p><b>Conociendo al Espíritu Santo</b> &ndash; En este curso, los estudiantes aprenderán de reconocidos líderes ministeriales que caminaron en una relación profunda y personal con el Espíritu Santo. Este curso extraerá enseñanzas de ministros ungidos como Jerry Savelle, Reinhard Bonnke, Kenneth Copeland, Lester Sumrall y Kathryn Kuhlman, entre otros—líderes que conocieron al Espíritu Santo íntimamente y ministraron a través de Su poder. Los estudiantes explorarán la persona del Espíritu Santo, Su presencia, y cómo cultivar una vida guiada por Él. A través de enseñanza bíblica y testimonios poderosos, los estudiantes obtendrán una comprensión más profunda de cómo tener comunión con el Espíritu Santo, escuchar Su voz y caminar en Su unción para transformar vidas y naciones para el Reino de Dios.</p>
<p><b>Liderazgo en el Ministerio</b> &ndash; En este curso, los estudiantes aprenderán de diversos hombres y mujeres de Dios firmes en la fe sobre el Liderazgo en el Ministerio. Cubre varios sermones de reconocidos hombres y mujeres en el ministerio cuyo liderazgo impactó el Reino de Dios, incluyendo a Kenneth E. Hagin, Kenneth Copeland y Mac Hammond, por nombrar solo algunos. Los estudiantes aprenderán principios de liderazgo piadoso para poder guiar y liderar con excelencia en su ministerio.</p>
<p><b>Ministrando Sanidad</b> &ndash; En este curso, los estudiantes aprenderán de reconocidos líderes ministeriales sobre los fundamentos bíblicos y las aplicaciones prácticas de ministrar sanidad. Este curso extraerá enseñanzas de ministros como Reinhard Bonnke, Kenneth Copeland, T.L. Osborne y Oral Roberts, entre otros. Los estudiantes explorarán los principios espirituales y la autoridad divina detrás de la sanidad, equipándolos para operar en fe y valentía a través del amor y la compasión de Jesús. A través de enseñanza bíblica y testimonios del mundo real, los estudiantes obtendrán una comprensión más profunda del corazón de Dios por la sanidad, la unción del Espíritu Santo, y cómo ministrar eficazmente a quienes están creyendo por sanidad.</p>
<p><b>Fe Ahora</b> &ndash; En este curso, los estudiantes aprenderán de diversos hombres y mujeres de fe. Cubre varios sermones de reconocidos hombres y mujeres de Dios en el ministerio cuya fe impactó el Reino de Dios, incluyendo a Kenneth E. Hagin, Kenneth Copeland y John Osteen, por nombrar solo algunos. Los estudiantes aprenderán a estudiar y aplicar los principios de la "Fe Ahora" para que sus vidas nunca vuelvan a ser las mismas y sean una tremenda inspiración para sus vidas en el ministerio.</p>
<p><b>Ministerio Práctico I, II, III, IV</b> &ndash; Los estudiantes participarán en experiencia ministerial práctica, así como en discusiones relacionadas con temas ministeriales actuales. Se requerirá que el estudiante participe en la iglesia local, The River at Tampa Bay Church, en un departamento ministerial durante todo el semestre. Además, el estudiante completará un proyecto de departamento ministerial para contribuir al desarrollo de las funciones diarias del ministerio práctico. Como parte de su experiencia</p>`},
{n:"65", t:"Descripciones De Clases", sec:"DESCRIPCIONES DE CLASES", h:`
<p>práctica, también desarrollarán una serie de devocionales semanales que podrán utilizar cuando se lancen al ministerio de tiempo completo. (Los estudiantes en línea que estén empleados en RMI entregarán sus horas trabajadas para obtener horas crédito, en lugar de ser asignados a un departamento en The River at Tampa Bay Church.)</p>
<p><b>Poder de Oración</b> &ndash; En este curso, los estudiantes aprenderán de diversos hombres y mujeres de Dios firmes en la fe sobre el "Poder de Oración". Cubre sermones de reconocidos hombres y mujeres en el ministerio cuya oración impactó el Reino de Dios, incluyendo a Kenneth E. Hagin, Kenneth Copeland y John Osteen, por nombrar solo algunos. Los estudiantes aprenderán y comprenderán cómo "la oración eficaz del justo puede mucho [tiene gran poder y produce maravillosos resultados]" (Santiago 5:16, AMP) y aplicarán los principios del "Poder de Oración" para que sus vidas nunca vuelvan a ser las mismas.</p>
<p><b>La Favor de Dios</b> &ndash; Este curso fue desarrollado para profundizar en el favor de Dios y lanzará a los estudiantes en un viaje espiritual garantizado para cambiar sus vidas. Este curso revelará cómo el Señor quiere darnos éxito porque esto lo hace atractivo ante otros cuando lo reconocemos como la fuente. Los estudiantes se involucrarán en una búsqueda constante de Dios, se acercarán continuamente a Él con las motivaciones correctas, y mantendrán siempre una actitud correcta para alcanzar todos los beneficios del favor de Dios.</p>`},

var PAGES = PAGES_ES;

(function(){
  "use strict";
  try{ if(window.self !== window.top) document.body.classList.add("embedded"); }
  catch(e){ document.body.classList.add("embedded"); }
  var N = PAGES.length;
  var reduced = false;
  try{ reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

  /* printed page number -> index (idx = printed + 1) */
  function printedToIdx(p){ p = parseInt(p,10); if(isNaN(p)) return null; var i = p + 1; return (i>=0 && i<N) ? i : null; }

  var SECTIONS = [
    ["Portada", -1, 0],
    ["Página de Título y Contactos", 1],
    ["Tabla de Contenidos", 3],
    ["Introducción", 5],
    ["Declaración de Propósitos", 6],
    ["Declaración de Fe", 7],
    ["Facilidades del Campus", 9],
    ["Admisiones e Inscripción", 17],
    ["Información Financiera", 21],
    ["Información Académica", 24],
    ["Información Estudiantil", 42],
    ["Reglamentos del Salón/Campus", 53],
    ["Bienvenida — Instituto Bíblico River", 57],
    ["Descripciones de Clases", 58],
    ["Facultad y Oficiales", 66],
    ["Página de Firma", 67]
  ];

  /* ---------- DOM ---------- */
  var stage = document.getElementById("stage"),
      book = document.getElementById("book"),
      halfL = document.getElementById("halfL"),
      halfR = document.getElementById("halfR"),
      scrub = document.getElementById("scrub"),
      counter = document.getElementById("counter"),
      bPrev = document.getElementById("bPrev"),
      bNext = document.getElementById("bNext"),
      gopop = document.getElementById("gopop"),
      goInput = document.getElementById("goInput"),
      goBtn = document.getElementById("goBtn"),
      scrim = document.getElementById("scrim");

  /* ---------- state ---------- */
  var FSIZES = [14, 15.5, 17, 18.5];
  var fsi = 1;
  var duo = window.innerWidth >= 900;   /* two-page mode */
  var userMode = null;                  /* null = auto */
  var spread = 0;                       /* duo: spread index; solo: page index */
  var animating = false;
  var pageW = 0, pageH = 0;
  var fitCache = {};                    /* key: idx|w|h|fs -> multiplier */

  function maxSpread(){ return duo ? Math.ceil((N-1)/2) : N-1; }
  function spreadPages(s){
    if(!duo) return [null, s];
    if(s === 0) return [null, 0];
    var L = 2*s - 1, R = 2*s;
    return [L < N ? L : null, R < N ? R : null];
  }
  function idxToSpread(i){ return duo ? Math.ceil(i/2) : i; }

  /* ---------- page rendering ---------- */
  function buildPage(idx){
    var el = document.createElement("div");
    el.className = "page";
    if(idx === null || idx === undefined || idx < 0 || idx >= N){
      el.classList.add("blank");
      return el;
    }
    var pg = PAGES[idx];
    if(pg.cls) el.className += " " + pg.cls;
    var special = pg.cls === "cover" || pg.cls === "backcover";
    if(pg.cls === "cover" || pg.cls === "backcover"){
      el.className += " img";
      el.innerHTML = '<div class="pbody"><img class="coverimg" alt="" src="' +
                     (pg.cls === "cover" ? COVER_IMG : BACK_IMG) + '"></div>';
      return el;
    }
    var head = "";
    if(!special && pg.sec){
      head = '<div class="phead"><div class="st">' + pg.sec + '</div><div class="rule"></div></div>';
    }
    var foot = "";
    if(!special && pg.n){
      foot = '<div class="pfoot">' + pg.n + '</div>';
    }
    el.innerHTML = head + '<div class="pbody">' + (pg.h || "") + '</div>' + foot;
    return el;
  }

  function fitPage(el, idx){
    /* Shrink font until the body fits; guarantees no internal scrolling. */
    if(idx === null || idx === undefined) return;
    var pg = PAGES[idx];
    if(pg && (pg.cls === "cover" || pg.cls === "backcover" || pg.cls === "blank")){
      el.style.fontSize = (FSIZES[fsi] * (pageW/430)) + "px";
      return;
    }
    var base = FSIZES[fsi];
    var key = idx + "|" + pageW + "|" + pageH + "|" + base;
    var body = el.querySelector(".pbody");
    if(!body) return;
    if(fitCache[key] !== undefined){
      el.style.fontSize = (base * fitCache[key]) + "px";
      return;
    }
    var fits = function(){ return body.scrollHeight <= body.clientHeight + 1; };
    el.style.fontSize = base + "px";
    if(fits()){ fitCache[key] = 1; return; }
    var lo = 0.35, hi = 1, m;
    for(var k = 0; k < 9; k++){
      m = (lo + hi) / 2;
      el.style.fontSize = (base * m) + "px";
      if(fits()) lo = m; else hi = m;
    }
    el.style.fontSize = (base * lo) + "px";
    if(!fits()){ el.style.fontSize = (base * 0.34) + "px"; lo = 0.34; }
    fitCache[key] = lo;
  }

  function mountPage(container, idx){
    container.innerHTML = "";
    if(idx === null){ container.classList.add("empty"); return; }
    container.classList.remove("empty");
    var el = buildPage(idx);
    container.appendChild(el);
    fitPage(el, idx);
  }

  /* ---------- layout ---------- */
  function layout(){
    var autoDuo = window.innerWidth >= 900;
    duo = userMode === null ? autoDuo : userMode === "duo";
    var sw = stage.clientWidth - 18, sh = stage.clientHeight - 18;
    var ar = 619/828;
    pageH = sh;
    pageW = Math.round(pageH * ar);
    var totalW = duo ? pageW * 2 : pageW;
    if(totalW > sw){
      totalW = sw;
      pageW = duo ? Math.floor(sw/2) : sw;
      pageH = Math.min(sh, Math.round(pageW / ar));
      pageW = Math.round(pageH * ar);
      totalW = duo ? pageW*2 : pageW;
    }
    book.style.width = totalW + "px";
    book.style.height = pageH + "px";
    book.className = "book " + (duo ? "duo" : "single");
    halfL.style.width = pageW + "px";
    halfR.style.width = pageW + "px";
    halfR.style.left = duo ? pageW + "px" : "0px";
    halfL.style.display = duo ? "" : "none";
    document.getElementById("bMode").classList.toggle("on", duo);
    scrub.max = maxSpread();
    render();
  }

  function render(){
    var sp = spreadPages(spread);
    if(duo){
      mountPage(halfL, sp[0]);
      mountPage(halfR, sp[1]);
    }else{
      mountPage(halfR, spread);
    }
    scrub.value = spread;
    updateChrome();
  }

  function labelFor(i){
    if(i === null || i < 0 || i >= N) return null;
    var pg = PAGES[i];
    if(pg.cls === "cover") return "Portada";
    if(pg.cls === "backcover") return "Contraportada";
    return pg.n ? pg.n : "·";
  }
  function updateChrome(){
    var sp = spreadPages(spread), txt;
    if(duo){
      var a = labelFor(sp[0]), b = labelFor(sp[1]);
      if(a && b) txt = "Pág " + a + "–" + b;
      else txt = (b === "Portada" || a === "Portada") ? "Portada" : (a || b || "—");
      if(a === null && b) txt = (b === "Portada") ? "Portada" : "Pág " + b;
      if(b === null && a) txt = "Pág " + a;
    }else{
      var l = labelFor(spread);
      txt = (l === "Portada" || l === "Contraportada") ? l : "Pág " + l;
    }
    counter.textContent = txt;
    bPrev.disabled = spread <= 0;
    bNext.disabled = spread >= maxSpread();
    var list = document.getElementById("contentsList");
    if(list.dataset.built){
      var cur = duo ? (sp[1] !== null ? sp[1] : sp[0]) : spread;
      var items = list.children;
      for(var i = 0; i < items.length; i++){
        var tgt = parseInt(items[i].dataset.idx, 10);
        var nxt = (i+1 < items.length) ? parseInt(items[i+1].dataset.idx, 10) : N;
        items[i].classList.toggle("now", cur >= tgt && cur < nxt);
      }
    }
  }

  /* ---------- turning (no stale-page flash) ----------
     The statics under the leaf are switched to the NEW spread at the
     START of the turn; the leaf carries the outgoing page on its front
     and the incoming facing page on its back. When the animation ends,
     the leaf's back is pixel-aligned over the remaining static, which is
     swapped synchronously in the same frame the leaf is removed. */
  function turn(dir){
    var target = spread + dir;
    if(target < 0 || target > maxSpread()) return;
    if(animating){ return; }
    if(reduced){ spread = target; render(); return; }
    animating = true;

    if(!duo){
      /* single page: static behind becomes the new page immediately */
      var leaf = document.createElement("div");
      leaf.className = "leaf solo";
      leaf.style.width = pageW + "px";
      var face = document.createElement("div");
      face.className = "face";
      var oldEl = buildPage(spread);
      face.appendChild(oldEl);
      leaf.appendChild(face);
      book.appendChild(leaf);
      fitPage(oldEl, spread);
      spread = target;
      mountPage(halfR, spread);
      scrub.value = spread; updateChrome();
      leaf.classList.add(dir > 0 ? "goF" : "goB");
      var done = false;
      var finish = function(){ if(done) return; done = true; if(leaf.parentNode) leaf.parentNode.removeChild(leaf); animating = false; };
      leaf.addEventListener("animationend", finish);
      setTimeout(finish, 700);
      return;
    }

    var oldSp = spreadPages(spread);
    var newSp = spreadPages(target);
    var leaf = document.createElement("div");
    leaf.style.width = pageW + "px";
    var fFront = document.createElement("div"); fFront.className = "face front";
    var fBack  = document.createElement("div"); fBack.className  = "face back";
    leaf.appendChild(fFront); leaf.appendChild(fBack);

    var frontEl, backEl;
    if(dir > 0){
      /* forward: leaf over RIGHT half; front = old right, back = new left.
         Right static becomes NEW right at start. Left static swaps at end. */
      leaf.className = "leaf turnF";
      leaf.style.left = pageW + "px";
      frontEl = buildPage(oldSp[1]); backEl = buildPage(newSp[0]);
      fFront.appendChild(frontEl); fBack.appendChild(backEl);
      book.appendChild(leaf);
      fitPage(frontEl, oldSp[1]); fitPage(backEl, newSp[0]);
      mountPage(halfR, newSp[1]);
    }else{
      /* backward: leaf over LEFT half; front = old left, back = new right.
         Left static becomes NEW left at start. Right static swaps at end. */
      leaf.className = "leaf turnB";
      leaf.style.left = "0px";
      frontEl = buildPage(oldSp[0]); backEl = buildPage(newSp[1]);
      fFront.appendChild(frontEl); fBack.appendChild(backEl);
      book.appendChild(leaf);
      fitPage(frontEl, oldSp[0]); fitPage(backEl, newSp[1]);
      mountPage(halfL, newSp[0]);
    }

    spread = target;
    scrub.value = spread; updateChrome();

    /* start animation next frame so initial transform paints */
    requestAnimationFrame(function(){ leaf.classList.add("go"); });

    var done = false;
    var finish = function(){
      if(done) return; done = true;
      /* swap the remaining static in the same frame the leaf is removed —
         the leaf's back face is exactly covering it, so no flash. */
      if(dir > 0) mountPage(halfL, newSp[0]);
      else mountPage(halfR, newSp[1]);
      if(leaf.parentNode) leaf.parentNode.removeChild(leaf);
      animating = false;
    };
    leaf.addEventListener("animationend", finish);
    setTimeout(finish, 900); /* safety net */
  }

  function goToSpread(s, animate){
    s = Math.max(0, Math.min(maxSpread(), s));
    if(s === spread) return;
    if(animate !== false && Math.abs(s - spread) === 1 && !reduced){ turn(s - spread); return; }
    if(animating) return;
    spread = s; render();
  }
  function goToIdx(i){
    if(i === null) return;
    goToSpread(idxToSpread(i), false);
  }
  function goToPrinted(p){
    var i = printedToIdx(p);
    if(i !== null) goToIdx(i);
  }

  /* ---------- controls ---------- */
  bNext.onclick = function(){ turn(1); };
  bPrev.onclick = function(){ turn(-1); };
  scrub.addEventListener("input", function(){ goToSpread(parseInt(scrub.value,10), false); });

  document.addEventListener("keydown", function(e){
    if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    if(e.key === "ArrowRight" || e.key === "PageDown"){ e.preventDefault(); turn(1); }
    else if(e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); turn(-1); }
    else if(e.key === "Home"){ goToSpread(0, false); }
    else if(e.key === "End"){ goToSpread(maxSpread(), false); }
  });

  /* click page edges to turn */
  book.addEventListener("click", function(e){
    var t = e.target;
    while(t && t !== book){
      if(t.classList && t.classList.contains("pgref")){
        goToPrinted(t.getAttribute("data-p"));
        return;
      }
      t = t.parentNode;
    }
    var r = book.getBoundingClientRect();
    var x = e.clientX - r.left;
    if(x > r.width * 0.72) turn(1);
    else if(x < r.width * 0.28) turn(-1);
  });

  /* swipe */
  var tx = null, ty = null;
  stage.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1) return;
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  stage.addEventListener("touchend", function(e){
    if(tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    tx = ty = null;
    if(Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.4){
      turn(dx < 0 ? 1 : -1);
    }
  }, {passive:true});

  /* text size */
  /* one/two page toggle */
  document.getElementById("bMode").onclick = function(){
    var sp = spreadPages(spread);
    var anchor = duo ? (sp[1] !== null ? sp[1] : (sp[0] !== null ? sp[0] : 0)) : spread;
    userMode = duo ? "solo" : "duo";
    duo = userMode === "duo";
    spread = idxToSpread(anchor);
    layout();
  };

  /* go-to-page popover */
  counter.onclick = function(){
    gopop.classList.toggle("open");
    if(gopop.classList.contains("open")){ goInput.value = ""; goInput.focus(); }
  };
  function doGo(){
    var v = parseInt(goInput.value, 10);
    if(!isNaN(v)){ goToPrinted(v); gopop.classList.remove("open"); }
  }
  goBtn.onclick = doGo;
  goInput.addEventListener("keydown", function(e){ if(e.key === "Enter") doGo(); });
  document.addEventListener("click", function(e){
    if(gopop.classList.contains("open") && !gopop.contains(e.target) && e.target !== counter){
      gopop.classList.remove("open");
    }
  });

  /* ---------- drawers ---------- */
  function openDrawer(id){
    closeDrawers();
    document.getElementById(id).classList.add("open");
    scrim.classList.add("show");
  }
  function closeDrawers(){
    document.getElementById("dContents").classList.remove("open");
    document.getElementById("dSearch").classList.remove("open");
    scrim.classList.remove("show");
  }
  document.getElementById("bContents").onclick = function(){ openDrawer("dContents"); };
  document.getElementById("bSearch").onclick = function(){
    openDrawer("dSearch");
    setTimeout(function(){ document.getElementById("q").focus(); }, 250);
  };
  scrim.onclick = closeDrawers;
  var xs = document.querySelectorAll("[data-close]");
  for(var i = 0; i < xs.length; i++) xs[i].onclick = closeDrawers;
  document.addEventListener("keydown", function(e){ if(e.key === "Escape"){ closeDrawers(); gopop.classList.remove("open"); } });

  /* contents list */
  (function buildContents(){
    var list = document.getElementById("contentsList");
    var html = "";
    for(var i = 0; i < SECTIONS.length; i++){
      var s = SECTIONS[i];
      var idx = s.length > 2 ? s[2] : printedToIdx(s[1]);
      html += '<button class="citem" data-idx="' + idx + '"><b>' + s[0] + '</b><span>' +
              (s[1] > 0 ? "p. " + s[1] : "") + '</span></button>';
    }
    list.innerHTML = html;
    list.dataset.built = "1";
    list.addEventListener("click", function(e){
      var t = e.target;
      while(t && t !== list && !t.classList.contains("citem")) t = t.parentNode;
      if(t && t.classList && t.classList.contains("citem")){
        goToIdx(parseInt(t.dataset.idx, 10));
        closeDrawers();
      }
    });
  })();

  /* ---------- search ---------- */
  var textIdx = null;
  function buildTextIndex(){
    if(textIdx) return;
    textIdx = [];
    var tmp = document.createElement("div");
    for(var i = 0; i < N; i++){
      tmp.innerHTML = PAGES[i].h || "";
      var t = (tmp.textContent || "").replace(/\s+/g, " ").trim();
      textIdx.push({ i: i, low: t.toLowerCase(), raw: t });
    }
  }
  function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function search(q){
    buildTextIndex();
    q = q.trim().toLowerCase();
    var out = [];
    if(q.length < 2) return out;
    for(var i = 0; i < textIdx.length; i++){
      var e = textIdx[i], pos = e.low.indexOf(q);
      if(pos === -1) continue;
      var count = 0, p = pos;
      while(p !== -1 && count < 99){ count++; p = e.low.indexOf(q, p + q.length); }
      var a = Math.max(0, pos - 55), b = Math.min(e.raw.length, pos + q.length + 75);
      var snip = (a > 0 ? "…" : "") + e.raw.slice(a, b) + (b < e.raw.length ? "…" : "");
      out.push({ i: e.i, count: count, snip: snip, q: q });
      if(out.length >= 60) break;
    }
    return out;
  }
  var qEl = document.getElementById("q"), sres = document.getElementById("sresults");
  var qT = null;
  qEl.addEventListener("input", function(){
    clearTimeout(qT);
    qT = setTimeout(function(){
      var q = qEl.value;
      if(q.trim().length < 2){
        sres.innerHTML = '<div class="snone">Type at least two letters to search every page of the handbook.</div>';
        return;
      }
      var res = search(q);
      if(!res.length){
        sres.innerHTML = '<div class="snone">No matches for “' + esc(q) + '”.</div>';
        return;
      }
      var html = "";
      for(var i = 0; i < res.length; i++){
        var r = res[i], pg = PAGES[r.i];
        var label = pg.n ? "pág. " + pg.n : (pg.cls === "cover" ? "Portada" : "—");
        var title = pg.t || pg.sec || "Página";
        var rx = new RegExp("(" + r.q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
        var snip = esc(r.snip).replace(rx, "<mark>$1</mark>");
        html += '<button class="sres" data-idx="' + r.i + '"><span class="rt"><b>' + esc(title) +
                '</b><span>' + label + (r.count > 1 ? " · " + r.count + "×" : "") + '</span></span><p>' + snip + '</p></button>';
      }
      sres.innerHTML = html;
    }, 160);
  });
  sres.addEventListener("click", function(e){
    var t = e.target;
    while(t && t !== sres && !(t.classList && t.classList.contains("sres"))) t = t.parentNode;
    if(t && t.classList && t.classList.contains("sres")){
      goToIdx(parseInt(t.dataset.idx, 10));
      closeDrawers();
    }
  });

  /* ---------- print ---------- */
  var printBuilt = false;
  function buildPrint(){
    if(printBuilt) return;
    printBuilt = true;
    var pa = document.getElementById("printall");
    var frag = document.createDocumentFragment();
    for(var i = 0; i < N; i++){
      var wrap = document.createElement("div");
      wrap.className = "ppage";
      wrap.appendChild(buildPage(i));
      frag.appendChild(wrap);
    }
    pa.appendChild(frag);
  }
  if(window.matchMedia){
    try{
      matchMedia("print").addEventListener("change", function(m){ if(m.matches) buildPrint(); });
    }catch(e){}
  }
  window.addEventListener("beforeprint", buildPrint);

  /* ---------- resize ---------- */
  var rT = null;
  window.addEventListener("resize", function(){
    clearTimeout(rT);
    rT = setTimeout(function(){
      var anchor;
      var sp = spreadPages(spread);
      anchor = duo ? (sp[1] !== null ? sp[1] : (sp[0] !== null ? sp[0] : 0)) : spread;
      layout();
      /* re-anchor if mode auto-switched */
      spread = idxToSpread(anchor);
      render();
    }, 120);
  });

  layout();
})();
</script>
</body>
</html>
